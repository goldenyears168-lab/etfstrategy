version: rrg-pre-release-funnel-3d-v1
model_id: rrg-pre-release-funnel-3d
layer: research
description: Pre-release funnel lanes · 3-day hold (D→D+3). Strict R01–R30 re-evaluated
  on ret_3d; coverage C01–Cxx discovered separately.
universe:
  source: build_lifecycle_events + enrich_lifecycle_events
  pool_filter: '(end_q ∈ {improving, lagging}) ∧ sig_ret < 5% ∧ (end_q=improving ∨
    (end_q=lagging ∧ (disp_contract ∨ sig_ret>0.5%)))

    '
  outcome: ret_3d
  pit: true
  hold_days: 3
discovery:
  enabled: true
  max_lanes: 30
  win_min: 0.52
  mean_min: 3.0
  mean_max: 7.0
  n_min: 20
  n_min_extended: 15
  mean_min_extended: 0.8
  jaccard_max: 0.32
  target_union_days_per_year:
  - 50
  - 80
  search_atoms:
  - b0
  - b1
  - b2
  - disp
  - base
  - st46
  - st13
  - st1
  - st7p
  - hist
  - plag
  - elag
  - dip
  - flat
  - q35
  - q45
  - ex
  - s2
  - rv98
  - no23
  - gap1
  - s0
  - imp
  - dip_deep
  - rv98100
  min_combo_size: 2
  max_combo_size: 6
  jaccard_max_vs_coverage: 0.45
atoms:
  b2:
    label: 台指當日 ≥+2%
    en: bench_today_ret ≥ 2%
  b1:
    label: 台指當日 ≥+1%
    en: bench_today_ret ≥ 1%
  b0:
    label: 台指當日 ≥0%
    en: bench_today_ret ≥ 0%
  disp:
    label: 離散度收斂
    en: disp_contract (Δdisp < −0.1)
  base:
    label: Base setup
    en: base_setup (up_right · 4d improving · disp band)
  st46:
    label: Improving streak 4–6 天
    en: improve_streak ∈ [4, 6]
  st13:
    label: Improving streak 1–3 天
    en: improve_streak ∈ [1, 3]
  st1:
    label: Improving streak = 1
    en: improve_streak == 1
  st7p:
    label: Improving streak ≥7
    en: improve_streak ≥ 7
  hist:
    label: 個股 pre-release 3日史績正向
    en: sid_hist_ok (≥3 prior pre-release · positive avg ret_3d)
  plag:
    label: 前日 Lagging
    en: prev_end_q == lagging
  elag:
    label: 當日 Lagging pre-flip
    en: end_q == lagging
  dip:
    label: 微幅回檔
    en: sig_ret ∈ [−2%, 0%]
  dip_deep:
    label: 深 dip
    en: sig_ret ∈ [−4%, −1%)
  flat:
    label: 平盤帶
    en: sig_ret ∈ [−1%, +1%]
  q35:
    label: 準 burst 3–5%
    en: sig_ret ∈ [3%, 5%)
  q45:
    label: 準 burst 4–5%
    en: sig_ret ∈ [4%, 5%)
  ex:
    label: 落後大盤蓄力
    en: excess ∈ [−2%, −0.3%]
  s2:
    label: S2 setup core
    en: s2_setup_core
  rv98:
    label: RS-Ratio 98–99
    en: s4_rv_98_99
  rv98100:
    label: RS-Ratio 98–100
    en: rv ∈ [98, 100)
  no23:
    label: 排除 streak 2–3
    en: NOT improve_streak ∈ {2, 3}
  gap1:
    label: 連續交易日
    en: session_gap_days == 1
  s0:
    label: Fresh flip Improving
    en: s0_fresh_flip
  imp:
    label: 當日 Improving
    en: end_q == improving
