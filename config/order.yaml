      2026-08-09 資金風控收尾（trial registry topic_id：tx-native-hyperparameter-sweep、
      proactive-capital-sizing-rule、capital-300k-margin-cap-convention-test、
      300k-per-position-margin-cap-capital-plan、entry-rate-limit-vs-capital-rules）：
      · 超參數原生TX重掃：60組合(窗口10/15/20/30分×門檻0.2-1.0%×確認窗5/10/15分)
        全數樣本數過關，訓練期選出「確認窗5分」比現行10分樣本外sharpe_like更高
        (0.40 vs 0.37)，但單次walk-forward、60組合無多重比較校正，僅為「有跡象」，
        本yaml保留confirm_minutes=10（較保守、驗證次數較多的設定），5分是未來
        可考慮的優化候選，非本次定案內容。
      · 資金風控四輪嘗試，全數未能把最大回檔壓到15%追繳警戒區以下，因此定案為
        risk_controls: none（不設任何機制，見上方position_sizing）：
        (a) 被動式margin call（見缺口5段落）——強砍反而讓回檔更差，已否決。
        (b) 主動式限倉/資金緩衝（同時在場口數上限5-30口、資金使用率50-80%，
            2M/5M資金規模組合測試）——沒有任何組合避開15-20%警戒區，根因是
            回檔以%計算，部位/資金等比例縮小不會讓相關性虧損的%佔比下降。
        (c) 每部位30萬保證金上限（比照dayflip-futures-short的margin_cap_twd，
            放大到約8口/部位）配3-20個部位對應的90萬-600萬總資金——Sharpe不差
            (3.0-3.2)但最大回檔仍全數落在24-36%，600萬/20部位仍有-24.3%。
        (d) 限制新進場速率（過去5/10/20日內最多開3-15個新部位，超過就跳過
            n_seats較低的候選）——結果比不限制更差：擋掉部分訊號並未降低
            留下的部位彼此的相關性，同一波壞行情打過來時留下的部位一樣同時
            受傷，還少了分散/平均雜訊的機會，多數情境Sharpe與回檔雙雙惡化。
      · 結論：最大回檔集中在同幾個「壞日子」是這批分點T0買超訊號本身的相關性
        結構（分點事件不是隨機分散的），不是資金/部位/速率規則能化解的，四個
        角度都驗證過。定案：以「小規模衛星倉位」定位這個策略——
        2,000,000 NTD（四種無風控機制情境中最佳風險調整報酬：Sharpe約2.6，
        歷史最大回檔約-30%，接近但不是唯一的最佳選擇，僅代表已測試範圍內
        風險報酬平衡點），不疊加任何額外風控機制，明確接受-30%量級的回檔
        為此策略的固有特徵。若未來要放大規模，需要的不是更精細的資金規則，
        是跟這個訊號源不相關的其他alpha疊加做真分散，或是接受此策略永遠
        只能是小倉位配置，這兩者都超出本條研究線範圍。

      2026-08-09 日報酬追查發現單一標的集中度問題（trial registry topic_id：
      post-dump-long-single-name-concentration-cap）：使用者問「日報酬是多少」
      時，用2,000,000 NTD情境算出日均報酬+0.75%、日std5.33%、最差單日-27.7%
      （2026-02-02）。追查該單日發現：8299同一檔股票疊了兩筆部位，保證金合計
      1,170,210 NTD（佔總資金58.5%），名目曝險（保證金/0.135≈7.4倍槓桿）約
      867萬NTD對200萬本金；週末過後股價從波段高點2410回落到2170，未實現獲利
      蒸發才是-27.7%的主因，不是四筆出場當天的已實現損益（合計僅-30,390 NTD）。
      這代表run_simulation()完全沒有「單一標的名目曝險上限」，同一檔股票連續
      觸發訊號會無上限疊倉。
      補測「單一標的累計保證金／總資金」上限（10/15/20/30/50%/無上限）後，
      發現這是五種風控嘗試中第一個「真的有改善」的（前四種margin call/
      同時在場口數上限/資金緩衝/新進場速率限制全部沒改善或更差，見上方
      「資金風控收尾」段落）：
      · 20%上限：total_ret 386.6%→315.3%、Sharpe 2.233→2.820（不降反升）、
        max_dd -31.1%→-28.1%、日std 5.33%→3.41%、最差單日-27.7%→-10.5%。
      · 10%上限（更保守）：total_ret降到208.0%、Sharpe 2.807、max_dd -17.7%
        （目前測過最好的回檔數字）、日std2.64%、最差單日-11.4%。
      · 30%以上跟無上限差異不大（max_dd仍卡在-28~-31%區間），代表上限要設在
        20%以下才有實質效果。
      跟前四種風控嘗試的關鍵差異：前四種（margin call、同時在場口數、資金緩衝、
      進場速率）都是「事後」或「總量」限制，沒有處理「同一訊號源反覆命中同一
      標的」這個真正造成尾部風險的集中度問題；單一標的上限直接切斷這個管道，
      所以有效。⚠️限制：全樣本一次性掃描非walk-forward（機制性風控，非配適
      參數）；8299這個極端案例樣本內只出現一次，無法排除其他標的未來出現類似
      情境的機率；集中度只算同一標的，沒算同產業/相關標的跨股集中度。
      本yaml目前risk_controls仍維持none、accepted_max_drawdown_pct仍是-30，
      因為single_name_notional_cap_pct該設多少（10%犧牲近半報酬換最低回檔，
      20%報酬砍剩約81%換中等回檔改善）尚未由使用者定案，同時也跟尚未解決的
      total_capital_ntd（2M vs 300k）問題互相牽動，不應該在那題定案前先鎖定
      這題。

