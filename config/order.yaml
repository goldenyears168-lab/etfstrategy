# Order layer · 下單層（券商 API · 帳務 · 委託）
# 密碼與 API Key 僅放 .env，勿寫入本檔
# SDK 文件：https://www.fbs.com.tw/TradeAPI/docs/trading/quickstart
#
# Live sleeves：C18acc + Leading Dip + Songshan copytrade（觀測進場）+ Detach Gate。
# ABC v3+F1：已自 Order 移除（2026-07-16）。舊持倉視為手動單，不做 sleeve 互斥。
# Research／strategy 契約：config/strategy.yaml · src/research/**（與下單層無關）。
#
# 2026-07-29：下單層全數暫停（各袖套獨立旗標 + launchctl disable，見
# config/job_registry.yaml）。新增總開關 .env 的 ORDER_MASTER_ENABLED
# （預設0）：任何一個 sleeve 要真的送單，除了自己的旗標，還要這個總開關=1
# 才行——見 src/order/fubon_orders.py::order_master_enabled()、config/job_registry.yaml。

version: order-v1
layer: order

broker:
  id: fubon_neo
  sdk_version: "2.2.8"
  python_venv: .venv-fubon
  python_max: "3.13"
  wheel: CAFubon/fubon_neo-2.2.8-cp37-abi3-macosx_11_0_arm64.whl

account:
  user_id_env: FUBON_USER_ID
  password_env: FUBON_PASSWORD
  cert_path_env: FUBON_CERT_PATH
  cert_password_env: FUBON_CERT_PASSWORD
  api_key_env: FUBON_API_KEY
  default_cert_path: CAFubon/N125801238/N125801238.pfx

reports:
  root: reports/order
  snapshots: reports/order/snapshots
  intents: reports/order/intents

# 策略層 → 下單層契約（JSON SSOT · schema: order-intent-v1）
# 策略腳本寫入 reports/order/intents/{strategy_id}_{as_of}.json
# 執行：.venv-fubon/bin/python scripts/order/submit_intents.py <path> --dry-run|--submit
intent:
  schema_version: order-intent-v1
  legacy_schema_versions:
    - execution-intent-v1
  default_dir: reports/order/intents
  # 未指定 price_type 時：限價追賣一（盤中零股 · 送單當下查價）
  default_price_mode: chase_ask

strategies:
  # Leading Dip · Strategy 採納 2026-07-16（coverage 主軌 + mid 衛星）
  # Spec SSOT: config/strategy.yaml · Order: src/order/leading_dip_order.py
  # Dual-sleeve: coverage 昨收錨 + mid ≥10:00 今開錨 · 預算 2 萬/筆 · live
  leading-dip:
    pool_id: leading-dip
    strategy_id: leading-dip
    enabled: true
    budget_twd: 20000
    max_entries_per_day: 4
    hold_days: 3
    require_t2: false  # coverage · 含開盤
    price_type: chase_ask
    exit_price_type: chase_bid
    market_type: intraday_odd
    time_in_force: rod
    user_def: ldip
    slots:
      default_day_cap: 2
      expand_cap: 4
      hard_cap: 4
      busy_n: 3
      crash_rb_min: -1.5
      total_open_cap: 6
    mid:
      enabled: true
      strategy_id: leading-dip-mid
      user_def: ldipm
      budget_twd: 20000
      minute_lo: "10:00"
      excess_anchor: open  # vs session open · gap∩excess
      require_t2: false
      max_entries_per_day: 2
      own_ledger: data/order/leading_dip_mid_ledger.json
      slots:
        default_day_cap: 1
        expand_cap: 2
        hard_cap: 2
        total_open_cap: 3
    isolation:
      exclude_c18acc_slots: true
      exclude_abc_ledger: false  # ABC Order 已移除 · 舊倉當手動單
      own_ledger: data/order/leading_dip_ledger.json
      poll_script: scripts/order/run_leading_dip_poll.py
      launchd: com.jackm4.goldenstocks.leading-dip-poll
    notes: >
      Strategy 採納 2026-07-16 · main=coverage yday excess · mid=≥10:00 open-anchor.
      Budget 20k/entry · live via ORDER_LEADING_DIP_DRY_RUN=0 AUTO_SUBMIT=1.
      Cross-exclude C18/peer sleeve（不含 ABC）。Env: ORDER_LEADING_DIP_* · ORDER_LEADING_DIP_MID_*.
    # env：ORDER_LEADING_DIP_* / ORDER_LEADING_DIP_MID_*

  # 跟單松山 · 五日累積淨比95 ∩ !mega + entry_25m_nonfail · 預算約 10 萬零股
  # Signal = 昨交易日 scan；T+1 09:25–09:40 live 非 fail 後 chase_ask 零股
  songshan-copytrade:
    pool_id: songshan-copytrade
    strategy_id: songshan-copytrade
    enabled: true
    dry_run: true  # live: ORDER_SONGSHAN_COPYTRADE_DRY_RUN=0
    auto_submit: true
    budget_twd: 100000  # 約 10 萬台幣（預算制；零股）
    quantity_shares: null  # null = 用 budget_twd 計算股數
    branch_id: "9217"
    buy_floor: 50000000  # 0.5億
    net_min: 0.95
    entry_after: "09:25"
    entry_until: "09:40"
    price_type: chase_ask
    market_type: intraday_odd  # 預算制預設零股；≥1000 股自動改 common
    user_def: ss5d  # client_intent_id 前綴（非 broker 端實際 user_def；見下方 notes）
    hold_days: 7
    allow_pyramid: false  # 已買過不重複；加碼規格未採納前保持 false
    submit_notify: true
    ledger: data/order/songshan_copytrade_ledger.json
    mega_path: reports/research/branch-footprint-screen/ab58_xMega_copytrade/mega_blacklist_v1.json
    poll_script: scripts/order/run_songshan_copytrade_poll.py
    launchd: com.jackm4.goldenstocks.songshan-copytrade-poll
    notes: >
      Research 冠軍路徑進 Order（2026-07-22）。預算制 10 萬零股（2026-07-24 改）。
      夜信尺同名；進場須 25m 非 fail。僅進場（hold_days 參數無自動出場；暫接受）。
      本袖已 submitted/filled/working 的標的不重複買（allow_pyramid=false）。
      運維 SSOT：config/job_registry.yaml。
      Env: ORDER_SONGSHAN_COPYTRADE_* · RUN_SONGSHAN_COPYTRADE_POLL.
      2026-08-08 code review：改用 order.oms_lifecycle 的 build_client_intent_id
      （以 signal_date+entry_after+symbol 組，跨 09:25–09:40 窗口內每個 poll tick
      不變）+ reconcile_before_submit，補上 broker 端冪等檢查——原本若
      place_resolved_order 已成功送出真單、但程式在 save_ledger() 之前被中斷，
      下一 tick 會因為 ledger 沒寫入而重複送單；現在 reconcile 會先問 broker 這個
      client_intent_id 是否已有訂單，有的話沿用結果不重送。broker 端 user_def
      因此從固定字串 "ss5d" 改成完整 client_intent_id（例：ss5d_20260721_0925_2492），
      不影響任何既有 consumer（未見其他程式碼比對這個欄位的固定值）。

  momentum-rotation:
    pool_id: momentum-rotation
    strategy_id: momentum-rotation
    enabled: true
    dry_run: true  # dry-run-first 預設（比照 leading-dip/songshan/expert-pool/detach-gate，
    # 不是 dayflip-futures-short 那種例外）；ORDER_MOMENTUM_ROTATION_AUTO_SUBMIT 需另外
    # 明確設1才會送真單，見下方 notes
    auto_submit: false
    instrument: individual_stock_futures
    universe: ["3017","6213","2345","2383","3532","2455","3374","6488","2492","2376","3035","2049"]
    breakout_pct: 0.5
    trail_pct: 1.0
    vol_confirm_mult: 1.5
    rearm_pct: 0.25
    min_overshoot_pct: 0.15
    min_vol_ratio: 1.5
    preempt_mult: 2.0
    max_consecutive_entry_failures: 5  # 2026-08-12補上：比照dayflip-short-poll 2026-08-10真實事故（券商帳戶額度問題連續打44次API）的教訓，進場端連續失敗達此次數即halted=True，今天不再嘗試新進場；出場端刻意不設上限（放棄=留孤兒曝險，見src/order/momentum_rotation_order.py _close_position docstring）
    daily_loss_limit_pct: -3.0  # 2026-08-12新增：trades_today的ret_pct加總<=此值即halted=True，且立刻強制平掉當下持倉（不等13:40）
    lots: 1  # 2026-08-12 使用者決策：第一階段固定1口，不按保證金打滿（見下方notes）
    margin_budget_twd: 110000  # 2026-08-12 使用者指定；第一階段僅供未來「打滿口數」模式參考，lots 固定1口時不生效
    entry_at: "08:45"
    force_close_at: "13:40"
    stop_loss: trail_1pct  # 移動停利，非固定停損
    signal: reports/research/momentum_breakout_expert_pool_futures_summary.md
    ledger: data/order/momentum_rotation_ledger.json
    broadcast: data/order/momentum_rotation_broadcast.json  # schema momentum-rotation-broadcast-v1
    poll_script: scripts/order/run_momentum_rotation_worker.py
    launchd: com.jackm4.goldenstocks.momentum-rotation-poll
    monitor_ui: TBD  # port 8770 儀表板新分頁，尚未確認服務程式碼位置，見 notes
    notes: >
      2026-08-12 研究脈絡：12檔標的池（流動性≥300tick/日 + 借券餘額≤200 雙重篩選）、
      開盤±0.5%突破+量能≥1.5x中位數確認進場、1%移動停利、同檔一天可多次觸發（出場
      後需回檔到開盤價±0.25%才重新武裝）、單槽位輪動+動態搶佔（新訊號分數≥持倉
      進場分數2倍時提前平倉換股，2.0倍為掃參數得出的甜蜜點）。4段獨立市場狀態
      （漲盤/跌盤/盤整/全新未觸碰窗口）方向一致；擾動測試（6/6通過）、出場價逐筆
      核對（136筆抽查3筆有落差、方向混合非系統性偏袒、判斷為秒級時間戳雜訊）、
      報酬集中度檢查（拿掉表現最好前30筆/前5天仍為正）三項code audit均未發現bug。

      ⚠️ 回測「保證金打滿」版本日均報酬高達90%/天、連續75天無虧損日——已確認
      不可信（真實市場不會有策略連續75天不虧一天；壓力測試對成本不敏感本身就是
      不真實訊號）。

      ⚠️⚠️ 2026-08-13重大發現，取代下面所有舊估計（含曾經引用過的「3.58%/天」
      「+7%~+22%/天」都已知過時、不可信，見
      reports/research/momentum_breakout_expert_pool_futures_summary.md開頭
      的完整說明）：`simulate_portfolio_day`原本`fill`（算報酬用）無條件記成
      理論trigger價，但`overshoot`（算分數/決定搶不搶）用的是訊號當下真實tick
      價——兩者對不上，尤其preemption進場score越高代表overshoot越大，backtest
      卻假裝零滑價精準買在trigger，現實不可能。2026-08-13已直接修好SSOT本身
      （fill改用訊號當下實際tick價），重新驗證：

      · 4窗口(IS漲盤/OOS拉回/W3盤整/W4)合併75天/1273筆：gross日均**+1.669%**
        （不是+22.8%），**四個獨立窗口勝率全部在35.7%~43.7%，沒有一個超過50%**
      · 損益兩平來回成本只要**約9.8bps**——文件自己記錄的Roll(1984)成本範圍是
        5~29bps：只有成本落在最樂觀的5bps才勉強是正的(+0.82%/天)，10bps以上
        （仍在文件記錄範圍內）就翻負
      · 完整數字見reports/research/momentum_rotation_cost_adjusted_reaudit.json
        （腳本：scripts/research/momentum_rotation_cost_adjusted_reaudit.py，
        可重跑）

      **結論：這不是bug層級可以修好的問題，是目前這套規格（12檔UNIVERSE、0.5%
      突破、1%移動停利、2.0x搶佔倍數）在真實成交假設下，扣掉文件自己認定合理的
      成本區間就站不住腳。** 2026-08-13當天真人真金上線後4筆交易全虧
      （-2.77%naive加總），跟這個修復後的回測結論一致，不是live執行運氣不好。
      `ORDER_MOMENTUM_ROTATION_AUTO_SUBMIT`已改回0（dry-run），要重新上線前
      必須先重新設計規則本身（拉高品質門檻、放棄高頻搶佔、或收斂到真正低成本
      的標的），不是修bug就能恢復。

      ⚠️ 台指期同步校正版測試顯示約2/3報酬來自個股跟隨大盤同步走勢的系統性beta，
      非market-neutral（這個發現不受上面fill-price修復影響，仍然成立）。

      ⚠️ 回測用逐筆tick資料判斷突破/量能；即時執行2026-08-13已改用富邦
      intraday.trades()逐筆成交（不再是1分K近似，見
      src/order/momentum_rotation_tick_marketdata.py），這個粒度落差本身已解決，
      但上面fill-price的問題獨立於這個粒度問題、不受影響。

      2026-08-12分階段上線決策（已知過時，見上面2026-08-13發現）：第一階段
      dry-run觀察，固定1口/檔；第二階段視觀察結果決定是否開AUTO_SUBMIT——
      2026-08-13實際上線一天後又改回dry-run，就是這個「先上線觀察」流程本身
      發揮作用的例子。安全閥：ORDER_MASTER_ENABLED（總開關）+
      ORDER_MOMENTUM_ROTATION_AUTO_SUBMIT（本袖旗標，2026-08-13起預設0）+
      固定1口（不依保證金打滿）。

  dayflip-futures-short:
    pool_id: dayflip-futures-short
    strategy_id: dayflip-futures-short
    enabled: true
    dry_run: false  # ⚠️ 2026-08-07 使用者明確指示：不預設 dry-run，見下方 notes
    auto_submit: true
    instrument: individual_stock_futures  # 非 TX/TMF，透過同一套 fubon_futopt API
    lots: 1
    margin_cap_twd: 170000  # 2026-08-13使用者明確指示：實際準備資金只有17萬，先設17萬對齊(不是30萬)，若順利之後再加——硬上限，估算/真實保證金超過即跳過該候選
    signal: reports/research/branch-footprint-screen/dayflip_gapup_short/FROZEN_SPEC_V1.json
    entry_at: "08:45"
    entry_window_end: "09:05"
    cover_target_pct: 0.02  # 進場價 x0.98 限價回補
    force_close_at: "13:40"
    stop_loss: none  # 研究已證實加停損反而變差，故意不設
    fgap_min: 0.07  # 2026-08-10定案：從0.06改為0.07，見下方notes「fgap_min 6%→7%」段落——bootstrap驗證+呼應GAPUP_SHORT_SIZING.md原始建議
    fgap_max: 0.09  # 2026-08-10新增：漲停鎖死風控上限，見下方notes「2026-08-10漲停風控上限」段落——風控參數非報酬優化，比照fgap_min同一套SSOT讀取(src/order/dayflip_short_order.py的FGAP_MAX，缺key時fallback 0.09)
    pick_rule: gap_seat_rank_blend_w075  # 2026-08-10從smallest_qualifying_gap改為跳空75%+席數25%加權混合，見下方notes「2026-08-10排序法則加權混合」段落
    single_trade_per_day: true  # 只做一筆，不分散多檔
    ledger: data/order/dayflip_short_ledger.json
    poll_script: scripts/order/run_dayflip_short_worker.py  # 2026-08-08 起；舊 run_dayflip_short_poll.py 只剩手動測試用
    launchd: com.jackm4.goldenstocks.dayflip-short-poll
    monitor_ui: reports/research/channel_lab/live_v6_sim_server.py  # :8770「隔日沖空單」分頁
    notes: >
      2026-08-07 使用者明確授權跳過研究規格的 G2 OOS holdout 驗證關卡（當時前推僅
      5/40 訊號日）直接建置真實下單管道，且明確要求「建好就直接能送實單，不要
      預設 dry-run」——本袖因此不比照本檔其餘 sleeve 的 dry-run-first 慣例。
      安全閥仍然存在且不可繞過：.env 的 ORDER_MASTER_ENABLED（總開關）、
      ORDER_DAYFLIP_SHORT_AUTO_SUBMIT（本袖旗標）、保證金硬上限 30 萬、1 口、
      每交易日僅進場一次。個股期貨代碼經 resolve_futures_symbol() 即時驗證，
      查無資料一律 fail-closed 跳過該候選，不用未驗證代碼下單。

      ⚠️ 2026-08-08 code review 誠實補充：pick_rule=smallest_qualifying_gap 在
      single-pick研究裡「勝率最高/MaxDD最小」是真的，但 FROZEN_SPEC_V1.json 自己的
      rejected_and_do_not_retry 區塊同時記載：全部11種測過的排序法（含這個）表現
      都打平或輸給「隨機挑股號最小」的對照組——即整套排序邏輯本身未證實有edge，
      只是在「反正要選一個」的前提下這個選法相對不差。另外 order.yaml 引用的
      GAPUP_SHORT_SIZING.md 用的門檻其實是7%（非本檔案實際用的6%），且該文件
      自己§六結論是「不建議現在上線」（no edge in executable 3-7% range、IS弱、
      未做permutation/DSR校正）——此結論先前未反映在這份notes裡，一併補上。

      研究歷程與已知侷限見 GAPUP_SHORT_SIZING.md；已知問題：真實滑價未實測
      （估計13~76bps區間）、鎖漲停時能否強制平倉未驗證。
      stock_futures_universe.json 的157個舊式命名代碼已於2026-08-08清查完畢
      （23個修正為正確代碼、130個確認在TAIFEX現無活躍合約已移除，非僅runtime
      fallback）。同日另修：ADV 20日流動性濾網原本 fail-open 靜默失效近3週
      （快取停在07-20），已改 fail-closed 並補上增量更新腳本
      （scripts/research/refresh_dayflip_futures_daily_cache.py，已接進週五
      dayflip-seat-weekly-refresh）；entry/cover 下單例外處理補齊，詳見
      reports/research/creative_combo_2026-08-07/order_layer_health_review_20260808.md。

      2026-08-08：launchd 架構改 KeepAlive 常駐 worker（order.dayflip_short_worker_loop +
      dayflip_short_session_pool），取代原本 StartInterval 60s、08:44-13:41 每分鐘全新
      Fubon 登入（~297次/日，未驗證是否觸發券商 API 頻率限制）——跟 TMF 的
      tmf-channel-poll 同一套手法。in_dayflip_short_trade_window() 內建查星期幾
      （不只 HH:MM），避免重蹈 TMF 同日發現的週六 login-thrash bug。切換用
      scripts/order/dayflip_short_cutover.sh；寄信告警邏輯搬進 worker 內
      _maybe_alert()（原本 shell launcher 逐 tick grep stdout 的做法在常駐 process
      下不再適用）。

      2026-08-13 margin_cap_twd 30萬→17萬（使用者明確指示：實際只準備17萬，
      先對齊這個數字，順利再往上加）：
      · 背景：程式碼原本的 MARGIN_CAP_NTD 只是「單筆交易願意接受的保證金
        上限」，不會檢查使用者實際帳戶有多少可動用資金——如果只準備17萬、
        但當天候選的真實保證金落在17萬~30萬之間，程式仍會嘗試送單，結果
        會是被富邦以資金不足拒單（跟08-10財力證明額度被拒是類似性質但
        不同原因）。降低這個上限讓程式自己的保證金檢查先擋掉超過17萬的
        候選，不必等券商拒單才發現。
      · 空單目前只做「單筆交易」（single_trade_per_day），跟做多那邊的
