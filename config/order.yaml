        (bars.sqlite, source=tx_1m_tick_built_582d, sess=day) 重建 rolling_relative_dip，
        方向一致確認0050代理版結論：v1 樣本外n=80 勝率51% sharpe_like=0.335
        mean_ret=+5.798%；v2（獨立盲建）樣本外n=77 勝率53% sharpe_like=0.371
        mean_ret=+6.042%、日聚集版sharpe_like=0.451。兩者對照0050代理版基準
        （sharpe 0.341、勝率52%、n=77）數字接近、方向相同，非大幅分歧——予以「確認」
        而非「推翻」。惟仍是部分關閉：門檻(0.3%)、窗口(15分)、確認窗(10分)三個
        超參數皆沿用舊值、未在真TX資料上重掃；v2作者自陳非100%blind實作（讀過參考
        腳本），且日盤時窗TX(~08:45-13:44)比個股(09:00-13:30)寬，兩者交集用窄的一邊。
      · 缺口3（5bps成本未實測）→ 已關閉（風險方向）。用短邊已知「13~76bps」滑價區間
        做壓力測試：cost=5bps時mean_net_ret=+5.913%／sharpe_like=0.341，
        cost=76bps時仍為+5.203%／sharpe_like=0.300（僅衰退~12%），線性外推打平點
        ≈596bps，遠高於76bps上限。結論：策略對成本不敏感，5bps假設偏樂觀但不影響
        方向性結論。
