        總報酬362.3%（std10.1，範圍351.6~385.1%）略遜於兩個固定規則。即
        n_seats本身沒有比「不排序」更好，但「用某個固定、可重現規則」優於隨機——
        建議 priority_on_capital_conflict 保留現行值僅因簡單／可重現，不是因為
        n_seats已被證明是最優排序。
