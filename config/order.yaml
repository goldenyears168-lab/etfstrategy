# Phase 1 · mini-OMS lifecycle（C18acc / Leading Dip · 可 env 覆寫）
lifecycle:
  poll_max_attempts: 3
  poll_interval_sec: 2.0
  notional_basis: filled   # submitted | filled · default filled（P1：未成交不計曝險）
  submit_notify: true

# 帳戶級風控 · 換倉衝突賣優先
# 2026-08-08 code review 修正：「雙袖共用」原本不準確——實際只有 c18acc/leading-dip
# 真的接了 order.account_cap_gate.can_afford_buy（見該檔 consumer 清單）；songshan-
# copytrade 原本完全沒查現金，已於同日補上同一套 pre-flight 檢查，現在是三袖共用。
# dayflip-futures-short 走期貨保證金（不同資金池），detach-gate 只賣不買，兩者本來
# 就不適用這個現金緩衝，非漏接。
account_risk:
  reserved_cash_twd: 50000
  priority_on_conflict: sell_first
  swap_buy_retry_polls: 3

