    poll_script: scripts/order/run_tmf_channel_worker.py
    launchd: com.jackm4.goldenstocks.tmf-channel-poll
    notes: >
      Desired-state reconciler · Final v1.3.0 PV16 cell-tune v2（O-anchor）· engine=tmf_channel.causal_engine
      · launchd KeepAlive worker（重用 Fubon session；INTERVAL≈20s）。
      實彈須四鎖全開。超額／孤兒持倉會先 flatten。近月自動解析；日盤+夜盤窗。

      2026-08-09 使用者截圖回報「現在非交易時間，明顯有問題」（週日21:46，
      監控UI :8770顯示「夜盤進行中」「LIVE送單中」）——查證後確認：
      · **真正下單worker完全正常、沒有安全風險**：tmf_channel_live_20260809.log
        根本不存在（最新一筆是08/08 00:25，Friday夜盤尾段），worker process
        CPU 0.0%，這一整個週末worker都正確idle，沒有嘗試對已收盤的交易所送出
        任何委託。真正的下單判斷邏輯 src/order/tmf_channel_marketdata.py 的
        in_tmf_trade_window() 早在2026-08-08就修過weekday-aware判斷（見該
        函式docstring記載的Saturday login-thrash事件），這次沒有重蹈覆轍。
      · **問題出在監控UI本身、獨立的一個顯示bug**：reports/research/
        channel_lab/live_v6_sim_server.py 的 _session_phase() 只查HH:MM、
        沒查星期幾——跟已修過的in_tmf_trade_window()是同一類bug、但是
        獨立、沒被那次修復涵蓋到的另一份程式碼，直到這次使用者截圖才發現。
        已修正：改用in_tmf_trade_window()當唯一真相來源判斷是否真的在開盤，
        週末/非交易時段改顯示「已收盤（週六/週日）· 等待MM/DD 08:45日盤開盤」。
        已用今天(週日21:50)/明天週一同一時間/週六02:00(週五夜盤尾段仍應算
        開盤)三組時間點測試通過，重啟tmf-sim-server後用curl驗證/api/state
        的phase欄位確認修正生效。
      · **「今日總損益NT$+6,623」這個數字沒有進一步查證是否也有標示問題**：
        _trading_day_str()/trading_day_str()對hour>=5一律回傳當天日曆日期
        （不查星期幾），這個+6,623很可能是週五(08/07)最後一次真實交易session
        的損益、被富邦帳戶API或ledger以「還沒被下一個交易日覆蓋」的方式
        延續顯示，標籤上顯示2026-08-09（今天日曆日期字面正確，但這個數字
        實質上是週五的結果，不是今天真的發生的交易）——這比較可能是合理的
        『沿用最後一次已知狀態』行為，不是新bug，但也沒有深入驗證broker
        API或ledger的確切邏輯，留給使用者知悉、非必要不動它。

