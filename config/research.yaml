          stop_frac(0.15~0.7) 20 格網格，half 固定用已驗證的 P60/N40。
          **2/2 審查通過**（因果性：240 組截斷測試 0 個不符，target/stop
          水位皆用訊號當根之前已 lock 的固定線性參數外插，無未來資訊；
          對帳與 baseline parity 逐位元核對通過）。
          **確認 target/stop 比例確實是決定 target_pct 的真正槓桿**（非
          half 絕對大小，呼應 H-SC-WIDTH-PERCENTILE 的診斷）：target_pct
          範圍 10.20%~32.52%，比固定 half 用不同分位數時的 7.8%~12% 明顯
          可調動。**但上限遠低於 80%**：target_pct 最高的格
          （target_frac=0.2, stop_frac=0.7）net_pts=−1,443（負）；20 格
          裡淨利為正的只有 7 格，其中維持正報酬前提下 target_pct 最高只到
          18.03%（target_frac=0.8, stop_frac=0.5, net=+3,159）。機制：
          target_frac 越小，達標門檻越低、target_pct 隨之單調上升，但
          「贏了能拿多少」等比例縮小，固定成本(2pt/round-trip)不變，於是
