      permutation檢定控制了「這些股票本身在這段期間、這個β調整下的自然
      報酬特徵」，測的是純粹的timing skill，比對零值的單樣本t-test是更
      嚴格的null，9217依然大幅超越。詳見
      whale_9217_permutation_test_result.json。**結論再修正**：9217的
      live訊號證據強度比第六輪估計的更強——雖然t-test/Wilcoxon對極端值
