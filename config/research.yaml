      - id: H-SC-FLIP-STOPLOSS-TAILCUT
        statement: >
          幫 flip 倉（賠錢反手後開的新倉）加一個明確的 max-loss 停損
          距離（現行只有 target，沒有獨立停損，可能一路持有到 session
          結束），能降低「騎到收盤累積大額損益」的長尾風險。（借用
          tx-donchian-regime 線第十六輪自己列出、未驗證的救援方向）
        status: rejected  # 1/2審查通過(另1位抓到敘事誇大但不影響數據)；停損既沒改善net_pts也沒降低長尾風險，worst trade反而惡化
        evidence: >
          slow_cell_flip_stoploss_tailcut.json：測 2x/3x/5x half 三組
          停損倍數 + 無停損基準，全部跑在 484 天乾淨 OOS 資料。**關鍵
          設計限制（build agent 誠實揭露）**：flip 倉本來就已經有一個
          很緊的隱性反手觸發器（0.3×half，每根 bar 檢查），任何
          N≥2×half 的新停損在「漸進走勢累積虧損」情境下，數學上必然
          晚於既有機制觸發——是結構性 no-op；本輪把新停損設計成優先權
          最高，只在同一根 bar 內價格跳空/急殺、一次穿越兩個門檻時才
          搶先生效，代表這輪只測了「跳空保護」，不是「一般漸進虧損
          保護」（後者已被既有機制排除，無法測）。

          **核心結論**：三組停損的 net_pts 全部比無停損基準更差
          （−4,823→−5,516/−5,030/−5,233）。**最重要且違反直覺的發現**：
          加停損並沒有降低長尾風險——最差單筆虧損反而從 −155pt 惡化到
          −436pt（三組一致）。追查根因：這是 path-dependence（蝴蝶
          效應）——某一晚（2025-04-07，關稅 crash 期間）停損組在某一
          刻搶先觸發，後續 15~200+ 根 bar（依配置而異）的反手鏈路徑
          因此分岔，等到同一晚後段真正出現巨幅跳空時，停損組剛好持有
          一個逆勢部位而無停損版本剛好不是——不是「停損機制本身比較差」
          的因果證明，是這種 stateful 反手鏈系統對局部干預極度敏感的
          已知特性。扣掉這一天單獨看，3x_half 略贏基準（+203pt）、
          2x/5x 仍輸，顯示效果對倍數選擇高度敏感、不穩定。

          **2 位審查者，1 位通過、1 位不通過**：因果性/對帳審查通過（誠實
          next_open 成交、對帳平衡、同根K保護皆確認），但**指出 build
          agent 的「根因追查」敘事有具體錯誤**：把 −436pt 那筆歸咎於
          「17618→19260(~1642pt)跳空」，但實際上該筆進場價是 18826、
