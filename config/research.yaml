          - 認為調這個比例可以繼續逼近 80%——20 格網格已覆蓋
            target_frac 到 0.2（門檻已經很低），net-positive 的天花板
            就在 ~18% 附近，這是這個引擎架構本身的限制，不是還沒找到
            對的參數
          - 忽略審查者指出的敘事瑕疵：script 聲稱「target_frac 不影響
            交易次數」與 JSON 自身數據矛盾（target_frac 變小時 n_trades
            會因為出場更快、空手掃描機會變多而顯著上升）——20 格比較的
            不是「同一批交易換出場規則」的乾淨單變量實驗，是連交易母體
            都不同的比較，方向結論不受影響但解讀要留意
      - id: H-SC-ADAPTIVE-RECOGNITION-SPEED
        statement: >
          通道辨識速度（SW_TH 擺盪門檻、lock_k 斜率鎖定所需 bar 數）不該是
          全域固定值，應該依「當下市場快慢」動態縮放——快段落更快確認、
          慢段落等更久才確認——這樣能提高「碰邊緣後回中線」的比例。
          （使用者觀察 8/6 實測 28 筆僅 3 筆走進通道內後提出的假說）
        status: rejected  # 3/3審查通過；動態縮放沒解決target_pct問題，且交易量暴增讓net_pts明顯惡化
        evidence: >
          slow_cell_adaptive_recognition_speed.json：因果波動量測
          rvol(t)=ATR_short(t)/ATR_long(t)（皆用嚴格早於 t 的 causal
          rolling median TR，rvol(t)=1 時逐位元退化回旗艦固定基準，確保
          對照乾淨）驅動 SW_TH(t)=SW_TH_base/scale(t)、
          lock_k(t)=round(LOCK_K_base/scale(t))，同方向縮放（快→兩者都
          縮小）。測 4 組 gamma/窗口組合 + 1 組固定基準，全部跑在
          484 天乾淨 OOS 資料上（非重蹈 83 天小樣本覆轍）。**3/3 審查
          通過**（因果性：擾動測試證實 sw_th_arr[t]/lock_k_arr[t] 不受
          當根 H/L/C 影響，lock_bar 一旦在通道建立當下設定就不會被追溯
          重定義；統計方法：獨立以 3 種方法重算自相關、獨立重跑 Newey-
          West HAC 校正，數字吻合；對帳：484 天 × 5 組設定全數通過
          assert，動態 lock_k 未產生新的靜默遺失路徑）。

          **核心負面結論**：target_pct 只從固定基準 8.43% 微幅升到最高
          9.39%（4 組動態裡只有 1 組贏過基準、其餘 3 組打平或更差：
          8.21%/8.6%/7.5%），改善幅度小且不一致；同時 net_pts 因為交易
          量暴增（+36%~+123%，訊號更頻繁觸發）大幅惡化（−4,823→
          −7,067~−11,717，4 組動態設定全部比固定基準差）。

          **意外但誠實的附帶發現**：對表現最好的動態設定（ADAPT-B）做
          正式顯著性檢定——逐日 net_pts mean=−14.58pt/day，naive
          p=0.0026；**這組的逐日序列自相關只有 0.04（遠低於固定基準的
          0.335），Newey-West 校正後 p 值幾乎不動（0.003~0.005，maxlags
          1/5/10 皆同）**——相較之下固定基準的 p=0.029 在同樣校正後退回
          0.058~0.09（不顯著）。也就是說：這輪意外做出本研究線第一個
          「經自相關校正後仍然顯著」的結果——但顯著的方向是穩定虧錢，
          不是本研究線在找的正面 edge。
        do_not:
          - 引用「target_pct 9.39%」或任何動態設定的數字當作解決方案——
            4 組裡 3 組不如固定基準，改善不穩健，且全部伴隨 net_pts
            明顯惡化
          - 忽略 TR-based rvol 量測的語意選擇：這個公式量的是「per-bar
            波動/抖動幅度」，不是「淨移動速度」——一段緩慢但持續的單向
            趨勢（每根小跳動）在此定義下會被判定為「慢」（SW_TH 升高），
            即使長期累積位移很大；來回抖動反而被判定為「快」。這可能
            跟使用者原本「快速噴出段落」的直覺（著重淨位移而非逐根抖動）
            有落差——如果要繼續這個方向，應該先測「淨位移速度」版本的
            rvol，而不是假設這次的 TR-based 版本已經窮盡了「動態縮放」
            這個概念
          - 把「ADAPT-B 顯著虧錢」讀成「動態縮放完全沒用」的證據——這
            只證明了 TR-based（choppiness）這個特定量測方式無效，淨位移
            速度版本已在 H-SC-NET-VELOCITY-RECOGNITION-SPEED 測過，但
            該輪實作被證實有同根循環 bug，結論同樣未定案
      - id: H-SC-NET-VELOCITY-RECOGNITION-SPEED
        statement: >
          用 Efficiency Ratio（Kaufman ER：淨位移 ÷ 總路徑長度）取代
          TR-based（per-bar 抖動幅度）驅動 SW_TH/lock_k 動態縮放，能更
          精確對應「快速噴出段落」的直覺，改善 target_pct 過低的問題。
        status: rejected  # 修復同根循環bug後重測，2/2審查claim_survives=true；穩健顯著負向結果不是bug產物，是ER動態縮放本身的真實特性
        evidence: >
          修復 causal_er_array()：ER(t) 整個窗口往回移一根 bar，改用
          t-1 當「現在」——ER_causal(t,w)=|C[t-1]-C[t-1-w]|÷
          Σ_{i=t-w}^{t-1}|C[i]-C[i-1]|，分子分母嚴格只碰 index≤t-1 的
          收盤價，完全不觸碰 C[t]/H[t]/L[t]，比照 TR-based 版本
          causal_rolling_median 排除 index t 的寫法。

          **擾動測試（合成序列+真實 2023-07-03 交易日各一組）雙重確認
          修復生效**：修復前，在 t=100 注入異常值，sw_th_arr[100] 本身
          當場被影響（20.0→39.036，同根污染）；修復後，sw_th_arr[100]
          完全不受影響（20.0==20.0），第一個受影響的索引延後到
          t=101——因果正確性與 TR-based 版本同一等級。

          **edge-case 分母 0-guard 誠實統計**（不重蹈上一輪「誤報未觸發」
          覆轍）：逐 window（5/10/30/60）× 全部 933 個 (day,session) 區塊
          掃描，觸發次數分別為 328/183/133/73 次（佔比 0.02%~0.09%），
          guard 確實會觸發但下游 sw_th_arr/lock_k_arr 全部 finite（assert
          通過，0 例外）——「guard 有效防住」與「guard 從未觸發」是兩件
          不同的事，本輪分開誠實報告。

          **修復後 vs 修復前對比（關鍵發現）**：交易量暴增只小幅下降
          （4%~9%），修復後仍是固定基準的 3.3x~5.0x（修復前 3.5x~5.2x）
          ——同根循環 bug 從來不是交易量暴增的主因；根本原因是 ER 這個
          量測對單根反轉的結構性敏感度（短窗內一根逆向 bar 讓 ER 瞬間
          趨近 0，下一根順勢又彈回高值），造成 SW_TH(t) 鋸齒震盪、頻繁
          誤觸發，這在修復前後的逐 bar 對比圖中鋸齒形狀幾乎沒變，直接
          視覺化證實。target_pct 全面小幅上升（EFF-D：9.29%→9.42%，
          首次超過 TR-based 版本的 9.39%），但 net_pts 仍全面遠遜固定
          基準（EFF-D：−19,694pt，日均 −39.9pt），「target_pct 略勝
          TR-based」與「net_pts 問題被解決」是兩件事，後者從未成立。

          **顯著性檢定（EFF-D_w5-30_g1.0，修復後資料，453 個乾淨交易日）**：
          mean=−39.894pt/day，naive t 檢定 p=1.85e-6；Newey-West HAC
          校正（maxlags 1/5/10）p 仍在 2.77e-6~2.77e-6 之間，用同一套
          「HAC 校正後 p<0.05 才算穩健顯著」的統一標準判定（不因結果
          是負向就放寬）：**穩健顯著為負**。修復前的極端 p=1.66e-7 並未
          消失，修復後變成 p=1.85e-6（數量級放大約 10 倍但仍遠低於
          0.05）——這證明「顯著虧錢」這個結論本身是真實的，不是修復前
          那個同根循環 bug 人為製造出來的假顯著，bug 只是讓 p 值看起來
          稍微更誇張一點。

          **2/2 審查通過**（claim_survives=true）：獨立重現全部可驗證
          數字（擾動測試分岔索引、修復前後 trades/net_pts/target_pct、
          顯著性檢定統計量、edge-case 觸發次數），無發現新瑕疵。
        do_not:
          - 把這輪讀成「淨位移速度版本也被排除了，動態縮放這條路整個
            走不通」——嚴謹地說，這只排除了「用 ER 或 TR 這兩種量測方式
            驅動 SW_TH/lock_k 逐 bar 動態縮放」這個具體實作；ER 對單根
            反轉的結構性敏感度是本輪確認的根本問題，不是換個
            floor/ceil、視窗長度或 gamma 就能解決的（EFF-A~D 在
            w_long=60 和 w_long=30 都同樣呈現鋸齒）
          - 引用「target_pct 9.42% 超過 TR-based 的 9.39%」當作 ER-based
            版本整體更優的證據——net_pts 從未回到固定基準水準，
            target_pct 的微幅領先在 net_pts 全面惡化 4 倍以上的脈絡下
            沒有實務意義
          - 忽略本輪確立的方法論：自動生成的因果性/edge-case 聲稱
            （尤其是「從未觸發」這類絕對化陳述）需要獨立擾動測試與逐一
            掃描驗證，不能只憑陳述語氣的自信程度判斷可信度
      - id: H-SC-ENTRY-FEATURE-SIZING
        statement: >
          借用 tx-donchian-regime 研究線第十五、十六輪已驗證的方法論
          （因果特徵快照 + 5 摺 causal Spearman IC + sizing 收割而非
          veto），對我們的旗艦引擎（Mode B fade+flip, P60/N40）找出
          「進場當下可知」的特徵，能不能預測該筆交易表現、進而用部位
          大小加權提升整體績效。
        status: rejected  # 2/2審查通過(含1個發現真實方法論瑕疵但不影響結論)；8個特徵全數未通過4/5摺門檻，無可用edge
        evidence: >
          tmf_entry_features_instrument.json + testA/B/C.json：在 484 天
          乾淨 OOS 資料上，先驗證我們引擎本身有沒有 tx-donchian 線第十六
          輪「盲點4」那種 session 尾端部位被靜默丟棄的記帳缺口——**驗證
          結果乾淨**：933 個 (day,session) 區塊，130 個區塊在最後一根
          bar 仍有未平倉部位，trades 裡 exit_reason='session_end' 剛好
          也是 130 筆，逐區塊 1:1 對應、0 個不符；另外用未修改的原版
          run_config() 交叉核對，2016 筆交易的完整欄位序列逐筆相同。
          **2/2 審查通過**（因果性：逐一追蹤 6 個特徵的計算時序，
          entry_features() 在同一輪迴圈裡嚴格早於 ZigZag/腿完成的判定，
          width_ratio/confirmed_by_other 用到的 half_hist/ch_ref 皆為
          「已完成」的過去狀態，無未來洩漏；統計方法：Spearman rank IC
          計算正確、IS/OOS 無洩漏，但抓到一個真實瑕疵——見 do_not）。

          **核心結論**：測了 8 個特徵（atr_at_entry、width_pts、
          width_ratio、overext_z、prior_pnl、mins_since_open、
          mins_to_end、confirmed_by_other 類比），**沒有一個乾淨通過
          「5 摺 OOS IC 至少 4/5 摺同號」門檻**。width_pts 表現最一致
