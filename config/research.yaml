    title: 盤中結構停損 playbook（宇宙 / 持倉）
    status: archived
    phase: rejected
    methodology: docs/intraday-exit-playbook.md
    report_dir: reports/research/order
    notes: >
      2026-07-13 退回 Research · 自 Strategy sell-signal-radar 與 Order launchd
      exit-gate 撤出。證據為風險修剪非報酬引擎（勝率 ~42% · 無法突破 50%）。
      模組保留：src/order/intraday_structural_exit.py · intraday_exit_gate.py（僅研究／單測）。
    hypotheses:
      - id: H-EXIT-STRUCT
        statement: 盤中機械結構停損可穩定提高持倉報酬
        status: rejected
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: passed
        G3_partitioned_combo: na
        G4_rejection_registry: passed
        G5_frozen_spec: na
        G6_adoption_report: na
      action: do-not-adopt · research archive only

