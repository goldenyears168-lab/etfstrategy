            這個測試再引用「BUG-2通過」
      - id: H-SC-TICK-TRIGGER
        statement: >
          訊號觸發從「等 1 分鐘 K 收盤才確認」改成「逐 tick 即時確認碰到邊緣/
          目標/停損」，能實質提升績效（不只是切換確認方式）。
        status: rejected  # 擴大樣本+IS/OOS walk-forward後翻案：IS期間tick反而大幅劣於bar，兩組總和皆由個位數極端日主導、非穩健訊號
        evidence: >
          初測（13天）：bar 級 net +619pt → tick 級 net +2,975pt。4 位
          審查者 3/4 通過，第 4 位找到 look-ahead（通道剛 lock 那根 bar
          被拿自己最後一筆 tick 價回頭判定自己開頭是否觸價）。修復輪
          （加 ch_just_locked guard）額外發現出場側也有同構污染（合計
          16+8=24 次），修復後方向仍成立但縮水 42%（+1,363pt/+220.2%），
          2 位審查者過關。

          **擴大樣本輪（59天，IS=15天落在半寬校準期2026-04~07內／
          OOS=36天落在校準期外的2025-07~2026-03）徹底翻案**：
          IS 組 bar +684pt → tick **−1,345pt**（delta **−296.6%**，tick
          大幅劣於 bar，方向與之前所有測試相反）；OOS 組 bar +649pt →
          tick +2,296pt（delta +253.8%，方向與之前一致）。
          腳本自動下的 robustness_verdict 標籤
          "OOS_improvement_holds_up_at_or_above_IS_level" 被審查者判定
          **是個 bug 產生的誤導性標籤**：其判斷邏輯 `oos_pct < is_pct*0.5`
          在 is_pct 為負時失效（負數乘 0.5/0.9 只會更負，導致任何正
          oos_pct 都自動落入最樂觀分類），沒有處理「IS 端根本沒有
          improvement 可言」這種情境。

          **關鍵：兩組總和都被個位數極端日主導，不是廣泛分佈的優勢**——
          IS 組扣掉單一天（2026-06-23，delta=−2,186pt）後翻正為 +157pt；
          OOS 組扣掉 top4 天（合計 +2,418pt，占總 delta 146.8%）後翻負
          為 −771pt；OOS 36 天裡還有 13 天雙邊 0 筆交易，真正有交易的
          只有 23 天，樣本比表面數字更薄。

          深入調查 2026-06-23 這天（bar +1,690pt vs tick −496pt）的根因：
          **不是資料問題、不是程式 bug**——兩個引擎都完全依照各自已審查過
          的設計正確運作。真正原因是結構性的混沌路徑依賴：MODE B 是一個
          會用「上次出場的價格/極值」重新錨定通道的 stateful 反手機器，
          當天第一次通道 lock 時，bar 版在 bar 6 就能進場（bar 級 decide-
          at-close 本身合法），tick 版因為（上一輪剛修好、確實正確的）
          ch_just_locked guard 延後到 bar 8、且進場價不同——這個極小、
          原則上正確的時序差異，經過反手鏈的路徑依賴放大，導致當天下半場
          兩個引擎走上完全不同的交易序列：bar 版兩筆交易乾淨騎滿一段
          850~1300pt 的真實趨勢到收盤（+1,685pt）；tick 版同段時間陷入
          113 筆碎單反覆停損反手（−1,895pt），只吃到趨勢尾巴（+971pt）。
          這代表 bar 版與 tick 版本質上是同一個雜訊過程的兩條混沌路徑，
          誰在特定一天「運氣好」進到對的方向，取決於蝴蝶效應級的初始
          時序差，不是穩定可重複的優勢。
        do_not:
          - 引用 13 天樣本的 +1,363pt/+220.2% 當結論——59 天樣本顯示這個
            方向在 IS 期間完全反轉，13 天很可能只是抽樣運氣站對邊
          - 相信任何自動產生的「穩健性」標籤而不親自核對逐日明細——本輪
            robustness_verdict 的判斷邏輯本身有正負號 bug，把「IS大幅
            劣化、OOS大幅改善、方向相反」這種本應是最可疑的結果，系統性
            誤分類成最樂觀的標籤
          - 把 2026-06-23 的巨幅逆轉當成需要再修的 bug 去追——已確認是
            兩個都正確的引擎在混沌路徑依賴下的必然結果，不是哪邊錯了；
