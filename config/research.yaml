         天天出現；這兩個是「廣度」：幾乎覆蓋全市場天天出現），本質同一
         現象非新解讀。**判定 reject，已併入排除清單**（agent回傳的
         recommendation欄位技術性誤標為"worth_tracking"，但完整reasoning
         全文清楚支持exclude；已依內容而非欄位標籤採用reject結論，此為
         agent輸出格式的已知瑕疵，未來應留意結構化欄位與敘述文字的一致性
         校驗）。
      4. **分點配對共識訊號**（仿照expert_pool的「同股多分點共識」邏輯，
         改用資料驅動找「常同日同股共現、且共現時報酬優於各自單獨出現」
         的分點配對）：挖了6,625個配對(freq≥5有1,285對)，30個候選逐一比較
         joint vs solo，無一同時滿足樣本足夠+跨股票可類化+經濟顯著。交叉
         檢查發現既有4個專家分點(9217/9801/9661/9227)彼此間幾乎不曾同日
         同股共現(最高僅165次且對象是已知負向分點9800)——印證「好分點
         各自獨立行動」，跟「到處都在買的綜合/造市分點才會常常一起出現」
         是兩類不同東西。**判定 reject（誠實null result）**。
      5. **個股專屬分點排行**（反向切角：對20檔股票池逐股找「頭號候選
         分點」，而非跨股票彙總找哪個分點整體最好）：17組候選裡僅2組
         p<0.05。**9699（富邦經紀）×7769（展宏）** n=9、H20 median+13.75%
         /勝率88.9%/p=0.024，且9699在整個宇宙裡只交易過5檔股票（極窄
         專精，結構上最像9217/松山）——本輪唯一交叉驗證後仍站得住腳的
         新線索。另一組9875×8358(n=4)與既有run_ab58_follow_consensus_
         study.py的「忙碌≠edge」負樣本判定直接矛盾，可信度存疑。17組測
         2組顯著不算遠超隨機水位(5%水準下預期~0.85組)。**9699×7769列為
         pending，需更多樣本外事件才能判斷是否 worth_tracking**，其餘
         判定 reject。

