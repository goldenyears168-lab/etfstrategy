      - id: H-DL-2
        statement: 長 improving streak 非 b2（H3）· imp · st≥7 · flat · bench<2% · mean_3d≥2% 且 loss5≤10%
        seed: H3
        status: preregistered
      - id: H-DL-3
        statement: miss-list 強 ret_3d 案例聚類後的新 quadrant×bench 組合可產出 Jaccard≤0.32 互補 lane
        metric: miss_cluster_lift
        status: exploratory
      - id: H-DL-4
        statement: 持有期 path min≤−8% 剔除後 sweep top-quartile mean_3d 顯著高於未剔除
        metric: loss8_path_filter_lift
        status: preregistered
      - id: H-DL-5
        statement: 全月份 success（ret_3d≥3%）共現 tag pair（≥2 次 · lift≥1.3 · 跨維）經 exclusion gate 後可產出 mean_3d≥3% 互補 CO seed
        metric: cooccurrence_seed_pass_rate
        status: preregistered
