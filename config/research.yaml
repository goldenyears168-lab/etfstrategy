  tx-channel-amp-uncertainty-gate:
    title: TX 通道 · struct_break 進場用振幅／成交量異常度（Mahalanobis）濾網
    status: active
    phase: hypothesis
    layer: research
    report_dir: reports/research/channel_lab
    run_scripts:
      - scripts/research/tx_channel_amp_vol_uncertainty_struct_gate.py
    hypotheses:
      - id: H-AMP-UNC-GATE
        statement: >
          用（振幅30、成交量30）配對相對近期trailing分布的Mahalanobis「反常度」
          分數，過濾struct_break進場——低反常度（貼近近期常態）的進場應優於
          高反常度的進場。
        status: passed
        evidence: >
          79個交易日、三組trail/percentile設定（30d/50百分位、30d/75百分位、
          50d/75百分位），低反常組 vs 高反常組日均pnl差距分別為+37.8／
          +38.7／+43.2pt/日，日聚類t=5.87～7.22，p<0.0001。per-day
          IC(反常度,pnl)穩定負相關（≈−0.36～−0.37，p≈0）。⚠️關鍵、容易被
          忽略的一點：兩組（低/高反常度）本身的日均pnl**都是負的**（例如
          50d/75百分位組：低反常−51.7pt/日、高反常−94.8pt/日）——濾網只是
          「讓一個本來就在虧錢的struct_break機制少虧一點」，不是把它變成
          賺錢策略。見
          reports/research/channel_lab/tx_channel_amp_vol_uncertainty_struct_gate_rerun_20260808.json。
      - id: H-AMP-UNC-FORECAST-MEDIATION
        statement: >
          反常度分數的預測力來自它真的能預測「振幅/成交量預測誤差變大」
          （即典型的波動率預測不確定性）。
        status: rejected
        evidence: >
          Step1 IC(Mahalanobis, 未來預測殘差)僅0.023，n=235天，t=1.42，
          p=0.156，不顯著——反常度分數對pnl的預測力不是透過「預測較不準」
          這條機制傳導，是抓到別的東西（跟近期典型振幅/成交量狀態的距離
          本身）。
    do_not:
      - 拿「低反常組贏高反常組」宣稱找到新的獲利來源——兩組本身都虧錢，這是
        濾網不是alpha
      - 跳過G2/G3直接接進 order 層——目前只有IS診斷+一次bug修復後的重跑，
        沒有真正的walk-forward/獨立OOS
      - 忽略 tx_channel_amp_vol_uncertainty_struct_gate.py import
        order.tmf_channel_config 這件事——research 腳本 import src/order/
        違反 CLAUDE.md import 規則第1條，要接下去做之前必須先解掉這個依賴
        （複製需要的 recipe 常數，不要 import order 模組）
    graduation:
      gates:
