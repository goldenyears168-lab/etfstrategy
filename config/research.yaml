      firepower_concentration: reports/research/branch-footprint-screen/branch_firepower_concentration_v1.csv
    hypotheses:
      - id: H1-BRANCH-CONSISTENCY
        statement: >
          whale-buy-concentration 用小樣本「極端集中度事件」判斷分點好壞不可靠；
          改用「該分點全部 Top1 買方日」（不套集中度門檻）的大樣本重新評估，
          方向會不同且更可信
        status: passed  # 9227：集中度子集 n=4 H9-6.1% → 全樣本 n=140 H9+4.7%，完全翻轉；驗證了方法論教訓本身
      - id: H2-L1H7-PROTOCOL-CORRECTION
        statement: >
          用專案標準 L1H7 協議（T+1開盤進場、7交易日收盤出場、30bps成本、
          r_adj=r-1.15×r_IX0001）+ 大樣本重算，會比「訊號日收盤進場、無成本、
          無β調整」的簡化算法產生方向不同的結論——尤其是進場時機（跳空）、
          成本、β調整三者疊加後可能翻轉表面上的正向訊號
        status: passed  # 8440摩根大通/1650瑞銀：舊法判正向，L1H7+全母體(n=4308/5309)判顯著負向(p<1e-4)；隔夜跳空+0.33~0.35%+30bps+β合計約-0.6~0.7pp可解釋部分落差，但決定性因素是舊研究的小樣本選擇偏誤（即使沿用舊算法看全母體，中位數也早是負的）
      - id: H3-MARKET-MAKER-SIGNATURE
        statement: >
          BH-FDR 顯著負向的分點，若在其最活躍股票上呈現「近乎每日交易＋買賣
          金額比例接近50/50」，代表其為造市/避險/綜合客戶流通道而非方向性
          大戶，訊號本身不具方向意義、應從候選宇宙排除而非當作反向訊號
        status: contested  # 原判passed（11個顯著負向分點10個平均交易日數佔比93~100%、買賣平衡44.9~51.7%，與980T已知造市簽名一致）。但H12發現：同樣的「全勤率高+買賣比接近50/50」檢查套用在已知好分點9217自己的核心持股上，7檔裡有4檔買賣比也落在50±3個百分點內、全勤率61~99%（部分甚至更高）——說明這個判準本身無法區分「造市分點」與「已知有效的方向性大戶」，用它來確認負向分點是造市帳戶的部分論證需要更嚴謹的對照組驗證才能維持；黑名單 market_maker_branch_exclusion_v1.json 裡靠這個判準支持的分點都應視為「暫時可信但論證基礎不夠強」而非「確定」｜【H13 補充 2026-08-09】此判準的「名目廣度」版本維持被 H12 打掉的判定，**不予恢復**；但改用金額口徑集中度（hhi_res，見 H13）後，17 家中 14 家能在不誤殺 9217 的門檻下被重新識別，排除名單本身的操作性結論獲得一個獨立於名目廣度的支持。狀態仍維持 contested 而非 passed，因為 (a) 門檻用 n=1 正例校準，不構成驗證 (b) 新判準也無法區分有無 edge（9661/9227 兩個乾淨 null 與 9217 同位，見 H14）(c) 980C/5852/9B2a 三家新判準明確不支持。名單成員未變更，但每家的證據強度已分層標註於 JSON 的 criterion_v2_flag 欄位。
      - id: H4-NEW-CANDIDATE-9239
        statement: >
          全分點宇宙 L1H7 篩選能找到新的、統計輪廓優於既有候選 9217 的正向分點
        status: contested  # 原判rejected（91%(20/22)事件訊號後25日內轉淨賣超、32%隔日賣出≥買超50%、該分點在這22檔標的交易天數中位數307天/490日近乎天天買賣）。2026-07-28使用者指出推理瑕疵：L1H7本身是7天策略，訊號後第8~25天分點自己做什麼，跟該7天量測窗口內股價報酬是否真實可捕捉無直接關係（除非是隔日沖立即反向平倉）。重新把daily_window拆成D+1~D+7 vs D+8~D+25兩段核對後，91%轉賣超的核心其實多數已發生在D+1~D+7量測窗口本身之內——代表9239在L1H7的7天測量期內就已高頻雙邊操作（不同於9217訊號後續抱不賣），是實體類型上的當沖/高週轉疑慮，而非「7天內報酬可信、只是分點後來反悔賣出」。**結論修正為inconclusive**：實體類型判定（高週轉非知情一次性重押）仍成立、維持不建議採納，但不再以「訊號後被反悔」為由宣稱證偽；真正站得住的保留理由回到原始統計本就邊緣（p=0.070未達顯著）的樣本脆弱性。詳見 whale_branch_l1h7_deepdive_9239_followup_position_crossing.md
      - id: H5-LARGE-N-SMALL-EFFECT
        statement: >
          大樣本但效果量小、p值接近顯著的候選（如n>100但效果量<1%），隨樣本
          持續累積會收斂到顯著
        status: rejected  # 920F反例：n=141看似大樣本正向，但排除單一月份(2026-05,16%樣本)後mean/median/勝率/p全部崩解到雜訊水準（p 0.193→0.917），效果本身可能不存在、非樣本不足問題
      - id: H6-TOP3-MULTIHORIZON-BROADENING
        statement: >
          放寬事件定義（當日唯一Top1買方 → Top1~Top3排名前三皆納入）+ 多天期
          同測（H7/H14/H20，非只測H7），能找到 Top1-only+H7-only 篩選法遺漏
          的正向候選
        status: rejected  # 774個分點裡H7/H14/H20 BH-FDR(5%)顯著分別只有6/7/8個，且逐一深挖後全數是既有12分點造市簽名的變體或統計假象（見H7-H10），未新增任何可採納候選；此協議擴展本身未被證偽，但目前產出是null result
      - id: H7-H14H20-DELAYED-SIGNAL-ARTIFACT
        statement: >
          「H7無訊號、H14/H20才顯著」型態代表訊號需要時間發酵，是比H7-only
          篩選更敏感的偵測方法
        status: rejected  # 9216(凱基-信義,n=250)反證：leg分解顯示只有第8-14天增量段乾淨顯著(Wilcoxon p=0.021)，第15-20天增量段完全不顯著且中位數為負(p=0.645)——H20 headline比H14更漂亮純粹是右尾極端值堆疊；9B2a/5852同樣是報酬std隨天期擴大(9B2a 17.7%→30.7%；5852 11.2%→24.9%)後t檢定對極端值更敏感的統計假象，非真實訊號發酵。正確結論：此型態本身應視為造市/綜合流量帳戶的警訊，不是加分項
      - id: H8-NEW-CANDIDATES-9216-9B2A-5852
        statement: >
          Top1-3+多天期篩選裡效果隨天期增強的三個新候選（9216凱基信義/9B2a
          台新松德/5852統一敦南）為真實方向性大戶訊號
        status: rejected  # 三者交易剖面(100%交易日全勤、買賣金額比44.9~51.7%接近50/50、觸及全市場2100+檔個股)與既有12分點造市簽名完全一致；5852另有Wilcoxon不顯著+中位數為負+去極端值後消失+67%事件集中重複同股四項獨立瑕疵；9B2a另有112天內3個不同登記名稱橫跨2券商品牌的身分不穩定問題。三者均併入 market_maker_branch_exclusion_v1.json ｜【H12補充】9216(leg分解自證H15-20不顯著+中位數負)與5852(Wilcoxon不顯著+中位數負+去極端後消失)的reject理由是各自獨立的統計瑕疵，不依賴entity-level造市檢查，H12不影響這兩者結論；但9B2a統計面是四者最乾淨的，reject主要靠entity-level造市簽名+身分不穩定，而entity-level造市簽名這部分論證已被H12動搖，9B2a的reject應視為主要靠「身分不穩定(3個登記名稱橫跨2券商)」這個獨立證據撐住，而非造市簽名本身 ｜【H13 補充】三者在新的金額口徑判準下**結論分歧，必須分開講**：9216 hhi_res=+0.0718（抓到；且其 hhi=0.0719 > 9217 的 0.0578，原 note 說它「117檔股票高度分散」是錯的，它比 9217 集中）；9B2a hhi_res=+0.0440 僅差門檻 0.0005 且樣本只有 122 交易日、值不穩定；5852 hhi_res=+0.0096 明確不符。5852 與 9B2a 的排除因此**完全**依賴各自的獨立證據（5852：Wilcoxon不顯著/中位數負/去極端後消失/67%事件集中同批股票；9B2a：112天內3個登記名稱橫跨2券商品牌），不再有任何「造市簽名」證據支撐
      - id: H9-LARGEST-SAMPLE-9268-9800
        statement: >
          9268(凱基-台北)/9800(元大HQ代碼)這兩個樣本量遠超既有造市黑名單
          （n=17,759/12,824，最大既有分點8440僅n=4,308）的顯著負向分點，
          代表大型券商總公司具備系統性但微弱的負向選股能力，而非純粹造市/
          綜合流量帳戶
        status: rejected  # 兩者100%交易日活躍、平均每天觸及1,803/1,412檔股票(近乎全市場，觸及總數2,347/2,019檔)、最活躍股票買賣金額比46.2~51.6%；三年(2024/25/26)×三天期(H7/H14/H20)共48格中位數與勝率全部為負/低於50%，僅mean在長天期因離群值轉正——本質是既有12分點造市簽名的「廣度」極端版本(既有12個是「深度」——集中在少數個股天天出現)，非新現象。建議併入排除清單(agent回傳的recommendation欄位誤標「worth_tracking」，但reasoning本身完整支持exclude，已依內容而非欄位標籤採用reject結論，詳見notes) ｜【H12補充】「觸及近乎全市場=造市簽名」這個論證前提已被H12推翻(9217自己也觸及2,239檔，比9800的2,019檔還多)，不能再當作reject的獨立證據；但reject最終結論本身不受影響——因為48格年度×天期分格中位數/勝率全數為負，這是直接的報酬統計證據，不依賴「是不是造市帳戶」的敘事，兩者維持排除 ｜【H13 補充】新增一項獨立於報酬統計、也獨立於已撤回的「觸及近乎全市場」論證的證據：兩者規模調整後金額集中度 hhi_res=+0.1849/+0.1868（vs 9217 的 0.0445；全體 830 家中分別排第 23/22，第 97.3/97.5 百分位），是名單內第 7/6 高——它們**不是**分散型帳戶，而是「名目上碰很多檔、錢仍高度壓在權值股上」的大型券商聚合碼。原 note 把它們形容成「廣度極端版本（錢攤很開）」在名目層面正確、在金額層面錯誤
      - id: H10-BRANCH-PAIR-CONSENSUS
        statement: >
          仿照既有 expert_pool 系統的「同股多分點共識」邏輯，用資料驅動方式
          系統性挖掘「經常同日同股共同出現、且同時出現時 forward return 優於
          各自單獨出現」的分點配對，能找到比單一分點篩選更強的候選
        status: rejected  # 30個候選配對(15高頻+15排除超高頻分點後的精品配對)逐一比較joint vs solo的H7/H14/H20，無一同時滿足樣本足夠+跨股票可類化+joint優於solo且經濟上有意義；高頻配對組效果量僅0.03-0.4pp(大樣本撐出的雜訊)，精品配對組樣本普遍n<20且多數joint事件100%集中單一股票。交叉檢查顯示既有4個專家分點(9217/9801/9661/9227)彼此間幾乎不同日同股共同出現(最高165次且對象是已知負向分點9800)，印證「好分點各自獨立行動」而非「好分點會一起出手」
      - id: H11-PERSTOCK-SPECIALIST
        statement: >
          反過來以「個股優先」切角（對特定股票找歷史戰績最好的分點，而非
          跨股票彙總找哪個分點整體最好）能發現分點整體樣本不夠大、但在
