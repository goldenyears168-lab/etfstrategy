          - 誤以為「只要再擴大樣本、再修某個bug」就能讓 tick-level 優勢
            穩定下來——59天已是13天的4.5倍規模，方向就直接反轉，這是
            path-dependence結構本身的特徵，不是樣本不夠大的問題
      - id: H-SC-DISTANCE-RATIO
        statement: >
