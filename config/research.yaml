      【第八輪：A7多重比較校正 + BUG-3/A2 volume-confound多fold重測
      （2026-08-08）】研究誠信檢查（docs/research-integrity-checklist.md）
      指出H1-9217-PERSONAL-EDGE的permutation p值（mean≈0.005-0.008、
      median<0.0001）有兩個未補的缺口：(a) A7多重比較——9217是從多個
      分點候選裡篩出來的「最後站得住的那一個」，但p值從未針對這個篩選
      過程做校正；(b) IS(n=5)/OOS(n=31) walk-forward切分被9217自身
      交易量2024→2026成長約4倍混淆（本輪實測corr(signal_date,buy_5d)=
      +0.347），先前只承認這個confound存在，從未拆解過。本輪針對兩者
      分別補測，皆使用src/research/branch_signal_validation.py既有
      permutation_test()（未新造演算法），對data/stocks.db僅讀取。

      (A) 多重比較校正：真正用「scan_5d_net95 + L1H7 + permutation」
      同一套protocol正式測試過的候選家族只有4個——9217/9661/9227/9801
      （見known-whale-branch-live-signal-validation topic）。逐兩兩比對
      這4個分點的觸發事件(stock_id, signal_date)，**exact key重疊=0**
      （36/36/114/31筆事件無一天同股同時觸發，僅各自候選股票池有
      4-11檔重疊），與H10「好分點各自獨立行動」的既有結論一致——候選
      間統計上近乎獨立，不需要chip-macro那種相關性Monte Carlo模擬；
      用Benjamini-Hochberg FDR（N=4, α=0.05）做校正，比naive Bonferroni
      更不會過度保守，也比硬套相關性調整更誠實（因為經驗證相關性本來
      就趨近0）。結果：mean統計量下9217(q=0.0121)與9801(q=0.0121)都
      通過BH-FDR；median統計量下**只有9217(q=0.0002)通過，9801
      (q=0.1665)未通過**——與9801既有「mean/median不一致、去極值後mean
      翻負」的脆弱標籤完全吻合，9217是4個正式候選裡唯一雙統計量都
      通過的。另外用一個**明確標註為非正式敏感度參考、不是正式校正**
      的worst-case下界（假設scan_5d_net95方法真的被套用到round3全
      分點宇宙774個分點且彼此獨立，用1-(1-p)^N估算）：median-based
      p_median≈0.00005在N=774下corrected≈3.8%，勉強仍<5%；mean-based
      p_mean≈0.00585在N=774下corrected≈98.9%，完全無法存活。這個
      N=774情境從未真正執行（scan_5d_net95從未在774分點全宇宙尺度
      重跑，屬於明確待補項，不能當作正式校正結果引用），但已足以說明
      mean統計量的顯著性禁不起「若真對整個分點宇宙都跑這方法」的最壞
      情境，median統計量相對耐得住。

      (B) volume-confound直接測試：把9217既有n=36筆交易
      （whale_9217_5dnet95_trades.csv）改用buy_5d（而非signal_date）
      排序，切成3個「跨時間」的volume tercile（各12筆，日期橫跨
      2025-02~2026-06，非集中單一時段）；另切4個純時序quartile（各9筆）
      作對照。兩套fold各自重跑同一套permutation檢定（詳見
      whale_9217_volume_stratified_fold_audit.json）。結果：3個volume
      tercile的r_adj_pct**方向全部為正**（mean+6.6%/+7.9%/+2.5%，
      median+4.5%/+7.3%/+4.8%），median-based permutation p在三個
      tercile**全部顯著**（0.026/0.006/0.023，皆<0.05）；mean-based
      僅在最大成交量tercile不顯著（p=0.284，其餘0.037/0.015顯著）。
      4個時序quartile方向同樣全部為正，但只有較晚兩個quartile
      （2026-03起）median/mean同時顯著，最早兩個quartile
      （2025-02~2026-02）皆不顯著——與原始「效果集中在2026年」的
      觀察一致。**結論**：把成交量與時間解耦後，正向方向在7個獨立
      fold中100%一致，median-based顯著性在3個volume tercile（而非只
      集中在高volume/晚期那一段）全部站得住，證明先前的正向結果不是
      單純「IS/OOS切分剛好被volume成長混淆」的假象；但顯著性本身仍
      集中在較晚時段與中小成交量區間，最大單筆成交量、最早期交易的
      證據都偏弱，且每個fold僅n=9~12，不能宣稱「任何時段任何量體都
      顯著」。

      【本輪誠實結論】兩項先前明確承認但未補測的缺口，本輪都用可重現
      的正式方法補上，補測結果對H1皆為**淨正面**：BH-FDR校正後9217
      仍是唯一雙統計量通過的候選；volume去confound後方向100%一致、
      median顯著性撐過3個獨立volume切法。但**不足以升級為passed**：
      (1) n=36本身仍偏小，各fold只有9-12筆；(2) mean統計量在「全宇宙
      暴露」最壞情境假設下無法存活，而這個假設從未被正式排除（待補）；
      (3) H3（分點=全客戶流量聚合，非單一大戶乾淨代理）這個結構性
      限制完全未被本輪觸及，依然成立；(4) 顯著性仍集中在較晚時段/
      中小成交量區間，不是全樣本均勻顯著。**H1維持contested**，但這是
      第一次針對A7多重比較與volume-confound做過正式、可重現、留有
      artifact（whale_9217_volume_stratified_fold_audit.json）的補測，
      而非僅靠敘述帶過；證據方向與可信度較前七輪更穩固。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: passed  # 月度panel regression + 延伸驗證均walk-forward IS/OOS，OOS只跑一次；12個月天期OOS因窗口不足(僅10個月)為na非passed。2026-08-08第八輪補做3個volume tercile+4個時序quartile共7個獨立fold（BUG-3/A2要求的≥3 fold），非單一70/30切分
        G3_regime_stratification: na  # 月度樣本數不足以再切regime
        G4_rejection_registry: passed  # H1/H2/H3/H4 均reject並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        H1(9217)：contested，非rejected（2026-07-28修正）：原「無edge」
        判斷建立在有瑕疵的訊號定義上——`monthly_net_signal()`是整月無
        條件加總淨買賣股數，跟songshan-copytrade實際live訊號
        （scan_5d_net95：滾動5交易日buy_5d≥5000萬且net_ratio≥0.95）不是
        同一件事，會被同月其他客戶流量稀釋。用真正live訊號重測（n=36）：
        t-test顯著但去極值後不穩健；改用permutation/placebo檢定（控制
        同股票隨機時機的null分布）後單尾p值 mean≈0.005-0.008、
        median≈0.00000-0.00005（3 seed×20000次置換皆穩定）——比t-test更
        決定性支持9217具備真實時機選擇能力，證據方向持續轉強。

        H2(9661)：**維持rejected，但這次是用對方法測出來的**（2026-07-28
        Track A.3）：比照9217同協議的live-faithful訊號重測（n=36），
        全樣本median-1.90%（負）、勝率47.2%（低於50%）、t/Wilcoxon/
        permutation檢定全部不顯著（p_mean=0.274、p_median=0.755）。這是
        一個乾淨的null result，跟9217用同一方法測出的強烈正向形成對比，
        佐證整套方法論本身沒有「測誰都測出正向」的系統性偏誤——9217的
        正向結果因此更可信。

        H3（分點=全客戶流量聚合，非單一大戶乾淨代理）不受上述修正影響，
        結構性限制依然成立。H4尚未用live-faithful訊號重跑，同樣待補。
        songshan-copytrade（9217）已核實目前非live（2026-07-27
        `config/job_registry.yaml`：songshan-copytrade-poll
        `status: disabled`；`config/order.yaml` songshan-copytrade區塊
        `dry_run: true`；2026-08-08本輪再次核對job_registry確認同樣
        disabled），無資金曝險急迫性，建議維持現狀待更多樣本外交易
        累積，不建議貿然停用也不建議因訊號轉強就立即加碼。12個月天期
        OOS驗證因資料窗口不足仍是open item。

        **2026-08-08第八輪（A7多重比較+volume-confound補測）更新**：
        BH-FDR（N=4，9217/9661/9227/9801真正同protocol測試家族）校正
        後9217仍是唯一mean(q=0.0121)與median(q=0.0002)雙統計量都通過
        的候選，9801僅mean通過（q=0.0121）但median未過（q=0.1665，
        與其既有「mean/median不一致」脆弱標籤吻合）。把n=36交易改用
        buy_5d切3個非時序volume tercile重測，方向100%為正、
        median-based p在3個tercile全部顯著；4個時序quartile方向也
        100%為正但只有較晚兩個顯著——確認先前正向結果不是純粹
        volume-growth confound的假象，但顯著性仍集中在中小成交量/
        較晚時段，n=9~12/fold仍薄。**證據強度較前七輪更穩固，但H1
        仍維持contested（非passed）**：sample size與H3結構性限制兩項
        缺口未解決，且mean統計量在「若對全774分點宇宙都跑此方法」的
        非正式worst-case情境下無法存活（median可存活但該情境本身
        從未真正執行）。songshan-copytrade維持現狀建議不變。完整數字
        見whale_9217_volume_stratified_fold_audit.json。

  expert-pool-pools-consensus-reverify:
    title: run_expert_pool_watch.py POOLS（2344/8046/8358三檔股票共識池）方法論體檢
    status: active
    phase: hypothesis
    split_spec: default_is_oos
    run_scripts:
      - scripts/research/study_expert_pool_consensus_reverify.py
    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-POOLS-ORIGINAL-METHODOLOGY-SOUND
        statement: >
          POOLS系統（fubon_xindian_funnel研究線P3→P7）當初選出2344/8046/8358
          三組核心分點共識池時，用的backtest協議跟whale-branch-l1h7-discovery
          事後確立的L1H7 SSOT（cost/beta調整）一致，不是類似8440/1650那種
          舊式無成本無β協議
        status: passed  # 確認P4/P5/P6報告本來就用「T+1開·H7收·30bps·β=1.15·vs IX0001」，跟build_expert_pool_trade_knowledge.py SSOT一致；核心分點選拔用「重複n≥8∧同股差>+1pp∧專長差>+1pp∧跨期」四門hard篩選，非隨意挑選。但P6「冠軍網格搜尋」（mode×門檻×policy≈24組合、挑最高分那格）本身有multiple-comparison/data-snooping問題，未做任何多重比較校正，也沒做過permutation檢定——這是本輪要交叉驗證的部分
      - id: H2-POOLS-CHAMPION-ROBUST-TO-EXTENDED-SAMPLE
        statement: >
          P6網格搜尋選出的8046/8358「冠軍」參數組，用延伸樣本
          （2024-07-01~2026-07-27，比原凍結窗口多10天且用完整歷史重跑
          而非cherry-pick子集）+ permutation/placebo檢定重新驗證後，
          統計顯著性與效果量能維持
        status: rejected  # 8046池原冠軍IS中位+15.7%(n=8)/OOS中位+32.93%(n=4)；延伸樣本重跑n=13後全樣本mean+4.71%/median+4.88%，t_p=0.224、wilcoxon_p=0.376完全不顯著，去除top5極端值後mean翻負。8358池原冠軍IS+20.6%/OOS+39.99%；延伸後n=13 mean+8.35%/median+10.88%，permutation median p=0.0002顯著但mean p=0.115不顯著、去除top5後mean翻負(-2.37%)。兩者原冠軍數字明顯是網格搜尋+極小OOS樣本(n=2~6)膨脹出來的，未經得起延伸樣本+permutation檢驗；僅2344池相對一致(延伸後median 5.80%仍略升於舊登記3.59%，但同樣對極端值敏感)。MC校正補充(2026-08-08)：原始P6網格搜尋完整記錄已尋回(reports/research/branch-footprint-screen/fubon_xindian_funnel/p6_grid_8046_8358.json，8358池實際30組mode×floor×policy組合而非24組)，但原始網格只存點估計(median/mean/win%)、從未對每格做顯著性檢定，故無法重建完整BH-FDR(需對30格逐一重跑訊號+permutation才有完整p值向量，本輪未做，列為明確待補缺口，非假裝已校正)。改用保守替代法：對8358冠軍格延伸樣本p值套用Bonferroni k=30校正(α/30=0.00167)——p_median=0.0002仍<0.00167(校正後仍顯著)，但p_mean=0.115本來就不顯著、校正後更不用談，且mean去極值後翻負——與known-whale-branch-live-signal-validation的9801(H2-9801-SONGJIANG-EDGE：p_mean=0.006顯著/p_median=0.083不顯著)同一種「mean/median不一致」紅旗，方向相反(此處median撐住、mean撐不住)，同樣不夠格宣稱穩健edge。8046池t/wilcoxon本就雙雙不顯著，加嚴只會更不顯著，未再重算
      - id: H3-9216-9268-CONSENSUS-FILTERS-NOISE
        statement: >
          9216(凱基-信義)/9268(凱基台北)雖然在單獨/全市場層級被判定為造市
          分點（market_maker_branch_exclusion_v1.json），但在POOLS的「同股
          ≥2核心分點同時出現」共識規則篩選下，觸發日的行為會顯著偏離它們
          自己的日常造市模式（例如share_of_day_buy顯著升高），代表共識
          規則本身具備過濾造市雜訊、留下真正重要重疊日的能力
        status: passed  # 9216在8046池共識日(n=13) share_of_day_buy mean=2.34%/median=1.01%，遠高於其平常日(n=282) mean=0.24%/median=0%，Mann-Whitney p=0.0057；9268在8358池共識日(n=13) mean=8.37%/median=6.36%，高於平常日(n=483) mean=4.69%/median=1.29%，p=0.011。兩者方向都支持「共識能過濾造市雜訊」；但結構性查證發現保留：9268在8358單獨就有8.3%(41/496天)天數淨買金額≥1億門檻，13次共識事件裡9268全部100%在場(常態性大額，非稀有訊號)；9216則只在7/13次共識事件在場(其在8046自身也僅14.8%~更低天數觸發門檻，較稀有)——真正的判別力量主要來自9875/9227/9216這類「稀有觸發」分點，9268/統一這類「常態活躍」分點在共識裡角色比較像陪襯而非核心判別依據，此細節尚未能完全排除「9268自身稀有大額日是否真攜帶資訊」的疑慮（8046池整體t/wilcoxon本就不顯著） ｜【2026-08-09 火力集中度補充】9216(hhi_res=+0.0718) 與 9268(+0.1849) 在金額口徑集中度判準下**雙雙被指認為機構流量**，且 9268 位於全體第 97 百分位（830 家中第 23）——這對本假說是**雙面**的：一方面支持「9216/9268 的日常流量確實不是方向性大戶」（強化「共識日與平常日有別」的對比基礎），另一方面也提醒 9268 那種「常態性大額 + 錢仍高度集中在權值股」的型態，其共識日的 share_of_day_buy 升高有可能只是避險部位規模波動而非資訊。原本註記的「9268 在 13 次共識事件裡 100% 在場、比較像陪襯」這個保留，在集中度證據下應**加重**而非減輕。判準本身不分有無 edge（見 whale-branch-l1h7-discovery H14），故此處只能當保留理由、不能當否證
    methodology: >
      沿用whale-branch-l1h7-discovery topic確立的L1H7 SSOT（build_expert_pool_
      trade_knowledge.py：T+1開盤進場/H7收盤出場/30bps成本/β=1.15/vs IX0001）
      與新建立的permutation/placebo顯著性檢定（src/research/
      branch_signal_validation.py：對每個共識事件從同一檔股票全部合法訊號日
      隨機抽一個當假訊號日，5000次建立null分布）。共識訊號重建沿用
      run_expert_pool_watch.py既有build_signals()/dedupe()的「同股≥2核心
      分點同時出現」邏輯（動態載入原始函式，未重寫規則本身），只延伸窗口
      到完整歷史(2024-07-01~2026-07-27)而非只看P5/P6報告當時的凍結子集。
    notes: >
      2026-07-28開題，源自「更進階研究計畫」（misty-discovering-puppy plan）
      Track C：既有run_expert_pool_watch.py的POOLS系統（2344華邦電/8046南電/
      8358金居三檔股票、各3個核心分點共識）核心名單裡含9216、9268——這兩個
      分點在whale-branch-l1h7-discovery研究的L1H7+entity-level驗證下被判定
      為造市/reject，需要查清楚兩套系統的方法論落差。

      expert_pool_staged_gate（config/order.yaml，目前enabled=true/dry_run=
      true）風險現況已核實為低風險：jobs底下是手動一次性條目（直接寫死
