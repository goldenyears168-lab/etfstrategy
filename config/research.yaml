      廖學邦/487哥）做身分查證與更嚴謹的驗證升級。個股層級 L1H7 timing +
      門檻掃描（2337、6147）起初顯示正向訊號，但比照本topic方法論教訓#2
      （報酬標準差隨天期擴大的統計假象）重新用 campaign 去重覆驗證後，
      2337/6147 的「顯著」結果完全消失——訊號本身就是同一波位置被拆成
      多筆偽獨立事件灌水出來的（呼應 whale-buy-concentration topic 的
      campaign dedup 邏輯，但這次是本研究者自己的方法論疏忽，非新教訓）。
      修復 stock_daily_bars 缺口（8358/1815/6147/3006/6141/6269/8213，
      INNER JOIN 靜默丟失真實交易紀錄的資料品質問題）後，最終改用月度
      net-position-change signal + sector/market panel regression（cluster
      -robust/Newey-West SE）+ walk-forward IS/OOS 做決定性驗證：**9217
      在控制產業與大盤共同因子後，signal 係數不顯著，無穩健可交易 edge**。
      此結論與本topic G2_oos_holdout=insufficient_n（僅event-level t-test，
      n=25 太小無法下結論）不衝突，而是用不同方法論（月度panel、更長
      獨立樣本、產業對照組）補上了原本「insufficient_n」缺口——**補上後
      的答案是負向的**，不是「還需要更多樣本」。9217 目前仍是 mini 上
      songshan-copytrade launchd job 的 live 訊號來源
      （config/order.yaml songshan-copytrade，branch_id=9217，
      auto_submit=true；yaml 內 dry_run=true 為預設安全值，mini 上
      ORDER_SONGSHAN_COPYTRADE_DRY_RUN 實際值未於本輪確認，需使用者
      核實）。**這與下方 action 欄「9217維持現行live不變」的既有結論
      直接衝突，是否降級/停用 songshan-copytrade 屬於使用者需要決定的
      實盤資金配置問題，本研究僅記錄統計結論，不自動變更 live 狀態。**

      【第六輪：第五輪panel regression訊號定義瑕疵修正 + 用真實live訊號
      決定性重測（2026-07-28）】使用者質疑第五輪「無edge」結論的地基
      （「這些應該是大師級分點，是我們的方法有問題」），審查後發現第五輪
      `monthly_net_signal()` 確實有致命瑕疵：訊號=「整月無條件加總淨買賣
      股數」（股票篩選只有「總買進交易日≥20天」流動性門檻，無集中度/
      金額門檻），跟 songshan-copytrade 實際交易的訊號完全是兩回事——會
      把487哥某天的重壓跟同月分點其他兩百多個散戶客戶的零散交易全部混在
      一起平均掉。查證 `scripts/research/run_songshan_follow_watch.py`
      的 `scan_5d_net95()` 與 `config/order.yaml` 的
      `songshan-copytrade`區塊，確認真正live訊號是**滾動5交易日窗口**：
      `buy_5d(5日買進金額加總)>=5000萬` 且 `net_ratio=(buy_5d-sell_5d)/
      buy_5d>=0.95`（5日內幾乎純買）。用這個精確比照live邏輯的訊號定義
      （25檔股票、mega排除、rising-edge去重、L1H7協議：T+1開盤進場/H7
      收盤出場/30bps成本/β=1.15）重新算出 n=36 個獨立事件（2024-07~
      2026-07），結果**推翻第五輪的「無edge」結論，但也不是決定性的
      「確認有效」**：
      - 全樣本：mean+5.66%、median+6.28%、勝率66.7%、t-test p=0.0426
        （原始顯著），但 Wilcoxon p=0.0668（不顯著）、median bootstrap
        95%CI跨零[-0.41%,+10.51%]
      - 去除前3大極端值後：mean降至+2.84%、t_p升至0.239（顯著性消失）；
        去除前5大後mean+2.76%、t_p=0.221——顯著性完全不耐去極值考驗
      - Walk-forward IS(≤2025-09-26,n=5)/OOS(>2025-09-26,n=31)：IS
        mean+0.30%/median-5.95%/勝率20%（樣本太薄無意義）；OOS
        mean+6.53%/median+7.27%/勝率74.2%/t_p=0.037/Wilcoxon
        p=0.058（邊緣）。**但此IS/OOS切分本身有confound**：9217自身
        月交易量2024→2026成長約4倍，固定0.5億門檻近期觸發頻率遠高於
        早期，OOS樣本其實主要反映「9217變活躍後的近期」，不是乾淨的
        跨時間樣本外驗證
      - 年度分解：2025(n=13) mean+1.89%/median+0.59%/勝率61.5%；
        2026(n=23) mean+7.80%/median+8.34%/勝率69.6%——效果集中在2026
      - 對照舊版event-level(n=25, whale_branch_l1h7_universe_events.csv
        篩9217)：方向與新方法一致(正向)，t_p=0.126本來就不顯著，兩者
        定性結論相近（正向但脆弱），不同於panel regression的「無edge」
      - 唯一持續穩定的正面訊號：**勝率在各種切法/去極值後都維持在
        62-75%區間，沒有崩潰**，這是跟純雜訊不一致的跡象，但點估計顯著
        性本身不耐考驗
      詳見 whale_9217_5dnet95_summary.json。**結論修正**：第五輪「無
      穩健edge」的判斷本身是對的方法論用錯了訊號定義得出的，不能作為
      停用songshan-copytrade的依據；但第六輪這次用對訊號定義重測後，
      證據強度也遠不到「決定性驗證有效」的地步（n=36仍偏小、顯著性不
      耐去極值、IS/OOS切分被分點自身交易量成長混淆）。誠實現狀：**方向
      正向但尚未決定性驗證**，建議維持現行保守配置（dry-run或小額）、
      累積更多真實樣本外交易後再決定是否放大部位，不建議因本輪結果
      加碼，也不建議因第五輪的錯誤結論降級停用。

      【第七輪：Track D+A.1 permutation/placebo顯著性檢定（2026-07-28）】
      使用者核准「更進階研究計畫」（misty-discovering-puppy plan），其中
      Track D要求建立比t-test/Wilcoxon更適合小n厚尾情境的驗證工具。新增
      `src/research/branch_signal_validation.py`（可重用模組，Track A/B/C
      共用）：對每個真實觸發事件，從『同一檔股票』全部L1H7合法訊號日中
      隨機抽一個當假訊號日，重複20,000次建立null分布，測的是「9217選的
      時機是否比同一批股票上的隨機時機更好」，不依賴t分布漸進假設。
      對第六輪的n=36事件跑此檢定（3個不同seed交叉驗證，結果穩定）：
      **單尾經驗p值 mean≈0.005-0.008、median≈0.00000-0.00005（20,000次
      置換中幾乎沒有任何一次達到或超過觀察值）**。null分布本身：
      placebo mean of means≈+0.95~0.98%（std≈1.7%），placebo mean of
      medians≈-0.81~-0.83%（std≈1.35%，中位數null本身略為負值，符合
      β=1.15調整下這批中小型股在此期間的自然特徵）——觀察到的真實中位數
      +6.275% 遠遠落在null分布的極端尾部。**這比第六輪的t-test（p=0.043
      全樣本、去極值後p=0.24）更決定性地支持9217具備真實時機選擇能力**：
      permutation檢定控制了「這些股票本身在這段期間、這個β調整下的自然
      報酬特徵」，測的是純粹的timing skill，比對零值的單樣本t-test是更
      嚴格的null，9217依然大幅超越。詳見
      whale_9217_permutation_test_result.json。**結論再修正**：9217的
      live訊號證據強度比第六輪估計的更強——雖然t-test/Wilcoxon對極端值
      敏感、樣本量仍只有36筆，但permutation檢定（尤其是對極端值天生穩健
      的中位數統計量）給出了遠比t-test更決定性的正向訊號。仍建議在放大
      配置前累積更多樣本外交易以防範small-n的結構性風險（例如整個
      2024-2026窗口剛好處於某個特定市場regime），但目前證據已經比先前
      任一輪都更支持「9217具備真實可跟單edge」這個假說。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: weak_pass  # 第五輪月度panel regression結論(無edge)已被證實用錯訊號定義；第六輪t-test/Wilcoxon為weak_pass等級；第七輪permutation檢定(median p<0.0001, mean p≈0.005-0.008, 20000次×3 seed皆穩定)證據強度明顯更高，但仍維持weak_pass而非passed，因n=36本身樣本量偏小、OOS期與分點自身交易量成長仍有confound，需要更多樣本外時間驗證才升級
        G3_regime_stratification: na
        G4_rejection_registry: passed  # 779Z/920F/9239/9216/9B2a/5852/9268/9800/consensus_pairs/9699x7769/6696/6831 均明確拒絕並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        pure research（四輪分點宇宙篩選後仍未找到可採納新候選；9699×7769
        經深挖後判定reject，暫無pending線索）。**第七輪更新（2026-07-28）：
        用permutation/placebo檢定（src/research/branch_signal_validation.py）
        重新評估9217的n=36live訊號結果，單尾經驗p值mean≈0.005-0.008、
        median≈0.00000-0.00005（3個seed×20000次置換皆穩定），比第六輪
        t-test/Wilcoxon更決定性地支持9217具備真實時機選擇能力。songshan
        -copytrade建議維持現行dry-run/保守配置，證據方向持續轉強但n仍
        偏小，累積更多樣本外交易後可考慮升級配置。**第六輪原文（供對照）：
        第五輪判「9217無edge」的月度panel regression訊號定義有瑕疵（測的
        是無條件整月加總，不是live實際交易的滾動5日集中度訊號），已被
        推翻；用真正live訊號(scan_5d_net95)重測顯示方向正向但仍脆弱
        （n=36、t顯著但Wilcoxon邊緣、去極值後顯著性消失、IS/OOS切分被
        9217自身交易量4倍成長混淆）。songshan-copytrade建議維持現行
        dry-run/保守配置，不加碼也不降級，待更多樣本外交易累積。**

