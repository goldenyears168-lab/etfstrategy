          vs 原始JSON到達順序(=stable排序)不一致」，不是「同一份程式碼跑
          兩次給不同答案」，這個用詞區別決定了修法方向。JSON原始順序可信度
          檢查：抽查5組同秒≥8筆並列成交，raw JSON順序下的價格路徑全部呈現
          小步幅連續走勢(mean|Δprice| 0.0~5.9點、無隨機大跳)，符合交易所
          序列微結構特徵，支持「raw JSON row順序＝tick到達順序」這個proxy
          假設成立。

          **修法**（已寫入`build_orderflow_panel.py`本體，非另開檔案）：
          `load_front_month_day_ticks()`載入JSON後立刻附加`_orig_idx`
          (=原始JSON row序號)，兩處`sort_values("dt")`都改成
          `sort_values(["dt", "_orig_idx"])`——`_orig_idx`全域唯一使複合鍵
          不再有重複，quicksort/stable排出來的結果從此逐位元相同，比單純
          加`kind="stable"`更穩健（不依賴特定排序演算法的實作細節）。

          **可重現性證明**：用修好的程式碼獨立重跑全部821天兩次(各自重新
          `json.loads`、reset所有中間狀態)，兩次輸出`orderflow_panel.csv`
          (751列，750天沿用+2026-08-05新入快取)MD5逐位元相同
          (`78d7d94c243ed4ec1d37ceb6edccfb46`)，`diff`零差異。

          **與2026-08-07 second_reverify交叉驗證**：修好的panel跟原始
          (quicksort)panel逐日比對(750天共同交易日)，entry_price差異
          503/750(67.1%)、exit_price差異391/750(52.1%)、n_tick_ratio正負號
          翻轉181/750(24.1%)、return_pts差異601/750(80.1%)——跟
          second_reverify段落獨立算出的數字(67%/52%/24%/80%)逐位元相符，
          證實兩個獨立實作(這輪`_orig_idx`複合鍵 vs second_reverify的
          `kind='stable'`)修的是同一個bug、修法等價。

          **用修好的panel重跑完整IC篩選+回測**（未修改`orderflow_ic_
          backtest.py`任何gate邏輯，嚴格照腳本原生4/5-fold門檻）：n=751天
          (IS=526天2023-07-03~2025-08-27、OOS=225天2025-08-28~2026-08-06)。
          `n_tick_ratio`（原始panel裡唯一通過篩選的特徵）IS overall IC=
          -0.0342（跟second_reverify的-0.0342逐位元相同），5摺僅3/5同號，
          **未過4/5門檻**，照腳本設計不進入回測。10個特徵中只有
          `net_vol_ratio_raw`與`large_trade_net_vol_ratio`過4/5門檻(IC分別
          -0.0040、-0.0130)，但這兩個特徵749天裡100%同號(pearson corr=
          0.90)——「大單」用該窗口成交量前25%當門檻，跟整體
          net_vol_ratio_raw高度共線，本質是同一個訊號算了兩次，不是兩個
          獨立確認。這個訊號的回測：IS mean=-4.28pt/trade(p=0.537)、
          OOS mean=-1.23pt/trade(p=0.962)、FULL mean=-3.37pt/trade
          (p=0.714)，HAC(1)/(5)/(10)在IS/OOS/FULL三段全部不顯著(p最小
          0.502)。leak-check(IC=1.000)、shuffle-check(IC≈0.001~-0.003)
          兩個擾動測試皆通過，pipeline機制本身健全。

          **結論**：修好、可重現的panel下，這個假說找不到任何統計上站得住
          腳的訊號——10個特徵裡實質只有1個獨立訊號通過事前篩選門檻，且這個
          訊號的回測與HAC顯著性檢定全部落在雜訊範圍。對照「5摺至少4摺同號」
          的雜訊基準機率(~37.5%/特徵、10個特徵預期~3.75個純運氣通過)，
          實測(扣掉共線重複)僅1個獨立通過，甚至低於雜訊基準——沒有值得
          繼續追的殘留訊號。
        do_not_2026_08_08:
          - 引用2026-08-07 second_reverify段落裡「n_tick_ratio硬是照樣
            跑完回測」得到的OOS mean-74.72pt、HAC全部<0.05這組數字當作
            驗證過的發現——那次是在`n_tick_ratio`已經未過自己4/5門檻篩選
            的前提下，繞過腳本原生gate邏輯強行跑回測，屬於研究誠信檢查
            清單BUG-4「事後只挑對自己有利的一個特徵深究」的模式；這輪
            嚴格照腳本原生邏輯(未過篩選=不進回測)重跑，同一份修好的panel
            上找不到任何通過篩選又通過HAC顯著的特徵，這才是誠實的最終
            結論
          - 把`net_vol_ratio_raw`與`large_trade_net_vol_ratio`都通過篩選
            讀成「兩個獨立訊號互相驗證」——兩者749天100%同號、pearson
