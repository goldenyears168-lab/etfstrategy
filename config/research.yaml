# Research 層 · 探索性研究主題（SSOT）
# 術語：docs/terminology.md §4
# 腳本盤點：docs/research-script-inventory.md
# Pipeline 腳本：config/pipeline_scripts.yaml（非本檔）

# Phase A–C 收斂（2026-07-09）· archived runner → scripts/research/archive/
# Phase D（2026-07-09）· 0 active research · 非 pipeline runner 全移 archive · strategy 層維護 production

version: research-v5
layer: research

splits_ref: config/research_splits.yaml

principles:
  - exploratory · sweep · matrix · hypothesis testing
  - adoption graduates frozen spec to config/strategy.yaml
  - no daily close · no production screen until graduated
  - ex-post validation · PIT-safe baselines
  - sweep conclusions live in reports/research/ · not inline in this file

# ── Graduation gates（採納契約 · 機構流程簡化版）──
# 全部 G* 通過後才允許寫入 config/strategy.yaml
# 狀態：pending | passed | failed | na
graduation_gates:
  G1_preregistered_hypothesis:
    en: Hypotheses and sweep dimensions logged before first run
    zh: 假說與 sweep 維度在首次跑數前登錄於 topics.*.hypotheses / sweep
  G2_oos_holdout:
    en: Walk-forward or hold-out window passed · artifact in report_dir
    zh: 樣本外或 hold-out 通過 · JSON/Markdown 在 report_dir
  G3_regime_stratification:
    en: Breadth zone (or claimed regime axis) stratification not all negative
    zh: 廣度分層（或宣稱的環境軸）不全敗
  G4_rejection_registry:
    en: Near variants rejected with documented reason
    zh: 相近 variant 拒絕理由成文
  G5_frozen_spec:
    en: config/strategy.yaml entry + source_summary JSON path
    zh: strategy.yaml 凍結條目 + 證據 JSON
  G6_adoption_report:
    en: 8-section adoption report per docs/readdy-regime-strategy-lineage.md §1.2
    zh: 採納報告 8 章

lifecycle:
  phase: [hypothesis, is_sweep, wfa, oos_holdout, graduated, rejected]
  status:
    - active
    - paused
    - graduated
    - archived
    - rejected
    - converged

