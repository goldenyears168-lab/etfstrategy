      session-long cadence poll · 每一拍評估rolling 10m 交互（1m bars）。
      Primary case: 2026-07-14 · then Yahoo 1m/~5–7d + 5m/~60d panel.
      Proxy: ^TWII（IX0001若有1m則優先）× NQ=F（≈NQ1!）。
    design: |
      ## A. Poll clock（排程）
      - Cadence variants: every **5m** (primary ask) and every **10m** (baseline)
        · 5m clock: 09:05, 09:10, … 13:30
        · 10m clock: 09:10, 09:20, … 13:30
      - Window W(t)=(t−L, t] on 1m closes；L∈{5m, 10m} 交叉比較（排程≠窗長可不同）
      - Alignment: asof-join NQ→TW minute grid（ffill≤2m；缺口標記 incomplete）

      ## B. Features per poll（情形 × 因子）
      1) path: tw_win, nq_win, spread_win = tw_win−nq_win
      2) cumulative: cum_spread_from_open（自09:00到t）
      3) microstructure: corr_1m / beta_1m of Δlog in W(t)；sign-agreement rate
      4) stress z: spread_win 與 cum_spread 相對「當日過去poll」或「跨日同時段」分位
      5) flags: DETACHED = (spread_win≤τ1) OR (cum_spread≤τ2) OR (corr≤τ3 AND tw_win≤τ4)
         REPAIRING = (post-detached) AND (spread_win≥ρ1) AND (Δcum_spread≥ρ2)
         REPAIRED = cum_spread ≥ τ_detach + cushion 連續≥1 poll

      Soft probe 2026-07-14（1m）提示：5m排程+5m窗 首個嚴重槽可早到 **09:15**；
      10m排程會把同一刀併進 09:10–09:20 格、較晚才標「代表性」。

      ## C. Case study protocol（先做）
      - Day: 2026-07-14（必要）+ 對照大事件日與假警報日
      - Deliver: poll timeline table · 標出10點前「代表性嚴重偏離槽」與全日「修復槽／未修復」
      - Bootstrap: Yahoo 1m（~7d）足夠單日；再擴到5m 60d 統計τ

      ## D. Panel validation（後做）
      - Event label: session peak→trough ≥3%（或2.5%敏感度）
      - Lead test: 首個 DETACHED poll 是否早於低點≥X min；precision/FPR per日與跨日
      - Repair test: REPAIRING後 remain_dd vs 未修復日
      - OOS: 時間切半；禁止偷看全日標記建閾值

      ## E. Non-goals
      - 不直接 Order-layer auto sell-all
      - 不取代 H2@60m 長樣本閘門；本topic回答「時時刻刻10分排程」的狀態機
    notes: >
      Soft probe 2026-07-14 1m: 10點前無單窗 −1%+ 暴跌；偏離是累積——
      09:40 窗 corr崩至~0.09 + spread_win最負；cum_spread 10:00已~−1.47%；
      全日 cum 谷底 11:20；之後反彈但 cum 未收復−1%（結構性落後未「修完」）。
      20260715 detach sweep: best net_edge≈+10.3k NTD/49d (1M notional) =
