  # ── 籌碼×價格背離 v2 · 相對市場 · 167 檔複核（2026-07-25）──
  chip-price-divergence-v2:
    title: 籌碼累積線 vs 價格結構背離 · 相對市場 · 多股
    status: active
    phase: research
    layer: research
    priority: P1
    report_dir: reports/research/chip-overlays/divergence_v2
    run_scripts:
      - scripts/research/run_chip_price_divergence_v2.py
    split_spec: universe167_is2019_2025_oos2026
    hypotheses:
      - id: H-1
        statement: >
          價格創 20 日新低但累積相對籌碼線未破底（底背離），在同為「價格新低」的日子中
          xfwd20 超額報酬占優，且 IS／OOS 同號
        status: supported  # 價差 IS +0.60pp／OOS +3.20pp・勝率 65.6% vs 55.7%；6/8 年為正
      - id: H-2
        statement: >
          跌價日中相對籌碼為買方者，優於相對籌碼為賣方者
        status: supported  # 價差 IS +0.29pp／OOS +1.59pp；6/8 年為正・廣度 59.4%
      - id: H-3
        statement: >
          頂背離（價創高、籌碼線未創高）可預測相對弱勢
        status: rejected  # 扣掉「價格 20 日新高」對照後 OOS lift −0.24pp = 純動能
      - id: H-4
        statement: >
          實務教學的「等背離結束＋量增價漲再進場」優於在弱勢日直接進場
        status: rejected  # OOS 比量增上漲日對照低 2.73pp・IS 亦為負
      - id: H-5
        statement: >
          連續 3／5 日相對買超（flow persistence）或「籌碼進＋融資減」鎖碼可獨立預測
        status: rejected  # IS 皆為負、OOS 才轉正 = 2026 regime 假象
    context: >
      修正 v1 六缺陷後，使用者原始直覺（價格比籌碼弱＝潛在買點）**成立但幅度小**：
      這是橫斷面排序濾網等級（跨股廣度僅 59.4%），不足以當單股觸發或 Live TA 色階。
      2022 空頭年價差翻負（−0.11），效果逐年放大（2023 +0.67 → 2026 +3.20）表示近年
      數字含高分散多頭紅利，合理預期應取 IS 的 +0.3~0.7pp。上線前缺：成本／流動性過濾、
      與現有 sleeve 相關性、空頭年開關。決定性方法論：所有籌碼訊號都必須對**配對純價格
      對照組**測 lift，否則會把動能誤判成籌碼發現（H-3 即為此例）。

