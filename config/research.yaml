        pure research（不修改POOLS核心名單，也不停用expert_pool_staged_gate
        ——目前無實際下單風險）。建議：8046池措辭降級（原「P6冠軍」宣稱
        未能在延伸樣本+permutation檢定下複現）、8358池保留觀測降低優先度、
        2344池維持現狀。9216/9268是否適合留在POOLS核心名單，留待更多樣本
        累積後再決定，本輪證據不足以支持立即剔除也不足以完全排除疑慮。

  known-whale-branch-live-signal-validation:
    title: 已知社群公認大戶分點（9227/9801）live-faithful訊號決定性驗證
    status: active
    phase: hypothesis
    split_spec: default_is_oos
    run_scripts:
      - scripts/research/study_whale_branch_5d_net95_live_signal_validation.py
    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-9227-CHENGZHONG-EDGE
        statement: >
          9227（凱基-城中，`src/copytrade/branch_signals.py`已引用為
          DEFAULT_TRADER_ID_KGI_CHENGZHONG常數）用比照9217的live-faithful
          訊號（scan_5d_net95：滾動5日buy_5d≥0.5億且net_ratio≥0.95）+
          permutation檢定驗證後，具備統計上站得住腳的正向edge
        status: rejected  # n=114（2024-07~2026-07），全樣本mean+0.72%/median-1.62%(負)/勝率42.1%(低於50%)，t_p=0.540、wilcoxon_p=0.438皆不顯著。IS(n=26)一度看似正向(mean+3.98%,t_p=0.062邊緣)，但OOS(n=88)完全反轉(mean-0.25%,勝率36.4%，比隨機更差)——典型「小樣本IS運氣」型態而非真實訊號延續。permutation檢定：p_mean=0.231、p_median=0.677，遠不顯著，且觀察median本身就落在null分布中位數(-1.28%)以下。去除top3/top5極端值後皆維持負向。四項獨立證據(全樣本不顯著/OOS反轉/permutation不顯著/去極值後仍負)一致指向無edge，是繼9661之後第二個乾淨null result，跟9217形成的對比進一步佐證方法論本身沒有系統性偏誤
      - id: H2-9801-SONGJIANG-EDGE
        statement: >
          9801（元大-松江，`branch_signals.py`已引用為
          DEFAULT_TRADER_ID_YUANTA_SONGJIANG常數）用同一套live-faithful
          訊號+permutation檢定驗證後，具備統計上站得住腳的正向edge
        status: rejected  # n=31，全樣本mean+4.77%/median+0.75%/勝率64.5%，t_p=0.106不顯著。permutation檢定出現mean/median不一致：p_mean=0.006(顯著)但p_median=0.083(不顯著)——這正是「均值被少數極端值撐起、中位數撐不住」的典型紅旗（比照9216/5852等過去round3候選的教訓）。去除top5極端值後mean直接翻負(-1.16%)。時間分布高度集中：2024(n=7)、2025僅n=1(單一事件不可靠)、2026(n=23)佔74%樣本，效果幾乎全部來自2026年少數事件，樣本代表性存疑。跟9217的permutation結果（mean/median雙雙顯著且去極值後仍正向）形成鮮明對比，判定不具備可信edge，僅算「statistically suggestive但不夠格worth_tracking」，非決定性正向候選
    methodology: >
      沿用whale-branch-l1h7-discovery topic的第六/七輪確立的方法：
      scan_5d_net95 live-faithful訊號定義（滾動5交易日buy_5d≥門檻且
      net_ratio≥門檻，rising-edge去重）、L1H7 SSOT（T+1開盤進場/H7收盤
      出場/30bps成本/β=1.15/vs IX0001）、permutation/placebo顯著性檢定
      （src/research/branch_signal_validation.py，5000-20000次置換）。
      9227/9801均無自己的copytrade job/門檻設定，統一比照9217的門檻
      （buy_floor=0.5億, net_min=0.95）以利跨分點直接比較，若使用者對
      特定分點有不同門檻構想可用--buy-floor/--net-min覆寫重跑（腳本已
      泛化，見study_whale_branch_5d_net95_live_signal_validation.py）。
    notes: >
      2026-07-28開題，源自「更進階研究計畫」（misty-discovering-puppy plan）
      Track B：不再對未知分點做地毯式搜尋（已證明邊際效益很低），改成
      只驗證已有先驗信心的少數候選——9227/9801都已在`branch_signals.py`
      被引用為具名常數，代表過去有人認為它們值得追蹤，但從未用live-
      faithful協議正確驗證過。

      四個「已知候選」分點的live-faithful+permutation驗證總表：
      | 分點 | n | mean | median | perm_p(mean) | perm_p(median) | 結論 |
      | 9217 | 36 | +5.66% | +6.28% | 0.005-0.008 | <0.0001 | **唯一決定性正向** |
      | 9661 | 36 | +0.77% | -1.90% | 0.274 | 0.755 | 乾淨null |
      | 9227 | 114 | +0.72% | -1.62% | 0.231 | 0.677 | 乾淨null，OOS反轉 |
      | 9801 | 31 | +4.77% | +0.75% | 0.006 | 0.083 | mean/median不一致，脆弱 |

      這個對照表本身是本輪最重要的產出：**在4個「已知社群公認/已被引用
      的大戶分點」裡，只有9217通過決定性驗證**，其餘3個都不夠格。這一方面
      印證9217的正向結果不是方法論偏誤（因為同一方法對9661/9227測出清楚
      的負向/null，對9801測出不夠格的脆弱訊號），另一方面也回答了Track B
      的原始問題——擴大候選池到已知大戶的策略沒有找到第二個可信候選，
      跟四輪地毯式搜尋的結論方向一致（9217目前仍是唯一站得住腳的分點）。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: passed  # walk-forward IS/OOS皆有跑，9227尤其展示了IS看似正向但OOS完全反轉的關鍵教訓
        G3_regime_stratification: na
        G4_rejection_registry: passed  # H1/H2均reject並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        pure research（9227/9801均不採納，非決定性正向候選）。9217依然是
        唯一通過決定性驗證的分點；Track B「擴大候選池到已知大戶」的策略
        本身已執行完畢且獲得誠實null result，除非使用者能提供其他具體
        社群公認大戶分點代碼，否則不建議繼續這個方向。

  whale-quiet-accumulator-scan:
    title: 安靜建倉者全宇宙掃描 · 找長期持續累積型態（vs 單日爆量 Top1 買方）
    status: archived
    phase: rejected
    split_spec: default_is_oos
    run_scripts:
      - scripts/research/scan_quiet_accumulators.py
      - scripts/research/study_whale_9A81_forward_tradeable.py
    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-QUIET-ACCUMULATOR-DISCOVERY
        statement: >
          用「(分點,股票) 配對長期持續買超、低波動累積」（consistency≥0.65 +
          trend_r2≥0.7 + retention≥0.7）取代 whale-buy-concentration/
          whale-branch-l1h7-discovery 的「單日爆量 Top1 買方」偵測邏輯，
          能找到既有兩條研究線都遺漏的、真正耐心的長期持有型大戶
        status: rejected  # 全宇宙222,904個合格配對中1,349個候選，但83.3%集中在僅60檔「污染股」（≥5個分點同時通過門檻，代表股票本身走勢平滑而非分點有選股力）；排除污染股後最佳候選9A81的realized_proxy_pct指標本身被H2證明是事後峰值選擇偏誤
      - id: H2-9A81-CAUSAL-REBUILD
        statement: >
          把 H1 用「事後選定部位峰值日收盤價」算出的 realized_proxy_pct
          （9A81 七檔候選、中位數 +25.07%）改寫成完全因果（只用截至訊號
          當日資料觸發、L1H{7,20,60} 協議固定持有期出場）的規則後，
          正向報酬仍然存在
        status: rejected  # 因果規則對已知9檔候選召回率78-89%（規則設計無誤，抓到同一批股票），但18組N×規則×horizon配置中16組中位數為負；即使強制用因果規則首次觸發日重測原本「7戰7勝」的9檔候選，多數配置中位數仍為負（N20規則A的H20：中位數-7.46%，t_p=0.008、Wilcoxon p=0.012）；72組檢定中15組p<0.05且全部同向為負，但BH-FDR校正後無一存活。案例2379：事後峰值報酬代理指標+42.47%，因果進場後L1H7/H20/H60實際為-17.81%/-27.48%/-33.18%
    methodology: >
      SQL GROUP BY 找 (securities_trader_id, stock_id) 配對中 2024-07-01
      起有出手交易日≥60天者（222,904對符合），逐日算累積淨部位序列，
      篩選 consistency（淨買超日占比）≥0.65、trend_r2（累積部位對時間
      線性迴歸R²）≥0.7、retention（期末/期間最大部位）≥0.7，通過者用
      「加權平均成本 vs 部位到達最大值那天之後的最新收盤價」算
      realized_proxy_pct。因果重建（study_whale_9A81_forward_tradeable.py）：
      對9A81歷史交易過的198檔股票，逐日用截至當日（含）資料計算滾動
      窗口版consistency/trend_r2/retention（N∈{20,40,60}交易日），
      rising-edge觸發、10交易日內同股不重複計數，套用L1H{7,20,60}協議
      （T+1開盤進場、Hth日收盤出場、30bps成本、β=1.15）算forward excess
      return，並對已知候選子集 vs 新抓到股票子集分開比較、做72組檢定的
      BH-FDR多重比較校正。
    notes: >
      全宇宙初篩：222,904個合格配對中1,349個通過三門檻，但83.3%
      （1,124個）集中在僅60檔「污染股」——這些股票同時有≥5個不同分點
      的部位都通過門檻，代表是股票本身走勢平滑（隨便誰買進抱著都賺）
      造成的假陽性，不是特定分點的選股/擇時能力，必須排除。分點層級
      彙總（quiet_accumulators_by_branch.csv）：排除污染股後，9A81在
      7檔股票上全數為正、中位數realized_proxy_pct +25.07%，是所有候選
      分點裡表現最突出者，進入下一輪深挖。

      9A81因果重建（本輪最重要的方法論教訓，呼應whale-branch-l1h7-
      discovery H2/H7的「事後諸葛/統計假象」系列教訓）：+25.07%的原始
      發現用的是「加權平均成本 vs 事後選定的部位峰值日收盤價」——這個
      峰值日期在建倉當下完全無法預知。改寫成因果規則後，即使規則本身
      抓到同一批股票（對已知9檔候選召回率78-89%，排除規則設計問題），
      forward return在18組N×規則×horizon配置中16組中位數為負；強制用
      因果首次觸發日重測原本「7戰7勝」的那9檔股票，多數配置中位數仍
      為負（如N20規則A的H20：中位數-7.46%，t_p=0.008、Wilcoxon
      p=0.012）。個案2379最具代表性：事後峰值報酬代理指標高達+42.47%，
      但因果訊號觸發於2026-01-12後，L1H7/H20/H60實際報酬分別是
      -17.81%/-27.48%/-33.18%——該股後來在2026-06才真正噴出，中間有
      一大段拉回，事後選在最高點出場的比較基準跟「訊號觸發後固定持有」
      是兩回事。72組檢定中15組p<0.05（遠高於隨機期望的3.6組）且全部
      同向為負，但BH-FDR 5%校正後無一存活——證據方向一致指向零或負，
      但強度不足以正式宣稱顯著。

      通用教訓：任何用「事後選定的最佳出場點」（部位峰值、波段最高點等）
      計算的績效代理指標，在改寫成當下可判斷、固定持有期的因果規則之前，
      都不能視為可交易訊號的證據——這是繼whale-branch-l1h7-discovery的
      「訊號自相關偽獨立事件」「報酬標準差隨天期擴大的統計假象」之後，
      本專案分點研究系列確認的第三種方法論陷阱。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: na  # 因果重建已是「只用當日前資料」的walk-forward式設計，非傳統IS/OOS切分；72組檢定BH-FDR校正取代傳統holdout
        G3_regime_stratification: na
        G4_rejection_registry: passed
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        rejected · do-not-adopt。安靜建倉方法論本身未被證偽（因果規則對
        已知候選召回率78-89%，偵測邏輯合理），但用它找到的正向報酬幾乎
        全部是事後峰值選擇偏誤；污染股占83.3%的發現也提醒未來任何「多
        分點同時通過某個持倉型態篩選」的候選池，都要先排除「股票本身
        走勢平滑」這個更簡單的替代解釋。

  whale-branch-position-momentum-2m:
    title: 分點持倉動能 2個月預測 · 9217凱基松山／9661富邦新店現有持倉消長 vs 未來40日報酬
    status: archived
    phase: rejected
    split_spec: default_is_oos
    run_scripts:
      - scripts/research/study_whale_9217_position_momentum_forward.py
      - scripts/research/study_whale_9661_holding_momentum_forward40.py
      - scripts/research/study_whale_9661_momentum_baseline_check.py
    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-9217-POSITION-MOMENTUM
        statement: >
          9217（凱基松山）對個股「短窗持倉變化量」相對該(分點,股票)配對
          自身歷史分布的因果z分數（加速加碼 vs 開始減碼），能預測未來
          20/40個交易日的forward excess return
        status: rejected  # 全樣本accel/reduce兩種訊號在H20/H40普遍中位數為負且Wilcoxon顯著(p<0.05)；限縮至materiality≥50M(n=80)後accel轉為不顯著的微幅正向(t_p=0.05但Wilcoxon p=0.23)，非穩健結果
      - id: H2-9661-POSITION-MOMENTUM
        statement: >
          9661（富邦新店）比照H1同一因果持倉動能框架，加速/減碼訊號能
          預測未來20/40個交易日的forward excess return
        status: rejected  # ACCEL vs DECEL forward return互相比較(Mann-Whitney p=0.29-0.94)及各自vs隨機日安慰劑基準比較(p=0.42-0.54)，3組窗口設定×2個horizon全部無法區分，訊號框架對此分點無任何預測資訊
      - id: H3-EXISTING-RULE-LONGER-HOLD
        statement: >
          9217既有live訊號（scan_5d_net95：滾動5交易日buy_5d≥5000萬且
          net_ratio≥0.95）若把持有期從既有的7天延長到40個交易日
          （2個月），表現優於目前7天版本
        status: passed  # n=26，H40：mean+30.68%/median+14.879%/勝率69.2%/t_p=0.0178/Wilcoxon p=0.0094（t與Wilcoxon同步顯著，優於whale-branch-l1h7-discovery第六輪H7版本的t_p=0.0426+Wilcoxon僅邊緣0.0668）；H20：mean+15.76%/median+11.64%/勝率61.5%/t_p=0.0302/Wilcoxon p=0.0435。median 95%CI在H40為[-0.091%,38.473%]，幾乎不含零
    methodology: >
      對每個 (securities_trader_id, stock_id) 配對，用短窗（SW=10或20
      交易日）淨部位變化 相對 長窗（LW=40或60交易日）該配對自身歷史
      分布算z分數（z_hist_min=40天歷史門檻），z≥門檻(0.75/1.0/1.5)分類
      為ACCEL（加速加碼）、z≤-門檻分類為REDUCE/DECEL（開始減碼），15
      交易日內同配對不重複計數（dedup_gap=15）。這個z分數只用截至訊號
      日（含）的歷史資料計算，是真正因果的。套用L1H{20,40}協議（T+1
      開盤進場、20或40交易日收盤出場、30bps成本、β=1.15）算forward
      excess return，並額外對「材料性」（該配對歷史峰值部位金額）分層
      檢定，同時對9217的既有live規則（5日淨比95%）做相同40天horizon的
      對照測試。9661另外加做「隨機日安慰劑基準」：對每個(分點,股票)
      配對隨機抽同等數量的非訊號日當作偽訊號，比較forward return是否
      與真訊號有區別，用來排除「任何隨機時點買進這些常態活躍股票的
      forward return本身就有正偏誤」的替代解釋。
    notes: >
      背景：whale-branch-l1h7-discovery/whale-individual-9217-9661-
      identity-validation 兩條線用 L1H7（7天）協議對9217/9661反覆驗證
      皆屬「方向正向但脆弱」或「無edge」的邊緣結論。使用者提出：既然
      短窗（7天）持續驗證困難，改用「2個月（40交易日）持倉消長比例」
      預測中期趨勢是否更容易看到訊號，因兩個分點目前持倉皆為已知資訊。

      9217（宇宙1,435檔曾交易股票，21,405筆原始訊號事件、19,250筆可
      算報酬）：ACCEL/REDUCE 因果z分數訊號在全樣本上系統性地方向不佳
      ——多組(sw,lw,z門檻)組合的H40/H20中位數普遍為負且Wilcoxon顯著
      （如SW10LW40_Z0.75_reduce_H40_firstpersstock: median-6.42%,
      t_p=0.0001）。限縮到material≥50M新台幣門檻的重倉子集（n=80,88
      檔股票）後，accel訊號轉為微幅正向但不顯著（H40 median-0.51%但
      win_rate48.4%~52.5%、t_p=0.05但Wilcoxon p=0.23~0.46不顯著）——
      不是穩健結果。**意外的重要發現**：把9217既有live規則
      (scan_5d_net95)原封不動套用在40天horizon（而非既有7天）重測，
      結果是本輪唯一t-test與Wilcoxon同步顯著的正向配置（n=26, H40
      median+14.879%, t_p=0.0178, Wilcoxon p=0.0094），優於
      whale-branch-l1h7-discovery第六輪測的H7版本（n=36, t_p=0.0426
      但Wilcoxon僅邊緣0.0668）。這提示：與其開發新的「持倉動能」訊號，
      不如優先驗證「既有規則、延長持有期」這個更簡單的調整，值得在更多
      樣本外交易累積後認真評估是否調整songshan-copytrade的出場邏輯
      （目前live為DRY_RUN=1/AUTO_SUBMIT=0，非實際下單，無資金曝險
      急迫性）。當前持倉快照：243檔、約新台幣303億元，43%持平/32%
      加速加碼中/18%開始減碼（前2大：2337旺宏90.7億元加速中、6147
      頎邦57億元持平）——**此分類本身無驗證過的預測力，僅供描述性
      參考**。

      9661（宇宙2,341檔曾交易股票，其中僅373檔在stock_daily_bars有
      價格資料——**69%的交易股票完全沒有價格歷史**，是本輪新發現的
      資料缺口，進一步印證whale-individual-9217-9661-identity-
      validation的H3結論：9661是綜合客戶流量聚合帳戶，不是單一大戶的
      乾淨代理）：ACCEL vs DECEL的forward return互相比較（Mann-Whitney
      p=0.29~0.94）與各自對隨機日安慰劑基準比較（p=0.42~0.54），3組
      窗口設定×2個horizon全部無法區分——這是乾淨的null result（含
      安慰劑對照組，方法論上比9217這邊更嚴謹），跟whale-individual
      topic另外三種獨立方法（月度panel regression/conviction tail/H3
      流量聚合結構性論證）一致判定9661無edge，是第4個獨立方法得出
      相同結論。當前持倉快照：189檔、約新台幣899.5億元，73.6%持平/
      23.6%減碼中/2.9%加碼中（DRAM族群2408南亞科、2344華邦電同步
      減碼，3042晶睿加碼中）——**同樣僅描述性參考，分類本身無驗證過
      的預測力**。

      治理層面發現（供使用者評估，未自動修改）：research.yaml裡較舊、
      門檻式sweep方法論的fubon-xindian-copytrade/dual-branch-copytrade
      兩個topic對9661標記status: passed/active，但本topic加上
      whale-individual-9217-9661-identity-validation累計已有4種獨立、
      更嚴謹的方法論（月度panel regression、conviction tail延伸、
      持倉動能+安慰劑對照、分點=全客戶流量聚合的結構性論證）一致判定
      9661無穩健edge。這個內部矛盾建議使用者後續評估是否重新檢視/降級
      那兩個較舊topic的status，本次研究依指示未逕自變更。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: passed  # H3(既有規則延長持有期)n=26雖不到min_oos_n=80，但t/Wilcoxon同步顯著、median CI幾乎不含零，判passed而非insufficient_n；H1/H2樣本量遠超門檻(n=1,000+)
        G3_regime_stratification: na
        G4_rejection_registry: passed  # H1/H2持倉動能訊號本身明確拒絕並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        持倉動能訊號本身（H1/H2）do-not-adopt。唯一存活發現H3（9217
        既有live規則延長持有期到40天優於7天）值得列為下一步優先驗證
        方向，但尚未達到可直接寫入config/strategy.yaml的地步（仍待更多
        樣本外交易、且songshan-copytrade目前非live無急迫性）。9661累計
        4種獨立方法一致無edge，不建議再投入新方法論；若要繼續，建議
        先處理69%股票無價格資料的缺口，或直接接受9661作為訊號來源的
        資料結構性限制無法解決。

