        ——外資避險集中在少數權值股、自營台集中在少數避險標的，反而是 9217
        這種方向性大戶的錢攤得比它們平均。
      - 三個未參與門檻校準的獨立一致點：9239(高週轉當沖疑慮)0.1144 抓✓、
