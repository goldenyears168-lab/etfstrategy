      也已過期——三重保險下無實際下單風險，不需要立即動作。

      三組共識池L1H7+permutation重新驗證結果總表：
      | 池 | n | mean | median | win% | t_p | wilcoxon_p | perm_p(mean) | perm_p(median) |
      | 2344 | 14 | +8.03% | +5.80% | 71.4% | 0.045 | 0.042 | 0.010 | 0.015 |
      | 8046(含9216) | 13 | +4.71% | +4.88% | 61.5% | 0.224 | 0.376 | 0.115 | 0.026 |
      | 8358(含9268) | 13 | +8.35% | +10.88% | 69.2% | 0.099 | 0.110 | 0.011 | 0.0002 |
      三組樣本都偏小(n=13-14)，且都對去除top3-5極端值高度敏感——這跟
      whale-branch-l1h7-discovery一路發現的「厚尾主導點估計」問題完全一致，
