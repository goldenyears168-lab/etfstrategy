  intraday-direction-thermometer:
    title: 盤中方向溫度計（短線5分＋開盤守衛＋1h波段＋三日日K/大盤/籌碼）
    status: active
    phase: hypothesis
    layer: research
    report_dir: reports/research/intraday_direction_thermometer
    module: src/research/intraday_direction_thermometer.py
    run_scripts:
      - scripts/research/run_intraday_direction_thermometer.py
      - scripts/research/run_trend3d_thermometer_backtest.py
      - scripts/research/run_swing_1h_thermometer_backtest.py
      - scripts/research/run_ta_30m_bias_backtest.py
    frozen_defaults:
      open_guard_bars: 6
      swing_ready_bars: 12
      swing_lookback_bars: 8
      swing_horizon_bars: 12
      trend_days: 3
    hypotheses:
      - id: H-THERMO-1
        statement: >
          開盤後 N=6～8 根5分K不追高，可降低追價單的後續1h負期望；
          1h波段層需 L≥6～12 根才顯示；三日層結合日K＋相對IX0001＋三大法人淨額。
        status: testing
        adoptable_status: proposed
      - id: H-THERMO-SWING1H
        statement: >
          Frozen swing_1h（斜率＋短溫）對後續≈60m 方向命中 OOS≥60%
          （directed hit · temp≠0 · |fwd|≥0.05% · n≥500）。
        status: rejected
        evidence: reports/research/intraday_direction_thermometer/SWING_1H_EVAL.md
        note: >
          2026-07-24 Book：Primary OOS best≈48.4%（slope_only_L12 · n≈37k）；
          baseline≈46.5%。MR 翻轉僅≈51–53%。未過閘。Hard-stop 再掃 L。
      - id: H-THERMO-FADE30
        statement: >
          午盤贴近日高/日低之≈30m 均值回歸淡化（fade_near_ext）
          OOS directed≥60%（H=6 · midday · IS-champion 參數）。
        status: testing
        evidence: reports/research/intraday_direction_thermometer/SWING_1H_EVAL.md
        note: >
          2026-07-24：OOS≈62.1% n≈1846；個股異質（2330/2454 驅動；
          2303/0050/3189 弱）。非 Primary 60m；需 fresh holdout 才可談 overlay。
      - id: H-THERMO-TA30M-BIAS
        statement: >
          多因子 30m 偏多／偏空（mom30×VWAP×OR×短動能×極值淡化×量能／時段）
          融合後 OOS directed hit≥70%（H=6 · |fwd|≥0.05% · n≥500）
          且 ≥70% 個股 OOS hit≥55%（n≥50）・無單股>40% pool n。
        status: rejected
        evidence: reports/research/intraday_direction_thermometer/TA_30M_BIAS_EVAL.md
        note: >
          2026-07-24 Book：預先鎖定 22 變體；IS 冠軍=baseline_fade_near_ext
          OOS=62.13% n=1846；動能／Live confluence≈45%；穩定性 5/8。
          未過 70% 閘；Live ta_30m_bias 未改寫成預測宣稱。
    do_not:
      - 未過閘寫入 strategy.yaml / Order live
      - 把溫度計當自動下單訊號
      - 以 Secondary 30m 結果宣稱 Swing 1h / 60m 過閘
      - 把 Live ta_30m_bias 說成 OOS≥70%
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
