  tdcc-big-holder-forward:
    title: 集保大戶持股比變化 · 前瞻報酬預測力（存量軸首測）
    status: rejected
    phase: rejected
    layer: research
    report_dir: reports/research/chip-overlays
    run_scripts:
      - scripts/research/cache_holding_shares_futures_universe.py
      - scripts/research/tdcc_big_holder_forward_test.py
    hypotheses:
      - id: H-TDCC-1
        statement: >
          集保股權分散表的大戶持股比週變化（大戶 = 200 張以上）能預測個股前瞻
          相對報酬；大戶比例下降者後續走弱、適合作為放空條件
        status: rejected  # 見 notes：46 檔先導 rho=+0.063 (p=0.0000)，擴到 251 檔後 rho=−0.02~−0.05 符號翻轉；且升/降兩組都贏基準＝混淆非方向性
      - id: H-TDCC-2
        statement: >
          在「已經漲多」的股票上（延伸度 top 30%），大戶減少的空方訊號才會顯現
          （交互作用假說）
        status: rejected  # 預先宣告 2 門檻(200/1000張) × 3 天期 × 2 延伸層 = 12 格全部列出，BH-FDR 後最小 q=0.676（最小 p=0.111），無一通過；且延伸 top30% 內方向是反的（大戶降 +3.9%/+4.6% 反優於大戶升 +3.5%/+2.3%）
    methodology: >
      資料：FinMind TaiwanStockHoldingSharesPer，251 檔個股期貨宇宙 × 2024-06 ~ 2026-08，
      28,362 列（cache_holding_shares_futures_universe.py 一次抓齊 100/200/400/1000 張四個
      大戶門檻與 10/50 張兩個散戶門檻，避免門檻選擇本身變成事後挑選）。
      PIT：集保是週五資料、下週一才可得 → 前瞻報酬從資料日之後**第 2 個交易日**起算。
      報酬口徑：**橫斷面去均值**（減同週全宇宙平均），刻意不用固定 β——用 β=1.15 時
      全宇宙 4 週基準是 −1.34%，那是固定 β 對廣宇宙過度扣減的量測假象，會污染分層比較。
      重疊修正：週頻資料算 4 週前瞻＝4 倍重疊，另跑「每 4 週取一筆」的不重疊版本。
      Holdout：2025-10-01 之前 IS、之後保留。
    notes: >
      【為什麼做】本專案的訊號軸全部是**流量**（分點、三大法人、價格動能），
      「持股存量」軸從來是空的。集保大戶比是唯一正交的維度，值得一測。
      使用者觀察某檔個股的大戶/散戶比例圖後提出「大戶比例下降適合做空」的假說。

      【先導測試（46 檔專家池快取）】β=1.15 調整、4 週：大戶升 ≥+1.0pp → 超額 +10.51%／
      中位 +4.67%／勝率 57.5%；大戶降 → 中位 −0.47%／勝率 48.5%。Spearman rho=+0.063
      p=0.0000。看起來是本輪唯一通過無條件基準對照的東西。

      【擴到 251 檔後全滅】三個獨立的證偽：
      (1) **升降兩組都贏基準**——4 週相對報酬：基準 0（定義上）、大戶升 +2.566%、
          大戶降 +1.146%（holdout 分別 +2.978% / +1.850%）。方向性訊號應該一正一負，
          兩組同號代表抓到的是「大戶比例會大幅變動的股票本身與其他股票不同」這個混淆，
          不是預測力。
      (2) **符號翻轉**——46 檔 rho=+0.063；251 檔全期 −0.0010（重疊）／−0.0198（不重疊），
          holdout 4 週不重疊 −0.0488 (p=0.0145)、2 週不重疊 −0.0547 (p=0.0043)。
          僅有的顯著結果方向是「大戶增加→相對報酬較差」，與原假設相反，且 |rho|<0.055
          經濟意義等於零。
      (3) **交互作用救不回來**——12 格全部列出，BH-FDR 後最小 q=0.676。

      【本輪最該記住的】這是同一種失敗的第三次：9217 跟單（n=36 mean +5.66% → n=88
      median −3.7%）、延伸度放空（網格 12 格全正 → 扣掉市場日內漂移後歸零）、
      大戶持股比（46 檔 rho +0.063 → 251 檔符號翻轉）。**共同結構：在一個已被篩選過的
      小子集上量出關係，擴到全宇宙後消失。** 46 檔是專家池（已選過的強勢股）。
      先導測試的價值不是「發現訊號」，是「決定值不值得花 10 分鐘擴宇宙」——這次花了，
      得到乾淨的否定，很划算。

      【未排除的窄條件】週變化雜訊大，未測「連續 N 週趨勢」；未測 100/400 張門檻的
      交互作用（只測 200/1000）；未測與分點流量的交叉。這些若要做必須先預註記，
      不得因為主效果失敗就一路試到找出顯著格。

      【外部反例】鄭羽婷（2020, 台科大）《利用大戶持股比率變動的交易策略研究》：
      持有期長度的影響大於大戶持股變動本身，加入市場狀態與交易成本後超額利潤難以穩定取得。
      本輪結論與之一致。周依晴（2020, 台大）則發現顯著的是 100–200 張中實戶級距、
      不是千張大戶——若未來重啟，該從中實戶級距而非大戶級距切入。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed  # 12 格在跑之前寫死並全部列出
        G2_oos_holdout: rejected  # holdout 2025-10 起同樣為 null，且僅有的顯著方向與假設相反
        G3_regime_stratification: na
        G4_rejection_registry: passed  # H-TDCC-1／H-TDCC-2 皆明確 reject 並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        rejected · 不納入任何加權評分。大戶持股比變化在 251 檔期貨宇宙上沒有方向性
        預測力。若未來要重啟，建議 (a) 改測中實戶級距（周依晴 2020 的顯著級距）、
        (b) 改測連續多週趨勢而非單週變化、(c) 從第一天就扣 30bps 成本並預註記格子。
        快取已落檔（holding_shares_per_futures_universe.csv，251 檔 × 4 個大戶門檻），
        重啟時不需重抓。

