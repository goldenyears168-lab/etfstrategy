      三個 gate 全部沒守住：(1) 分層 SW_TH sweep 讓 switches/hr 進帶但 dwell
      仍卡 4 分鐘（H-SC-STRAT-DWELL rejected，結構性問題非門檻問題）；
      (2) 8 類粗分類因果準度提升的 58.25%/93pt 數字被 2/2 審查者以「n=162
      實為~83獨立日重複計、字典 in-sample 配適考卷」推翻（H-SC-COARSE-
      CATALOG-CAUSAL rejected）；(3) 邊緣回歸 PnL 146,312.7pt/勝率54% 被
      3/3 審查者推翻——決定性發現是 88% 的宣稱獲利（128,786.5pt）來自一個
      未揭露的「取較有利成交價」clamp bug，誠實 next_open 成交後淨利崩 92.5%
      到 11,022pt、勝率跌到 44.14%（低於銅板）（H-SC-EDGE-REVERT rejected）。
      按 pre-registered gate（三項全過才進 16-agent cell 參數優化），本輪判定
      no-go，未執行 16-agent 優化階段。

      下一步（若要重啟這條線）：(1) 修 fill clamp bug + leg_end look-ahead
      + 786筆遺失交易，用誠實 next_open 重新跑 PnL；(2) 8 類字典改真正
      walk-forward（校準期／測試期分離，日夜盤不可混算成同一個 n）；
      (3) dwell 分層要讓腿能跨越 regime 標籤翻頁，不能每次翻頁重啟 ZigZag
      狀態。三者都需要重新驗證，不是調參數就能救。

      2026-08-06 深夜第三輪：修好 H-SC-EDGE-REVERT 的三個 bug 後重測
      使用者描述的「轉換器」（H-SC-SAR-CONVERTER）——這次 3/3 審查通過
      （含 450 組未來擾動測試，工程面誠實無虞），但誠實結果三個模式
      （純逆勢/轉換器反手/順勢SAR）皆無正期望；MODE B 的「−910pt 接近
      打平」拆開後其實是 −58,508pt 結構虧損被 +46,938pt 少數尾部趨勢日
      抵銷，rejected。使用者接著指出兩個技術方向：通道寬度該用高分位數
      （不是中位數）、半寬校準該即時／近期（不是全歷史一鍋煮）、以及訊號
      該用 tick 級即時確認。第四輪測試：(a) H-SC-WIDTH-PERCENTILE——
      17 格 percentile×rolling-window 網格，審查通過，但核心發現是
      「回中線比例」完全不隨分位數變化（卡在 7.8%–12%，甚至方向反過來），
      根因是 target:stop 距離比例恆定 1:0.3，不是 half 絕對大小的問題；
      rejected，但留下明確的下一步線索（該 sweep 距離比例本身）。
      (b) H-SC-TICK-TRIGGER——13 天真實 tick 測試，net +380%、target 比例
      翻倍，4 位審查者 3/4 通過，但第 4 位抓到具體 look-ahead（通道剛
      lock 那根 bar 用該 bar 最後一筆 tick 的價格去判定該 bar 開頭的觸價），
      已量化污染約 11% 淨利／20% target 判定；標記 pending，需修好 lock
      時序後重測才能定案（不是重新開始，是修一個具體、已定位的 bug）。

      2026-08-06 深夜第五輪：兩個 agent 平行——(a) 修 H-SC-TICK-TRIGGER
      的 look-ahead：修復過程額外發現出場側（flip 通道重錨）還有另外 8 次
      同構污染是原始審查沒抓到的，合計 24 次污染全部堵住（2 位審查者各自
      獨立重建污染前版本重跑，皆精確重現 16+8=24→0）。修復後方向仍成立但
      幅度縮水 42%（net_pts_delta +2,356→+1,363pt），H-SC-TICK-TRIGGER
      轉 **passed**——這是本研究線目前唯一通過驗證的正面假說。
      (b) 新測 H-SC-DISTANCE-RATIO：把 target/stop 從綁在同一個 half 上
      解耦成獨立參數，20 格網格 2/2 審查通過，確認這確實是決定 target_pct
      的真正槓桿（可從 10~12% 調到最高 32.52%），但維持淨利為正的前提下
      天花板只到 ~18%，80% 這個目標在這個引擎架構下不可達，rejected。

      現況小結（第五輪，已過期）：H-SC-TICK-TRIGGER 曾是本研究線唯一存活
      的正面訊號（bar級13天樣本+1,363pt/220%改善），其餘七個假說皆
      rejected。當時建議下一步是擴大 tick 樣本＋walk-forward 驗證。

      2026-08-06 深夜第六輪：把 H-SC-TICK-TRIGGER 擴大到 59 天（IS=15天
      落在半寬校準期 2026-04~07 內／OOS=36天落在校準期外的
      2025-07~2026-03）+ walk-forward，**結果翻案**：IS 組 tick 級大幅
      劣於 bar 級（delta −296.6%，方向與之前所有測試相反）、OOS 組雖仍
      正向（+253.8%）但兩組總和都被個位數極端日主導（IS拿掉1天翻正、
      OOS拿掉top4天翻負）。深入調查發現最大單日逆轉（2026-06-23，
      bar+1690pt vs tick−496pt）**不是 bug、不是資料問題**，而是
      MODE B 反手機器對「通道剛lock那根bar能不能立刻用」這個時序極度
      敏感的混沌路徑依賴——bar版與tick版是同一個雜訊過程的兩條路徑，
      誰在特定一天抓對方向是蝴蝶效應級的偶然，不是穩定優勢。另外還抓到
      腳本自動產生的 robustness_verdict 標籤本身有正負號判斷 bug，把這種
      「方向相反、雙雙被極端日主導」的結果誤分類成最樂觀的標籤——這是本
      輪一個重要的方法論教訓：**自動生成的穩健性標籤不能不看逐日明細就
      採信**。H-SC-TICK-TRIGGER status 由 passed 改回 rejected。

      **研究線總結**：tmf-slow-pattern-cell 測過的九個交易/分類機制假說——
      H-SC-DWELL（慢尺度切換頻率存在，passed，唯一存活的基礎發現）、
      H-SC-CAUSAL-LAG／H-SC-STRAT-DWELL／H-SC-COARSE-CATALOG-CAUSAL／
      H-SC-EDGE-REVERT／H-SC-SAR-CONVERTER／H-SC-WIDTH-PERCENTILE／
      H-SC-DISTANCE-RATIO／H-SC-TICK-TRIGGER——全部 rejected。

      2026-08-06 深夜第七輪（使用者要求「突破盲點」後）：發現一個貫穿
      整條研究線的方法論缺口——H-SC-STAT-SIGNIFICANCE-GAP。至今所有
      rejected／passed 判定都是直接比點數總和正負號，從未做過正式統計
      顯著性檢定。補做後（用59天逐日tick-vs-bar配對差異）：
      mean=−7.5pt/day、se=61.0pt、**p=0.90**，95%CI=[−127,+112]舒服地
      涵蓋0——樣本的檢定力低到連自己觀察到的「巨幅逆轉」都測不出顯著性。
      **這代表本行前面所有「rejected」的判定，嚴格來說應該重新定性為
      「效應量小到無法與噪音區分」，不是「證明了沒有 edge」**——兩者在
      統計上是不同的結論，前者留了一扇門：可能有一個比目前樣本量能偵測
      到的更小、更穩定的 edge 被淹沒在逐日高變異度裡，也可能真的什麼都
      沒有，現有樣本量無法區分這兩種情況。

      這不改變短期操作建議（誠實成交下沒有一個機制展現出「大到一眼就能
      看出、扣成本後仍穩健」的 edge，不該貿然上線），但改變了長期定性：
      若要真正回答「有沒有 edge」這個問題而非「效應量看起來多大」，需要
      的不是再想新機制，而是大幅擴大樣本（估計需要接近500+天等級的
      資料才能把每日估計的95%CI收斂到有意義的寬度）或改用檢定力更高的
      評估方法（見 H-SC-STAT-SIGNIFICANCE-GAP 的 next_step）。

      **2026-08-07 第八輪（收尾）**：接回 FinMind 回補 484 天全新樣本外
      資料（2023-07~2025-06，程式化驗證與過去所有樣本零重疊），用旗艦
      配置正式跑出第一版「p=0.029 顯著負」的結論——但審查者主動補做
      腳本自己只用文字警告過、卻沒真的算過的自相關檢查，發現逐日序列
      lag-1 自相關 +0.335，Newey-West 校正後 p 值回升到 0.058~0.091，
      不再顯著。**最終定性**：就算用了統計檢定力足夠、完全乾淨的樣本外
      資料，旗艦配置（Mode B fade+flip, P60/N40）的表現仍然無法被嚴謹
      地判定為「顯著虧錢」或「顯著賺錢」——是統計上的一團模糊帶；但
      點估計在所有穩健性排列（拿掉最慘1/3/5天）下都維持負號、從未翻正，
      沒有任何跡象支持存在正面 edge。

      **本研究線正式收尾**：tmf-slow-pattern-cell 從 H-SC-DWELL（型態
      切換頻率是真實現象）出發，系統性測過逆勢回歸、順勢SAR、轉換器
      反手、通道寬度百分位、target/stop距離比例、tick級觸發共八種把
      切換頻率轉成可交易機制的方法，全部 rejected；最後用兩年乾淨樣本
      外資料＋正式統計檢定＋自相關校正做旗艦配置的終局判定，結果是
      「證據不足以支持任何方向的結論，但完全沒有正面訊號」。在
      ZigZag+固定/百分位通道這個框架內，沒有找到、也沒有統計證據支持
      存在一個可交易的 edge。若要繼續，需要脫離這個框架的全新機制
      假說（例如另一條已存在的研究線 tx-donchian-multiwindow-channel
      是不同的通道構造方式，值得評估是否已有更好的進展，而非在本框架
      內繼續打轉）。status 改為 archived。

      **2026-08-07 二度收尾**：使用者中途又帶了兩個新假說重新打開這條線
      ——H-SC-ADAPTIVE-RECOGNITION-SPEED（TR-based 動態縮放 SW_TH/lock_k，
      rejected：顯著虧錢）與 H-SC-NET-VELOCITY-RECOGNITION-SPEED
      （Efficiency Ratio 動態縮放，第一版有同根循環 bug、修復重測後仍
      rejected：HAC 校正後穩健顯著虧損 p≈1.85e-6）。兩者都用了跟旗艦
      配置同一套嚴謹方法論（484 天乾淨 OOS + 擾動測試因果驗證 + Newey-
      West HAC 顯著性 + 對抗審查），結論跟 8/6 收尾時完全一致：ZigZag+
      通道框架內，不論固定切換速度還是動態切換速度，都沒有找到可交易
      edge。使用者決定跳出這個框架找全新機制，status 再次改為 archived，
      本次為終局收尾。
    graduation_final: do-not-adopt · 10個交易機制假說皆rejected（8原始+2動態辨識速度）· 統計檢定力已足夠但仍測不出正面方向

  tx-donchian-multiwindow-channel:
    title: TX/TMF 日內 Donchian 通道 — 忠實移植、通道形狀對照、多 window 併行
    status: active
    phase: hypothesis
    layer: research
    report_dir: reports/research/tx-donchian-regime
    run_scripts:
      - scripts/research/tx_donchian_regime_smoketest.py
      - scripts/research/tx_donchian_intraday_faithful.py
      - scripts/research/tx_donchian_intraday_ablation.py
      - scripts/research/tx_channel_geometry_control.py
      - scripts/research/tx_channel_geometry_realism_check.py
      - scripts/research/tx_channel_geometry_multiday.py
      - scripts/research/tx_channel_recalibrate.py
      - scripts/research/tx_channel_multiwindow_portfolio.py
      - scripts/research/tx_channel_daynight_split.py
      - scripts/research/tx_channel_tick_validation.py
      - scripts/research/tx_channel_tick_pnl_check.py
    hypotheses:
      - id: H-TXD-FAITHFUL-HIGHFREQ
        statement: >
          忠實移植 GitHub `donchian_strategy`(ikonushok) repo 原作者的高頻
          intra-channel 邏輯（window=11, rsi_exit=42, cooldown=8），未經
          任何 TX/TMF 重新校準，直接套用能在 TX/TMF 1分K上做到「每天數十筆
          交易」且獲利。
        status: rejected
        evidence: >
          單日(8/6) smoke test：29次翻倉、勝率44.8%、-237.0pt。加回原作者
          自己在 auxiliary/utils.py 明訂的 trade_on_close=False（下一根
          開盤成交，非同根收盤）+ production TMF 看板實測的 5.9pt/筆成本
          後，三個變體（baseline/no_rsi_exit）全部翻負。83天全樣本驗證
          （tmf_channel 離線快取 2026-04-01~07-31）：2,900筆交易、
          -16,119.0pt、日均-194.2pt、正報酬天數僅34/83(41%)、年化
          Sharpe-like -4.57。平均每筆虧損(-5.56pt)幾乎完全等於固定成本
          (5.9pt)，代表訊號本身接近零edge，虧損主要來自交易成本，不是
          方向判斷錯誤。
        do_not:
          - 引用單日 -237.0pt 或任何單日結果下結論——83天全樣本才是可信
            的判定基礎
          - 認為調整 RSI/cooldown 能救回這個 window——第七輪頻率-edge
            對照證實 window<34 這條路在扣除5.9pt/筆成本後結構性轉負，
            不是參數沒調好
      - id: H-TXD-LRC-GEOMETRY
        statement: >
          斜率型 Linear Regression Channel（跟著局部趨勢角度傾斜、貼近
          價格）在相同訊號狀態機下大幅優於水平型 Donchian（rolling
          max/min，固定階梯狀）。
        status: rejected
        evidence: >
          單日對照組（同一套RSI exit+cooldown+ATR濾網，只換通道來源）：
          lrc_baseline +476.0pt 大幅勝過 donchian_baseline -237.0pt，
          翻倉頻率也高2.3倍(67 vs 29筆)。**但邏輯稽核發現這是零成本/
          零延遲執行假設造出的假象**：(1) 獲利集中度極高，最賺的前3筆
          貢獻97.3%總獲利；(2) 加回原作者自己的 trade_on_close=False +
          5.9pt/筆成本後，LRC兩個版本反而變成表現最差的（lrc_no_rsi_exit
          最終-514.3pt，比Donchian的-430.1pt還慘）。83天驗證：LRC虧損
          速度是Donchian的兩倍以上（日均-447.9pt vs -194.2pt），因為LRC
          交易頻率高2.3倍，對固定成本的曝險天生更大。
        do_not:
          - 引用單日零成本零延遲版本的 +476.0pt 當結論——那是不寫實執行
            假設放大出來的假象
          - 認為斜率型通道天生優於水平型——本輪只證明「LRC在這個特定
            訊號狀態機+這組參數下，扣除真實成本後更差」，不是通道形狀
            本身的普遍結論
      - id: H-TXD-WINDOW-RECALIBRATION
        statement: >
          針對 TX/TMF（而非原作者的 EURGBP/EURUSD）重新校準 Donchian
          window，能找到通過樣本外驗證的正報酬設定——即使代價是放棄
          「日內高頻」（每天數十筆）這個原始頻率目標。
        status: rejected  # 2026-08-07 盲點輪翻案：session結尾未平倉部位從未結算，誠實force-close後 w233 +19,362.6→-5,417.8pt，全部window翻負（見H-TXD-SESSION-END-ACCOUNTING）
        evidence: >
          83天依時間序切70/30 IS/OOS網格搜尋（只在IS排名，OOS不參與選
          參數），發現window=55一次性OOS驗證正報酬(+3,123.3pt、
          15/25天正報酬、Sharpe+3.10)，但**3摺滾動驗證推翻了這個發現**
          ——w55在Fold3轉虧，代表單次70/30切分只是運氣切在它表現好的
          時段。往外延伸精細網格(180~290)+5摺滾動驗證後收斂：
          **window=233平均Sharpe最高(15.78)，且是七個候選裡唯一五段
          獨立測試期全部正報酬的**。修正一個貫穿全系列的look-ahead bug
          （ATR濾網門檻原本用當天全天含未來K棒的分布算，改成只用IS天
          池化計算一次固定值）後結論幾乎不變（差異<1%），證實不是bug
          撐起這個發現。
        do_not:
          - 只做一次70/30切分就下結論——w55的教訓證明必須要多摺滾動
            驗證才能分辨「真穩定」還是「切分運氣」
          - 忽略頻率代價——window=233只有1.69筆/天，跟「日內高頻」的
            原始目標方向相反；這是用真實成本結構換來的結果，不是白撿的
      - id: H-TXD-MULTIWINDOW-PORTFOLIO
        statement: >
          不縮小單一window犧牲edge，改成多個已驗證有效的window（34/55/89）
          各自獨立開倉、損益直接加總，能同時達到「20+筆/天」的高頻目標
          與正報酬。
        status: rejected  # 2026-08-07 盲點輪翻案：誠實結算498個被丟棄的session尾部位(-92,174.2pt)後，+79,863.9→-12,310.3pt（見H-TXD-SESSION-END-ACCOUNTING）
        evidence: >
          w34+w55+w89併行（各自獨立記帳，訊號/部位完全不共用狀態）：
          83天trades/day=22.80（達成頻率目標），總損益36,680.2pt，
          55/83天正報酬，5摺滾動驗證4/5摺正報酬(平均Sharpe 7.09)。
          **重疊診斷發現關鍵限制**：三個window的持倉時間有72.7%是同
          方向重疊——「三個獨立分散」的敘事不成立，實際上更接近「同一個
          趨勢訊號被不同解析度重複確認、用三倍倉位加碼」，不是三個互不
          相關的機會來源。後續(H-TXD-SESSION-CONTINUITY-BUG)發現日夜盤
          分開算可以讓總損益提升到79,863.9pt，且day/night各自都是
          5/5摺正報酬。
        do_not:
          - 把「頻率疊加」講成「風險分散」——72.7%同方向重疊代表這本質
            上是一個放大版部位，保證金該抓3倍沒錯，但風險集中度不是
            三個獨立部位那樣分散，風控要用「一個大部位」的邏輯看待
          - 忽略Fold5的負報酬（合併連續版）——這個組合不是全時段穩定，
