          test「700-1000點停損距離×200元/點=14萬-20萬元/口」；(2)第
          十四輪風控「99百分位單筆虧損1033.2pt×200元/點=206,640元」→
          「連1口都要2,066萬-2,830萬本金才撐得起」。**這兩個結論若換算
          成產線實際唯一能下單的TMF（÷20），資金瓶頸敘事基本消失**：
          1033.2pt×10元/點=10,332元，1%風險預算下只需103萬本金即可
          撐1口，不是2,066萬。

          2/2審查通過（claim_survives=true）：全部程式碼/設定檔證據
          （TX fetch呼叫、cache symlink、`pv=10.0`位置、`product:TMF`、
          零命中TX/MTX/MXF、causal_engine.py讀取確實只在main() guard
          內未被worker_loop觸及）逐一grep核實存在，乘數換算數學正確，
          與CLAUDE.md下單層描述（TMF為唯一live下單標的）無矛盾。
        do_not:
          - 把「資金瓶頸敘事消失」讀成「這條線現在有機會上線」——
            H-TXD-SESSION-END-ACCOUNTING等翻負的rejected判定是pt-based
            的，跟乘數無關，換算後依然成立；本假說只糾正了「連1口都
            養不起」這個特定NTD資金結論算錯了乘數，不代表策略本身變得
            可交易
          - 忽略「研究資料(TX)≠產線下單契約(TMF)」這個根本落差——若
            要真的重啟這條線並考慮上線，第一步必須是把資料源換成/至少
            對照Fubon實際TMF報價、做TX vs TMF基差系統性檢查（目前只有
            第二輪單日驗證過一次），不是換個乘數常數就結束
          - 誤以為TX或MTX有可能成為下單標的——`src/order/`完全沒有這
            兩種契約的下單基礎設施，要交易TX/MTX需要整條新開發，不是
            設定檔調整
        basis_check_2026_08_07: >
          （補做「TX vs TMF基差系統性檢查」，回應上面do_not第2點）用
          `tmf-channel-poll` worker每輪(~20s)寫進log的真實TMF spot
          （`~/goldenstocks-data/logs/intraday/tmf_channel_live_
          2026080{5,6}.log`）比對同期FinMind TX tick，`merge_asof`
          (5秒容忍窗)配對出2,233筆TMF樣本、1,756筆有效配對。**basis
          (TMF−TX)均值+0.33pt、std 5.16pt，兩個交易日內都在±3pt內震盪
          沒有系統性漂移**，10秒容忍窗重跑結果穩定(mean穩定在
          +0.3~0.36pt)，不是配對時窗造成的假象。但std(~5pt)跟策略最細
          的判斷門檻(recipe cell的early_fill_gamma≈5-9pt)同量級——
          代表即使回測在TX上校準出訊號，套到TMF時同一時點可能多出約
          ±5pt獨立雜訊，量級足以讓臨界案例翻面。

          **誠實聲明：只有2個日曆日重疊(2026-08-05/06)，00:00-08:45
          完全空白(worker在08-06凌晨有crash斷點)，樣本量遠不足以下
          「基差穩定」或「基差會漂移」的結論**——這只是2天快照，看不到
          跨週/跨月/契約到期滾動(TMFH6於2026-08-19到期)前後的行為。
          估計需要至少20-30個獨立交易日才夠做日層級HAC顯著性檢定；
          worker本身每輪都在記錄spot，只需修好00:00附近的crash缺口讓
          它連續收錄幾週即可累積出來，不需要新增instrumentation。

          資料品質陷阱記錄：`finmind_tx_tick_by_day/`原始tick混了價差
          合約(calendar spread，`contract_date="202608/202609"`等，
          價格是價差點數~40-100不是指數點位~44000)，08-06當天81,116筆
          中954筆(1.2%)是這種污染資料；確認既有回測管線
          (`build_tick_cache_full83.py::pick_contract`)本來就有濾掉，
          但任何人拿raw per-day cache做ad hoc分析都要自己記得濾。
    do_not:
      - 把這條線的任何"passed"判定當作可以直接上線的訊號——全部驗證都
        只是點數總和正負號比較，沒有做過正式統計顯著性檢定（呼應
        H-SC-STAT-SIGNIFICANCE-GAP的同一個方法論缺口，本線的83天HAC
        補做見H-TXD-SESSION-END-ACCOUNTING evidence，兩個序列皆不顯著；
        H-TXD-NIGHT-TICK-COVERAGE-GAP發現的完整夜盤w233正號同樣未做
        顯著性檢定）
      - 混淆這條線跟 tmf-slow-pattern-cell 線——兩者資料來源、訊號機制、
        通道定義完全不同，只是都在研究TX/TMF channel breakout；不要把
        兩邊的發現互相引用當作對方的佐證
      - 認為標的身分已經完全解決到可以上線的程度——H-TXD-INSTRUMENT-
        IDENTITY已定案「資料=TX、下單=TMF、乘數需÷20」這個事實，但
        「資料源要不要換成TMF、TX/TMF基差多大」仍是未做的工作，不是
        已關閉的問題
    graduation:
      gates:
        G1_preregistered_hypothesis: failed  # 誠實揭露：這條線是先做完10+輪研究才回頭補登記，不是research.yaml先預註記才開始測試
        G2_oos_holdout: failed  # 2026-08-07翻案：5摺程序本身正確，但底層simulate漏結算session尾部位（H-TXD-SESSION-END-ACCOUNTING），誠實結算後所有OOS正報酬翻負
        G3_regime_stratification: failed  # 同上——day/night「各自5/5摺正報酬」建立在同一個記帳缺口上
        G4_rejection_registry: passed  # 6/8假說rejected且記錄do_not；僅存的passed是兩個方法論假說(SESSION-CONTINUITY-BUG/SESSION-END-ACCOUNTING)，無可交易機制
        G5_frozen_spec: na  # 不會凍結——核心PnL結論已被誠實記帳推翻
        G6_adoption_report: na
    notes: >
      2026-08-06~07：從「整合7個GitHub Donchian repo」開始，經忠實移植
      →ablation→通道形狀對照(Donchian vs LRC)→邏輯稽核→83天驗證→參數
      重新校準(IS/OOS+多摺滾動)→多window併行組合→日夜盤拆開→tick級驗證，
      共12輪。核心教訓跟tmf-slow-pattern-cell線高度一致：原始移植版本
      在真實成本結構下沒有edge，需要往低頻方向重新校準才找到正報酬；
      but 跟該線不同的是，這條線確實找到了通過多摺OOS驗證的正報酬設定
      （window=233單獨、或w34+w55+w89併行+day/night分開算），只是都
      伴隨頻率妥協或風險集中度的誠實保留。距離下單層仍有多個未解決缺口
      （標的身分、因果即時實作、正式統計顯著性檢定、部位/風控邏輯），
      詳見 reports/research/tx-donchian-regime/README.md 第十二輪之後
      的討論。

      2026-08-07：使用者授權5小時自主研究，針對上述缺口逐項補做（第十三~
      十六輪，詳見README）：(1) day/night拆開驗證，兩者各自5/5摺正報酬，
      且意外發現先前合併連續版本的通道會跨過session空檔污染，拆開後
      多window組合總損益從36,680.2pt提升到79,863.9pt；(2) 用582天真實
      tick資料(finmind_tx_tick_by_day/)驗證bar級近似不影響本策略訊號/
      損益(17天樣本、17/17同號、差距<1%)——跟tmf-slow-pattern-cell線
      對tick精度的敏感度不同，因為本架構是bar收盤觸發+次根開盤成交，
      不做intrabar觸價判斷；(3) 建成因果逐bar版引擎，過程中抓到兩個真實
      bug(初始合成部位的index基準、ATR/RSI的shift語意跟通道不同)，修復
      後83/83天與批次版完全等價；(4) 部位/風控設計重現了第一輪就出現過
      的「風險預算撐不起1口」問題，且發現天真的單日虧損熔斷在這批資料上
      沒有幫助、甚至讓總損益和最大回落雙雙變差(因為訊號不是強自相關，
      熔斷會同時砍掉會繼續虧的和會拉回獲利的部位)。副產品：這輪過程中
      發現 config/research.yaml 本身在此之前就是壞掉的YAML(H-SC-EDGE-
      REVERT do_not清單裡的"house rule #8"，空格+#被當成註解語法，導致
      整份檔案從那行以後解析失敗)——已修復，不是本次新增內容造成的。

      2026-08-07 深夜盲點輪（使用者要求「突破盲點，找到進場早期特徵」）：
      找到四個盲點，第四個推翻全線正報酬結論。(1) veto vs sizing 路徑
      依賴——always-in系統擋掉訊號會改變後續整條路徑，60/40「事後挑
      交易」+34%與5摺veto+0.9%的矛盾由此而來；sizing（路徑不變）收割
      atr_at_entry 5/5摺+39.2%。(2) 舊n_sleeves_agree的±5分鐘窗含未來
      =look-ahead，修為因果版。(3) 13個特徵全部改用5摺OOS Spearman IC
      從頭篩選。(4) **檢查mins_to_end為何異常強時，發現simulate_pnl_
      realistic從不結算session尾部位——498個被丟部位合計-92,174.2pt，
      把全線正報酬翻成負(-12,310.3pt)，第五輪以後所有絕對損益數字失效**
      （詳見H-TXD-SESSION-END-ACCOUNTING）。G2/G3因此翻案為failed，
      H-TXD-WINDOW-RECALIBRATION與H-TXD-MULTIWINDOW-PORTFOLIO翻案為
      rejected。這條線目前的誠實狀態：無可交易機制；倖存資產是方法論
      （因果引擎、sizing>veto、force-close規格）與已計交易子集內仍真實
      的條件性規律（高ATR進場/寬通道/多sleeve確認→表現較好），後者
      只有在先解決趨勢尾損失（停損/跨session/非always-in重構，皆為
      新研究）之後才有意義。

  tx-donchian-flat-default-bracket:
    title: TX/TMF Donchian flat-default + 停損停利 bracket 重構（G1正確預先登錄）
    status: active
    phase: hypothesis
    layer: research
    report_dir: reports/research/tx-donchian-regime
    design_doc: reports/research/tx-donchian-regime/flat-default-bracket-design.md
    run_scripts:
      - scripts/research/tx_flat_bracket_engine.py
      - scripts/research/tx_flat_bracket_causal.py
      - scripts/research/test_tx_flat_bracket_engine.py
      - scripts/research/tx_flat_bracket_phase2_screen.py
      - scripts/research/tx_flat_bracket_phase5_walkforward.py
      - scripts/research/tx_flat_bracket_engine_optionb.py
      - scripts/research/tx_flat_bracket_causal_optionb.py
      - scripts/research/test_tx_flat_bracket_engine_optionb.py
      - scripts/research/tx_flat_bracket_phase2_screen_optionb.py
      - scripts/research/tx_flat_bracket_phase5_walkforward_optionb.py
      - scripts/research/tx_flat_bracket_vol_regime_gate.py
      - scripts/research/tx_flat_bracket_regime_screen.py
      - scripts/research/tx_flat_bracket_vixtwn_gate.py
      - scripts/research/fold2_diagnostic_scratch.py
      - scripts/research/tx_flat_bracket_longvol_gate.py
      - scripts/research/tx_flat_bracket_shock_screen.py
      - scripts/research/tx_flat_bracket_engine_optione.py
      - scripts/research/tx_flat_bracket_causal_optione.py
      - scripts/research/test_tx_flat_bracket_engine_optione.py
      - scripts/research/tx_flat_bracket_phase2_screen_optione.py
    hypotheses:
      - id: H-TXFB-FLAT-DEFAULT-BREAKS-PATH-DEPENDENCE
        statement: >
          把 always-in 翻倉架構改成 flat-default（預設空手）+ 明確停損/停利
          bracket，能同時解決 tx-donchian-multiwindow-channel 線第十六輪暴露
          的兩個問題：(1) session尾記帳缺口——靠「進場即定義出場條件+session
          邊界強制平倉」在架構層面根除，不再是可被遺忘的實作細節；(2) veto
          的路徑依賴——已成交交易的進場價/出場價不再依賴前一筆交易怎麼結束
          （進場價=訊號bar的下一根開盤價，出場價=entry±固定距離，皆為進場
          當下一次鎖定的常數），使veto型態的進場濾網理論上重新可用（先前
          only sizing可用，veto不可用）。
        status: passed
        evidence: >
          Phase 1（`tx_flat_bracket_engine.py`批次版 + `tx_flat_bracket_causal.py`
          因果版）83天×3組參數×2session×2window＝996個區塊，批次vs因果
          bit-for-bit equivalence 996/996 PASS；對帳不變量
          n_events=n_entered+n_skipped_in_position 且 n_entered=交易筆數
          在所有測試組合上PASS——證實「進場即鎖定出場條件+session邊界強制
          平倉」確實在架構層面根除了記帳缺口（每個進場保證恰好產生一筆
          已平倉交易，不存在被靜默丟棄的尾部位）。debug過程中抓到兩個因果版
          特有的同根bar邊界bug（事件消費要用『本根開始前』的state snapshot、
          最後一根bar的事件要仿照批次版fill_idx clamp同根成交＋立刻重跑
          exit-check），修完才達到996/996——過程本身印證了「架構論證不等於
          已驗證」這條do_not的必要性。
        do_not:
          - 把「架構論證」當成「已驗證」——1.2節明確指出路徑依賴只有部分
            破除（進出場價格獨立，但「是否有空位吃到下一個訊號」仍有較弱
            的機會可得性依賴），veto vs sizing在新架構下是否給出一致結論
            必須實測，不能只憑論證採信
          - 忽略cooldown語意的正確定義（見design doc 1.3節）——cooldown若
            綁在「持倉狀態變化」而非「訊號事件」，會重新引入路徑依賴，這
            不是隨意的實作選擇，是整個「獨立事件」論點成立的必要條件
      - id: H-TXFB-OPTION-A-FIXED-BRACKET-EDGE
        statement: >
          選項A（固定點數對稱/非對稱bracket，STOP_PTS∈{80,120,160,200,250,
          300,400,500}×TARGET/STOP比∈{0.75,1.0,1.5,2.0}×window∈{34,55,89,233}）
          搭配flat-default架構，能在Donchian fade訊號上找到通過Phase 2粗篩
          +Phase 5 walk-forward的正報酬候選。
        status: rejected
        evidence: >
          Phase 2（83天，2026-04-01~2026-07-31）標準網格stop≤200pt：63/64組合
          總損益為負；放寬到stop∈{250..500}後，window=89出現一組方向一致的
          候選（day/night分別皆正、top5%集中度<15%、同根K棒stop/target同時
          觸及=0%），但Newey-West近似t≈1.1~1.3、p≈0.18~0.27，83天檢定力
          不足無法下結論（如design doc kill criterion 3預期）。Phase 5
          （750天，2023-07-03~2026-08-06，5個不重疊OOS fold）正式驗證：
          w89/stop400/ratio2.0、w89/stop400/ratio1.5、w89/stop500/ratio2.0
          三個候選全部只有2/5 fold正報酬（僅Fold5「2026-01-29~2026-08-06」
          為正，該fold與Phase2的83天樣本區間重疊），其餘4個fold全負，
          kill criterion 5（任一fold正負號翻轉）觸發，全樣本OOS總損益
          三者皆負（-5,197.2pt / -5,650.5pt / -8,611.7pt）。曾懷疑是TX指數
          750天內從~16,500漲到~44,000（近3倍）造成全歷史pool的ATR濾網門檻
          被低價期拖低的混淆，改用trailing 150天rolling門檻重測後結論不變
          （OOS總損益-6,428.3pt / -6,881.6pt，一樣只有Fold5為正）——排除了
          regime-scale confound，代表Phase 2找到的候選本質上是對Fold5那個
          特定4個月窗口的curve-fit，不是跨750天的穩健edge。
        do_not:
          - 不得只用83天樣本（或任何單一~4個月窗口）的正報酬結果宣稱找到
            edge——這正是本假說被推翻的機制，Phase 2的83天候選被證實只是
            Fold5窗口的curve-fit
          - 不得再對這組固定點數參數（w89/stop400~500/ratio1.5~2.0）做任何
            微調後重跑同一83天樣本當作「修正」——問題不在參數精度，是
            fixed-point bracket本身在跨regime樣本上不穩健
      - id: H-TXFB-OPTION-B-ATR-BRACKET-EDGE
        statement: >
          選項B（ATR倍數bracket，`stop=entry±k_stop×ATR[entry]`，k_stop∈
          {5,8,12,16,20,25}×TARGET/STOP比∈{0.75,1.0,1.5,2.0}×window∈
          {34,55,89,233}，k校準自83天樣本ATR(20)實測分布p5=11.2/p50=28.0/
          p95=77.9，不用design doc建議的{0.75,1.0,1.5,2.0}那組——套用在這個
          ATR尺度只會產生8~156pt停損，比選項A已知全負的<200pt網格還窄）能
          在Donchian fade訊號上找到通過Phase 2粗篩+Phase 5 walk-forward的
          正報酬候選，且ATR自動縮放能解決選項A「固定點數在3倍price regime
          上不穩健」這個失敗模式。
        status: rejected
        evidence: >
          Phase 1（`tx_flat_bracket_engine_optionb.py`+
          `tx_flat_bracket_causal_optionb.py`）83天×3組參數×2session×2window
          =996區塊批次vs因果equivalence 996/996 PASS，對帳不變量全過（debug
          時抓到一個選項A沒有的新bug：因果版entry_atr索引要用『成交那一根
          自己』算出的cur_atr，不能沿用前一根留下的值，否則對應到批次版
          `ATR.iat[fill_idx-1]`而非`ATR.iat[fill_idx]`，修法是把ATR更新
          移到on_bar最前面，成交判斷之後才做）。Phase 2（83天）96組合中
          window=89最佳候選（k_stop=20/ratio1.5：+7,125.2pt/207筆、
          t≈1.47；k_stop=25/ratio2.0：+7,018.75pt/185筆、t≈1.39）方向與
          選項A一致但略優。Phase 5（750天5-fold walk-forward，同選項A的
          expanding IS門檻）：三個候選（w89/k_stop20/ratio1.5、
          w89/k_stop25/ratio2.0、w89/k_stop20/ratio2.0）**跟選項A完全同一個
          fold pattern**——只有Fold3（2025-02-12~2025-08-05）與Fold5
          （2026-01-29~2026-08-06）正報酬，Fold1/2/4全負，kill criterion 5
          觸發，OOS總損益三者皆負（-7,531.0pt/-4,481.4pt/-6,765.0pt）。
          關鍵佐證：day/night分項損益數字（例如Fold1 day pnl，三個選項B
          候選都是-2,317.0或-2,145.0，非常接近選項A三個候選的-2,117.9~
          -2,640.2）——選項A/B共用同一套訊號產生層（Donchian突破+ATR濾網
          +cooldown），只有停損機制不同，兩者在同一組fold上以幾乎相同的
          方式失敗，代表問題出在**訊號本身**（window=89 Donchian fade在
          2024全年~2025年H2這段區間沒有edge），不是停損設計的選擇。
        do_not:
          - 把這個結果讀成「還沒試對ATR倍數的k值」——k_stop網格橫跨
            5~25倍ATR（換算實際停損距離約56~2,500pt，涵蓋選項A已知範圍的
            兩端），且結果的fold pattern與選項A一致，不是k值沒調好的問題
          - 選項C（通道對側邊界當停損）不建議再試——design doc本身已把它
            列為H-SC-SAR-CONVERTER/H-SC-WIDTH-PERCENTILE死掉的同一設計
            族群，選項A/B都失敗在訊號層而非停損機制，換一種停損幾何無助
            於解決訊號本身跨regime不穩定的問題
          - 不得只因為Phase 2的83天樣本（或任何落在Fold3/Fold5範圍內的
            子樣本）看到正報酬，就重啟這個window=89固定的Donchian fade
            訊號當候選——Fold3/Fold5是這條線目前找到的唯一兩個「訊號剛好
            有效」的區間，拿它們重新篩選只會重複同一個curve-fit陷阱
      - id: H-TXFB-VOL-REGIME-GATE
        statement: >
          選項A/B都在同一組fold（Fold1/2/4負、Fold3/5正）上失敗後，用
          trailing 20天|daily return|均值（因果、只用過去資料）當regime
          分層變數，能否解釋/預測這個window=89 Donchian fade訊號何時有效，
          並用一個causal walk-forward gate（只在trailing vol百分位超過門檻
          的日子才允許進場）真正解決kill criterion 5。
        status: rejected
        evidence: >
          全樣本（750天）描述性統計：daily pnl對trailing 20天realized vol
          分5個quintile，最高quintile單獨貢獻+9,031.8pt（其餘4個quintile
          合計-15,609.7pt），Spearman IC僅0.0627（p=0.09，非單調關係，只有
          最頂端quintile特別突出，呈現門檻效應而非線性關係）——這個描述性
          發現本身是真的，但只是後見之明的全樣本切分，不構成因果驗證。

          操作化成因果walk-forward gate（`tx_flat_bracket_vol_regime_gate.py`，
          每個fold的gate門檻值用IS期間trailing vol分佈的expanding百分位算，
          不用未來資料）後，結果不支持「這是可靠的regime條件」：門檻從
          50%拉到80%時OOS總損益確實從-1,467.7pt單調爬升到+1,571.2pt，
          乍看像regime story成立；但拉到85%/90%後**趨勢反轉**——Fold1虧損
          不再縮小（-4,099.8→-3,871.2→-4,217.2）、Fold3從正報酬(+665.4)
          翻負(-542.4→-868.2)、Fold4在85%/90%門檻下0天通過gate（完全被
          排除，而非被證明是虧錢regime）。決定性診斷：Fold5在90%門檻下仍
          有97/120天通過gate——Fold5本身幾乎全程都是「高vol regime」，
          所以收緊門檻在機制上只是不斷排除Fold1/2/4的交易日、讓Fold5佔
          OOS總和的比例越來越高，不是真的把Fold1/2/3各自的高vol子區間
          篩選成正報酬。換句話說，全樣本quintile分析裡「最高quintile賺錢」
          這件事，主要是Fold5整個fold都落在高quintile造成的，不是一個能
          跨fold遷移的regime條件。
        do_not:
          - 不得只看50~80%門檻區間「OOS總損益單調改善」就宣稱regime gate
            成立——85%/90%門檻的結果證明這個改善趨勢不會延續，且是
            Fold5佔比機械上升造成的假象，不是Fold1/2/3各自regime內部真的
            轉正
          - 不得把「trailing vol最高的日子傾向獲利」這個全樣本描述性統計
            直接當成可交易的規則——同一個統計量在拆到fold層級因果驗證後
            不成立，這正是這條線第八~十六輪一再示範的『單一切分/全樣本
            統計 vs 真正walk-forward驗證』落差
          - 不得因為這個特定vol定義（20天trailing、expanding百分位）失敗
            就斷言regime分層方向整體不可行——只排除了這一種具體操作化，
            其他regime變數（VIXTWN、外資期貨部位、TX自身趨勢posture）
            尚未測試，design doc下一步(2)建議的方向仍然開放
      - id: H-TXFB-VIXTWN-TREND-REGIME-GATE
        statement: >
          使用者要求「先試試其他regime變數」後，用IC-first篩選法（先做全樣本描述性
          Spearman IC，只對顯著的變數才進到昂貴的causal walk-forward驗證，避免vol
          gate那輪『一開始就對單一變數投入完整walk-forward』的浪費）測試VIXTWN水準/
          趨勢、外資期貨OI z60（champion因子）+其絕對值、TX自身MA20/MA60乖離率、
          TX自身20日趨勢強度共7個PIT-safe（皆shift(1)用T-1值）regime變數，能否找到
          可靠解釋/預測這個window=89 Donchian fade訊號何時有效的條件。
        status: rejected
        evidence: >
          全樣本IC篩選（`tx_flat_bracket_regime_screen.py`，750天）：僅
          `vixtwn_chg20_t1`（VIXTWN相對20天前的變化量）顯著，IC=-0.1013,
          p=0.0062（唯一p<0.05的變數）；其餘6個（vixtwn_level_t1、
          foreign_oi_z60_t1、foreign_oi_z60_abs_t1、tx_ma60_dev_pct_t1、
          tx_ma20_dev_pct_t1、tx_trend_strength20_t1）全部|IC|<0.04且p>0.32，
          未進一步驗證。負相關方向有經濟邏輯：VIXTWN趨穩/下降時fade表現較好
          （quintile q0：+34.6pt/day），VIXTWN急升時較差（q3/q4：-45.2/-39.8
          pt/day）——恐慌升溫期breakout更可能延續而非回歸，符合fade策略的
          直覺。

          操作化成causal walk-forward gate（`tx_flat_bracket_vixtwn_gate.py`，
          只保留vixtwn_chg20_t1 <= IS期間第N百分位的日子）後：OOS總損益隨
          門檻收緊持續改善（0%:-5,650.5pt → 40%:+3,960.9pt → 50%:+6,655.1pt
          → 60%:+6,485.2pt → 70%:+7,566.1pt → 80%:+7,906.1pt），且這次
          Fold5的改善**不是**vol gate那種純粹佔比假象——Fold5的交易天數隨
          門檻收緊大幅減少（120→34→...→59天）但總損益不減反增
          （5,948.2→8,725→...→13,803.8pt），代表gate確實在Fold5內部篩出
          品質更好的子集，不是機械式全部保留。但**kill criterion 5在所有
          6個門檻下都持續觸發**——正報酬fold數量固定停在2/5（Fold3、
          Fold5），Fold1/2/4在任何門檻下都沒有轉正；尤其Fold2在gate下
          per-trade平均pnl完全沒有改善（40%門檻：-3,211.8pt/142筆≈-22.6pt/
          筆，比0%門檻的-2,819.7pt/243筆≈-11.6pt/筆還差），代表Fold2
          （2024-08-09~2025-02-11）的問題與VIXTWN趨勢無關，是另一個未知
          因素。design doc要求「多數（非僅總和）fold正報酬」，2/5不是多數，
          即使OOS總損益轉正也不能宣稱通過。
        do_not:
          - 不得只看OOS總損益轉正就宣稱這個gate『有效』——design doc明確
            要求多數fold正報酬，2/5不是多數；OOS總損益轉正只代表Fold3/5的
            正貢獻夠大，蓋過了Fold1/2/4持續的虧損，不是Fold1/2/4本身變好
          - 不得把這次「Fold5天數減少但總損益增加」的較乾淨模式，跟vol
            gate那輪「Fold5幾乎全部通過、純佔比假象」的模式混為一談——
            兩者機制不同，這次是更接近真訊號但仍不足以通過kill criterion 5
            的中間案例，不是同一種失敗
          - 不得再對這7個regime變數的其餘6個（IC不顯著者）逐一做完整
            causal walk-forward——IC-first篩選的意義就是排除這些，重新測試
            等於否定篩選方法論本身
          - Fold2（2024-08-09~2025-02-11）在VIXTWN gate下毫無改善，代表
            至少還有一個未識別的regime因素——若要繼續這個方向，下一步該
            先诊断Fold2本身的市場特徵（而非再試其他全樣本regime變數），
            但這已超出「找regime條件」這個問題本身能回答的範圍
      - id: H-TXFB-FOLD2-DIAGNOSIS-AND-LONGVOL-GATE
        statement: >
          使用者要求「都繼續」後，(a) 獨立診斷Fold2為何在vol/VIXTWN gate下皆無改善，
          (b) 用診斷發現的線索（120天fold-aggregate realized vol能完全分開5個fold：
          losers全部16.8~21.3%年化、winners全部>32.8%）建構causal trailing版本
          （非fold自己的未來資料），重新測試walk-forward是否成立。
        status: rejected
        evidence: >
          **(a) Fold2診斷**（agent獨立分析，scratch script
          `scripts/research/fold2_diagnostic_scratch.py`）：(1) 交易層級是
          「千刀萬剮」不是黑天鵝尾部——win_rate 44.4%、avg_win/avg_loss幾乎
          對稱(+101.5/-102.1)、前3大虧損只佔總虧損8.8%；**關鍵發現：
          400/800pt固定bracket在Fold1~4幾乎從不觸發**（session_end_forced佔
          97.6~98.8%exit，stop僅0~1.2%、target=0%）——只有Fold5（價格水準
          更高、區間更寬）才有實質stop/target活動(21.5%/4.5%)，代表Fold1~4
          測到的其實接近『無停損扛到收盤』的診斷情境，不是名義上的bracket
          策略。(2) efficiency ratio不能分開winners/losers（Fold3純chop卻贏、
          Fold4最強趨勢卻輸）。(3) 120天fold-aggregate realized vol能完全
          分開5個fold（losers全部16.8~21.3%、winners全部>32.8%），但這是用
          『這個fold自己未來全部120天』當區塊統計量，不是causal。(4) 日夜盤：
          3個輸的fold都是兩個session都輸，2個贏的fold至少有一個session大贏。
          (5) 時間聚集是Fold2最尖銳的發現：78.6%的Fold2虧損集中在前40天
          （2024-08-09~2024-10-08），緊接在2024-08-05全球carry-trade平倉
          崩跌之後、涵蓋2024年9-10月中國刺激政策急拉急殺的鋸齒行情；
          Fold1最慘的是其*最後*1/3（2024-06-12~08-08，含崩跌本身）——
          **Fold1與Fold2共同橫跨同一個2024年8月崩跌事件**。Fold4則沒有找到
          可信的單一事件解釋。

          **(b) causal 120天trailing vol gate驗證**
          （`tx_flat_bracket_longvol_gate.py`，用T-1值、shift(1)避免用到
          當天，門檻用IS期間expanding百分位算）：**直接證偽了(a)發現的
          block-level統計量**——0/30/40/50/60百分位門檻下，Fold1、Fold2的
          交易天數**完全沒有變化**（永遠120/120天通過gate，數字與不gate時
          逐位元相同），代表用causal trailing方式衡量時，Fold1/2從來不曾
          被判定為『低vol』區間，即使在很寬鬆的門檻下也一樣——(a)發現的
          『5個fold完全分開』乾淨分離，是用整個fold自己的未來120天當區塊
          描述性統計量算出來的後見之明假象，不是可以即時判斷的因果訊號。
          Gate唯一真正影響到的是Fold4（40%門檻:-2,863.8→-101.0pt；50%:
          +449.6pt）和Fold5（持續走強），50%門檻下OOS總損益轉正
          (+2,026.3pt)、3/5 fold正報酬，但Fold1(-6,351.4pt)、Fold2
          (-2,819.7pt)全程紋風不動——這不是Fold1/2變好，只是Fold4/5的正
          貢獻蓋過了它們，跟前兩輪vol/VIXTWN gate犯的同一種錯誤一樣。
        do_not:
          - 不得引用『120天realized vol能完全分開5個fold』這個描述性發現
            當作可交易的regime條件——causal walk-forward版本直接證偽了它，
            這是本輪對『fold-aggregate統計量 vs causal trailing統計量』
            差異最乾淨的一次示範，往後任何regime分層的第一步描述性統計都
            要提醒自己這個風險
          - 不得把Fold4在50~60%門檻下轉正讀成『找到了Fold4的regime條件』
            ——Fold1/2從未被這個gate觸及，問題fold（尤其Fold2）完全沒被
            這支gate解釋到，跟H-TXFB-VOL-REGIME-GATE、
            H-TXFB-VIXTWN-TREND-REGIME-GATE是同一種『只搬動了本來就沒問題
            的fold、真正的問題fold紋風不動』失敗模式
          - Fold1+Fold2共同橫跨2024年8月崩跌事件這個發現雖然具體、可查證，
            但只是2個fold的個案觀察，不構成可交易規則——如果要繼續這個
            角度，需要的是『能不能causal偵測到carry-trade式流動性崩跌事件
            剛發生』這種截然不同的訊號類型（例如VIX/VIXTWN的單日跳空幅度、
            跨市場相關性瞬間飆升等），不是本輪已測過的trailing vol/VIXTWN
            趨勢類指標能回答的問題（此方向已在H-TXFB-SHOCK-EVENT-DETECTOR
            測試，結果同樣rejected）
      - id: H-TXFB-SHOCK-EVENT-DETECTOR
        statement: >
          使用者要求「請繼續測試」承接上一假說的do_not建議：Fold1/2的問題是離散
          『衝擊事件』（2024年8月carry-trade崩跌），不是前幾輪測過的緩慢trailing
          regime，兩者性質不同——trailing平均/趨勢類指標天生對離散事件不敏感。改測
          『事件剛發生』類PIT-safe特徵：VIXTWN單日跳空絕對值、trailing 10/20天內
          最大單日VIXTWN跳空、TX自身trailing 10/20天內最大單日High-Low區間占比、
          距離上次VIXTWN跳空事件天數，能否預測這個window=89 Donchian fade訊號的
          當日表現。
        status: rejected
        evidence: >
          全樣本IC篩選（`tx_flat_bracket_shock_screen.py`，750天）：6個特徵**全部
          未達顯著**，最好的是`vixtwn_shock_max10_t1`(trailing 10天最大單日VIXTWN
          跳空)，IC=0.0565, p=0.1247，其餘5個p全部>0.24。`days_since_vixtwn_shock_t1`
          （距離上次VIXTWN跳空事件天數，衝擊事件定義為單日變化超過IS期間90百分位）
          IC=-0.0102, p=0.78，幾乎零相關——雖然這個特徵在Fold2最慘的前40天
          （2024-08-09~10-08）確實顯示mean=1.17天、median=0.5天（該窗口內策略
          持續處於『剛發生過衝擊』的狀態，表面上符合診斷時的敘事），但這只是
          單一fold視窗內的個案吻合，放到全樣本750天的層級上完全沒有可偵測的
          預測力——許多其他『剛發生VIXTWN跳空』的日子並沒有對應變差的表現，
          稀釋成雜訊。依IC-first篩選方法論（本線第二輪起建立的紀律），無變數
          達顯著門檻，不進入昂貴的causal walk-forward驗證。
        do_not:
          - 不得因為`days_since_vixtwn_shock_t1`在Fold2早期窗口『看起來吻合』
            就認為這個方向本質上是對的、只是特徵設計不夠好——這正是本輪要避免
            的陷阱：單一fold/單一窗口的個案吻合，跟全樣本750天層級的統計顯著性
            是兩件不同的事，前者不能取代後者
          - 不得再對VIXTWN/TX自身衝擊特徵做進一步的參數微調（例如換
            trailing 5天、30天、不同百分位定義）——6個已測特徵涵蓋了trailing
            1/10/20天視窗×VIXTWN跳空/TX自身range兩種資料源×衝擊絕對值/
            trailing max/距離上次事件三種操作化，已是合理涵蓋的組合空間，
            IC全部不顯著代表這整個『用VIXTWN或TX自身歷史跳空幅度偵測衝擊
            事件』的角度本身站不住，不是某個特定參數選錯
          - 至此，這條研究線已測試3輪共13個PIT-safe regime變數（20天/
            120天trailing vol、VIXTWN水準/20天趨勢/單日跳空系列、外資OI z60、
            TX自身MA乖離率/趨勢強度/range shock），沒有一個能通過causal
            walk-forward讓多數fold轉正——累積證據強度已經足夠，不建議再對
            這個window=89 Donchian fade訊號測試第4輪regime變數；若要繼續
            這條研究線，該換訊號來源（呼應`tmf-post-channel-signal-sources`
            topic），不是再找一個新的regime分類器
      - id: H-TXFB-OPTION-E-SWING-STOP-MEDIAN-EXIT
        statement: >
          使用者要求重讀原始來源文章（Linear Regression Channel, forextraininggroup.com；
          Andrews Pitchfork, quantifiedstrategies.com）後，取材文章的兩個具體機制：
          (1) 擺動點停損（swing-based stop，停損設在造成反彈那根K棒的高/低點，動態
          跟隨市場結構，不是選項A的固定距離或選項B的ATR倍數）；(2) 通道中線出場
          （median-line exit，價格穿越通道中線就出場，LRC文章的真實案例顯示這有時
          比撐到對側通道更好）。這兩個機制能否在Donchian fade訊號上找到通過Phase 2
          粗篩的候選。
        status: rejected
        evidence: >
          Phase 1（`tx_flat_bracket_engine_optione.py`+
          `tx_flat_bracket_causal_optione.py`）83天×3組參數×2session×2window=996
          區塊批次vs因果equivalence 996/996 PASS（新索引陷阱：中線出場要用『這一根
          自己』的single-shift Upper/Lower，即批次版`dataset["Upper"].iat[i]`，不是
          事件偵測用的雙重shift`self.prev_upper`，兩者混用會對不上——已在實作時
          正確處理，等價性測試一次就過）。

          Phase 2（83天，window=89，swing_lookback∈{5,10,20,40}×swing_buffer∈
          {20,50,100,150}pt×target∈{400,800}pt×median_exit∈{True,False}，64組合）：
          **0/64組合總損益為正**，比選項A/B更快被拒絕（選項A/B在83天粗篩階段都還
          找得到方向一致的正報酬候選，這裡連粗篩都過不了，未進入Phase 5 walk-forward）。
          最好的組合（swing_buffer=150、target=800、無中線）也是-811.1pt。診斷發現：
          **swing_buffer越窄，stop出場佔比越高**（buffer=20pt時stop佔84.9%出場、
          buffer=150pt時降到只有3.5~28.8%），代表擺動點停損天生就設得太緊。

          **決定性的結構性發現**：`swing_lookback`（回看5/10/20/40根bar找擺動極值）
          對結果**完全沒有影響**——同一組buffer/target/median_exit組合下，4種
          lookback給出逐位元相同的total_pnl。根因：LRC文章的swing-based stop是設計
          給「等待第二次反彈確認後才進場」的交易風格用的（進場時價格已經從擺動點
          反彈一段距離，兩者是有意義的不同價位）；我們的Donchian fade訊號是「一
          突破就立刻進場淡出」，進場當下的價格本身就處於（或極接近）最近的擺動
          極值，所以不管往回看幾根bar，找到的都是同一個點（通常就是進場訊號bar
          自己）——這不是參數沒調好，是這個停損機制的前提（進場點與擺動點有意義地
          分離）在我們的進場風格下不成立。
        do_not:
          - 不得把0/64讀成「停損buffer或lookback沒調對」——lookback完全不影響結果
            這件事本身就證明了問題不在參數精度，是機制的前提假設（進場時機跟LRC
            原始設計的『反彈確認後進場』不同）不成立
          - 不建議把「等第二次反彈確認才進場」這個LRC原始進場邏輯，套用回我們的
            Donchian fade訊號重新設計一版——這已經不是「換停損機制」，是換一個
            全新的訊號產生層，等同於從頭開始一個新研究線，不是本假說範圍
          - 通道中線出場（median_exit）本身在64組合中沒有展現優勢（含中線的組合
            平均更差，最好的15名裡只有3個含中線，且都排在後段）——不是中線出場
            這個概念本身沒用，是它疊加在「已經因swing停損太緊而失敗」的部位管理
            上，難以獨立判斷其真實貢獻；若未來要重新測中線出場，應該疊加在選項A
            （已知固定停損距離合理）上，不是選項E的swing停損上
    do_not:
      - 在通過 design doc 第5節七項 kill criteria 之前，宣稱「找到edge」
        或往下單層方向推進——任一項未過只能記錄rejected並寫入do_not清單
      - 用「無停損」設定（選項D）當終局方案去驗證——那只是Phase 2的內部
        一致性檢查基準，用來確認新引擎沒有跟第十六輪已知結果矛盾的新bug
      - 對「拿掉某個出場機制會怎樣」的問題，用損益標籤加總代替真的重跑
        （H-RECOVERY歸因陷阱的教訓，design doc 2.5節）
      - 選項C（通道對側邊界當停損）排進第一輪驗證——這正是
        H-SC-SAR-CONVERTER／H-SC-WIDTH-PERCENTILE死掉的設計族群，留作
        選項A/B都被拒絕後的備案
      - 把第十二輪「bar級近似不影響本策略」的結論外推到新增的stop/target
        intrabar觸發判定——那個結論只驗證過進場決策（close觸發+next-open
        成交），出場端的intrabar觸價是全新問題，必須獨立做tick級複驗
    graduation:
      gates:
        G1_preregistered_hypothesis: passed  # 本條目就是G1——設計研究(design doc)先於任何實作/跑數完成並登錄，修正tx-donchian-multiwindow-channel線"先跑完10+輪才回頭補登記"的錯誤
        G2_oos_holdout: failed  # Phase 5 750天5-fold walk-forward：選項A/B都觸發kill criterion 5（fold正負號翻轉），OOS總損益全部候選皆負
        G3_regime_stratification: passed  # 有做時間分fold（近似regime分層）+ day/night拆開報告，正確揭露了「僅Fold3/Fold5訊號有效」的regime依賴，即使結論是rejected也算通過（有誠實分層報告）
        G4_rejection_registry: passed  # H-TXFB-OPTION-A-FIXED-BRACKET-EDGE、H-TXFB-OPTION-B-ATR-BRACKET-EDGE均已記錄rejected+do_not
        G5_frozen_spec: na  # 沒有東西可凍結，選項A/B皆已拒絕
        G6_adoption_report: na
    notes: >
      2026-08-07：使用者要求「請告訴我應該從哪裡開始繼續」後，授權自主推進
      三件並行工作：(1) 建582天tick衍生1分K資料集（scripts/research/
      tx_channel_build_582d_dataset.py，寫入bars.sqlite新source
      'tx_1m_tick_built_582d'，實際涵蓋750天2023-07-03~2026-08-06，對照
      既有83天快取交叉驗證OHLC均絕對誤差0.81pt）；(2) 收斂canonical回測
      引擎並釘死規格（scripts/research/tx_channel_canonical_engine.py，
      session尾強制平倉+次根開盤成交+5.9pt成本，4項回歸測試全部獨立重跑
      確認PASS）；(3) 本假說群組——flat-default+停損bracket重構的完整
      設計研究。

      同日稍後使用者要求「試試把研究救回來」，據此執行design doc的
      Phase 1/2/5：Phase 1建causal on_bar()版+對帳測試，debug出兩個同根
      bar邊界的因果版特有bug（事件消費要用本根開始前的state snapshot、
      最後一根bar要clamp同根成交），修完後83天×3參數×996區塊批次vs因果
      100% bit-for-bit equivalence，H-TXFB-FLAT-DEFAULT-BREAKS-PATH-DEPENDENCE
      轉passed。Phase 2粗篩＋Phase 5的750天5-fold walk-forward（含rolling-IS
      控制排除價格regime混淆）顯示Option A固定點數bracket沒有跨樣本穩健
      edge——僅一個fold（剛好是Phase2用來篩選的83天樣本所在區間）正報酬，
      新增H-TXFB-OPTION-A-FIXED-BRACKET-EDGE記為rejected。

      使用者再指示「繼續」，接著做design doc選項B（ATR倍數停損，k網格改用
      83天樣本ATR實測分布校準，design doc建議值{0.75,1.0,1.5,2.0}明顯是
      假設不同ATR量級才合理，未校準直接套用）。Phase 1（causal版debug出
      選項A沒有的新bug：entry_atr索引要用『成交那一根自己』算出的ATR，
      不能沿用前一根的值，修法是把ATR更新移到on_bar最前面）修完後同樣
      996/996 bit-for-bit equivalence。Phase 2 83天粗篩找到方向一致、略優
      於選項A的候選（w89/k_stop20/ratio1.5：+7,125.2pt、t≈1.47）。但
      Phase 5 750天walk-forward顯示**選項B跟選項A是同一個fold pattern
      失敗**——只有Fold3(2025-02~2025-08)、Fold5(2026-01~2026-08)正報酬，
      day/night分項損益數字在選項A/B之間高度接近（例如Fold1 day pnl兩邊
      都在-2,100~-2,700pt這個窄範圍），kill criterion 5同樣觸發，OOS總
      損益三候選皆負。新增H-TXFB-OPTION-B-ATR-BRACKET-EDGE記為rejected。

      **本輪最終結論**：選項A（固定點數）、選項B（ATR倍數，理論上該解決
      前者的regime-scale問題）在同一組fold上以幾乎相同的方式失敗——因為
      兩者共用同一套訊號產生層（window=89 Donchian突破+ATR濾網+cooldown），
      只有停損機制不同，卻在750天樣本上表現一致地差，代表問題出在**訊號
      本身**（這個Donchian fade訊號在2024全年~2025年H2這段區間沒有edge，
      只在2025 H1與2026 H1兩段窗口有效），不是停損設計的選擇。選項C
      （通道對側邊界當停損）design doc已預先排除（H-SC-SAR-CONVERTER/
      H-SC-WIDTH-PERCENTILE死在同一設計族群），換停損幾何無助於解決訊號
      層的regime不穩定。至此flat-default+bracket對這個特定Donchian fade
      訊號的「救回」嘗試已窮盡design doc規劃的兩個可行方向，皆rejected；
      若要繼續，需要的是不同的訊號來源，不是換一種停損/停利設計——這跟
      `tmf-slow-pattern-cell`線窮盡ZigZag+通道框架後的結論（改找全新訊號
      機制）是同一個模式。

  umc-branch-overnight-decision:
    title: 聯電(2303) 分點訊號 → 夜盤隔夜決策 · 全線否定歸檔
    status: closed
    phase: rejected
    split_spec: default_is_oos
    run_scripts:
      - scripts/research/umc_branch_overnight_signal_sweep.py
      - scripts/research/umc_branch_market_calibrated_sweep.py
      - scripts/research/branch_overnight_crosssection_sweep.py
      - scripts/research/branch_netdisp_multihorizon_validation.py
      - scripts/research/umc_night_forward_recorder.py
    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-UMC-BRANCH-OVERNIGHT
        statement: >
          分點單日大額淨買（固定 2 億或自身 z-score 自適應門檻）可預測聯電隔夜跳空
        status: rejected
      - id: H2-UMC-ADAPTIVE-SELECTION
        statement: >
          自適應門檻能事前挑出「有 edge 的分點」
        status: rejected
      - id: H3-UMC-SIGNAL-SWEEP
        statement: >
          32 支分點衍生訊號中，至少一支對隔夜跳空有可驗證增量
        status: rejected
      - id: H4-UMC-CROSSSECTION
        statement: >
          橫斷面設計（同日多空對沖）能讓分點訊號的幅度超過交易成本
        status: rejected
      - id: H5-NETDISP-MULTIHORIZON
        statement: >
          net_disp 在某個持有天期上訊號幅度會超過成本
        status: rejected
      - id: H6-MOMENTUM-DECISION-RULE
        statement: >
          三因子動能規則（當日漲跌 + 台指夜盤 + NQ 隔夜）構成可用的每日多空決策
        status: rejected
    methodology: >
      決策時點 16:45（實測 FinMind TaiwanStockTradingDailyReport 於 T 日 16:25 發布：
      一次性探測 15:00 起每 5 分鐘打，16:20 尚無、16:25 found）。
      六種設計依序檢驗：單股時序 → 自適應門檻 → 三層校正（大盤／台指期／全市場火力）
      → 橫斷面（35 檔個股期）→ 多天期 H1~H20 → 三態決策策略。
      統計協議：訓練/測試切分、Newey-West t（重疊持有期）、BH-FDR 多重檢定校正、
      去極值敏感度、非重疊子樣本、block bootstrap、走動式重配門檻。
    notes: >
      【結論】全部否定。敗因一致：分點聚合訊號在隔夜天期的幅度（0.1~0.3%）與交易成本
      （個股期來回 2 tick，股價<100 元 0.21%、>=100 元 0.94%）同一數量級。
      對照 repo 既有唯一通過決定性驗證的 9217（H7 天期、mean +5.66% / median +6.28% /
      permutation p<0.0001）—— 幅度差兩個數量級。可轉移的教訓：分點資料要成為 edge，
      必須是「特定分點的稀有重押事件」，不能是「全市場聚合的橫斷面因子」。

      【H6 的決定性否證 · 跨股票驗證】三因子動能規則在 2303 上呈現「前半年負、後半年正」，
      原本無法判斷是規則問題還是市場狀態。將同一規則套到 35 檔高流動性個股期
      （10,418 個觀測、3,977 次出手，成本 0.81%），以 2026-03-01 切半：
      H1 為正 3/35（中位 −33.49%）、H2 為正 32/35（中位 +40.67%）、兩期同號僅 6/35。
      逐月看 2025-05~2025-12 連續 8 個月為負，2026-05 起連續 4 個月為正且 32~34/35 檔
      同時轉正。2303 自身（H1 −34.08% / H2 +59.42%）與全體中位數幾乎重合、完全不特別。
      35 檔同時同月翻號不可能是 35 個獨立股票特性，只能是共同的市場狀態變數在切換，
      而規則不含任何能偵測該切換的成分。因此判 rejected 而非 inconclusive ——
      這不是樣本不足，是證據充分且為否定。要復活必須先解決「事前辨識狀態切換」這個
      新的、更難的問題，不屬本主題延伸。

      【方法論陷阱記錄】(a) 公告前後對照的切點若用 18:00 會把 16:25-18:00 這 95 分鐘的
      公告後時間算進「公告前」，導致誤判「公告無資訊」——正確切點是 16:25。
      (b) 目標獲利出場全面劣於不設目標（勝率上升但期望值下降，因報酬靠尾部）；
      且用日 OHLC 判斷觸價有同棒樂觀偏誤。
      (c) 早期回測用 2303 現股代理 CCF，失真點正好在 16:45 進場與 08:45 出場兩點上；
      這兩個時點事後補不回來（FinMind tick 只有日盤、daily 只有整場 OHLC），
      故保留 umc-night-forward-recorder 前推累積正確標的資料，供未來任何夜盤假說使用。

