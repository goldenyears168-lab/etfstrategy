      - scripts/research/run_dayflip_forward_test.py
    frozen_at: 2026-08-07
    hypotheses:
      - id: H-DFS-1
        statement: >
          隔日沖傾向分點於 T0 大額買進（>=0.3億）後，若該股個股期貨於 T+1 08:45
          相對 T0 期貨收盤跳空 >=6%，則放空該期貨、掛 −2% 限價回補
          （未觸價則 13:45 平倉），在「排除建倉中席位（60日 net_ratio>=0.3）
          且至少 1 席 PIT flip>=0.4」的條件下，日層級中位報酬 > 0 且日勝率 >= 70%。
        status: proposed
        adoptable_status: proposed
        evidence: >
          IS 2024-07~2026-07-08：62 訊號日 / 165 筆 / 日均 +0.999% / 日中位 +1.95%
          / 日勝率 80.6% / t=5.03。PIT 版（席位沖分用擴張窗）為 55 天 / 日均 +0.969%
          / t=4.67。成本 5bps。
      - id: H-DFS-2
        statement: >
          個股腿本身（不含指數對沖腿）在加入「盤中 −2% 限價回補」後即可獨立成立。
        status: passed
        evidence: >
          目標2%：事件中位 +1.95%、日中位 +1.807%、日勝率 80.4%、t=4.92；
          對照收盤平倉的個股腿中位為 −0.00%。IS 勝率 80.0% vs OOS 80.4%。
      - id: H-DFS-3
        statement: 席位的隔日沖傾向可作為訊號信心權重
        status: passed
        evidence: >
          24 席 flip 中位 vs 策略平均報酬 Pearson 0.509、vs 勝率 0.604（n=19 席）。
          「至少 1 席 PIT flip>=0.4」勝過「席數>=3」（55 天 vs 51 天、t 4.67 vs 4.14）。
      - id: H-DFS-4
        statement: 排除建倉中的席位可提高剩餘席位的隔日沖純度並改善績效
        status: passed
        evidence: >
          留下席位平均 flip 0.362→0.376；疊加後席數>=3 的日均 0.912→1.082、
          勝率 80.8→84.1、t 4.19→5.13。系統性偵測獨立命中使用者手工指定的
          9217×6147（net_ratio 0.939）與 9217×2337（買進 60.66 億）。
