    notes: >
      2026-08-11 補登記，來源 docs/tmf-channel-research-handoff-20260811.md §3
      （拒絕清單）＋§2（方法論教訓）＋§5（新發現的獨立問題）。
      **本條目在 2026-08-11 一天之內被改判三次**：
      rejected（原登記）→ paused（同日發現 cache_store 缺陷 A/B，數字依據失效）
      → **rejected（38 支全部重跑完畢，拒絕結論以有效證據重建）**。
      這個來回本身就是本輪最大的教訓：**「數字失效」不等於「結論錯誤」，
      也不等於「結論正確」——只有重跑能分辨**。本次重跑的結果是：
      12 條原候選全部維持拒絕，但其中 5 條的**理由**被換掉了。

      本輪五個結構性教訓：
      (1) **資料品質先於統計**——同一輪連續三次示範：NQ 小時K forming-bar
      （缺陷 0）讓多數候選從「看起來顯著」變成不顯著甚至翻負；cache_store 的
      bar 時序（缺陷 A）讓**整個 IS 窗變號**（+1712→−1659，100% 交易日改變）；
      而重跑後又發現**連續 NQ 閘門的全部優勢都是缺陷 0 的洩漏**。
      跑統計之前先確認：棒收完了嗎？順序對嗎？日期歸屬對嗎？**視窗裡真的有
      樣本嗎？**（第四問來自新缺陷 1）
      (2) **max_lots=1 的排擠效應**——高頻 regime 解封後會佔住唯一倉位額度、
      排擠罕見但個別更好的 cell 機會，所以出現頻率越高的 regime，採納門檻要設
      得越高。**本輪重跑後這條從「機制假說」回升為有實證錨點的論述，但錨點換人**：
      原錨點 night|normal 失效（IS/OOS 方向相反），新錨點 day|expand_up
      （standalone +150~194 vs portfolio 9 格全負）。
      (3) **第三窗獨立驗證是真正的過濾器**——本輪 night|expand_dn 與 always_lo
      都是這樣被擋下的，而且重跑後**更明確**：expand_dn 三窗從「方向不一致」變成
      「一致為負」，always_lo 三窗 bit-exact 不變（−11.48）。
      額外收穫：那三個 holdout 快取**沒有午夜後 bar**，所以它們是本 repo 目前
      **唯一不受缺陷 A/B 影響的地面**——未來設計乾淨實驗應優先用它們。
      (4) **「資料髒了」的第一嫌疑犯是消費端，不是資料本身**——handoff §5a 報的
      「快取夜盤尾段差近千點」經全量稽核證實是假陽性（快取 bit-exact）；真正的
      缺陷都在消費端（`cache_store.load_day()` 的字典序排序 + session-date 時間戳、
      `price_at_or_before` 沒等棒收完）。
      (5) **「腳本印 ADOPT」不是採納，「p<0.05」不是採納**——本輪兩個新教材：
      day|expand_up 的 ADOPT 只是 label flip（規則裡沒有 p 值、IS 正值全來自
      單一天）；day|expand_dn 的 IS p=0.042 效應量只有 +0.73 pt/日
      （統計顯著 ≠ 經濟顯著）。
      另註：forming-bar 修復（`price_at_or_before` 的 `min_age` 參數）現已可用
      commit 7aeb393 辨識；cache_store 缺陷 A/B 的修復是 commit 6128480。

  tmf-exit-mechanism-search:
    title: TMF 微型台指 · 新平倉/風控機制搜索（加速度停損 · NQ信心出場 · 跨市場脫鉤防禦性出場）
    status: active  # 2026-08-12 開線：使用者提出「跌價時能否有其他偵測平倉辦法」
      # （秒級加速度止損／台指NQ脫鉤止損／NQ領先台指提前平倉），三軌並行研究
    phase: hypothesis
    layer: research
    report_dir: reports/research/channel_lab
    context: >
      現行下單層平倉機制盤點（causal_engine.py）：`stop`（固定點數距離）、
      `trail`（移動停利回吐）、`struct_break`（結構性擺盪突破）、`max_hold`
      （純時間）、`opp_cover`（反向訊號）——全部是價位/時間邏輯，沒有速度/
      加速度概念。`classify_pv`（rvol≥2.50=climax過熱）與`thermo_tilt`/
      `short_temp`（30分技術面-2~+2過熱分數）皆已存在，但**只用來擋新進場，
      完全不接進既有部位的平倉判斷**——這是本輪確認的真實空白。另確認
      `trip_day_pnl_kill`對真倉完全關閉（0806 sim/券商PnL分歧後刻意關掉，
      已知取捨非本輪範圍）。三個候選機制皆沿用同一套研究誠信規範
      （docs/research-integrity-checklist.md）、皆為read-only研究
      （不動src/order/、src/tmf_channel/、config/order.yaml、
      config/strategy.yaml）。
    hypotheses:
      - id: H-NQ-CONF-EXIT-ISOLATED
        statement: >
          `causal_engine.py`既有但從未上線的`nq_conf_exit_enable`機制
          （NQ與持倉方向不一致時收緊max_hold/trail，一致則放寬）——與
          任何其他功能（BIAS/EARLY/t30/nq_conf_enable進場版）完全解耦、
          單獨測試——優於現行不開此機制的基準。
        status: rejected  # 2026-08-12 首次乾淨解耦測試，2位獨立審查者確認
        evidence: >
          唯一舊產物`r_nq_conf_early_exit_bakeoff.json`（2026-08-06，早於
          全部4個資料缺陷修復、且綁著BIAS/EARLY/t30，從未真正解耦）已知
          過期不可引用。本輪從零建立乾淨解耦版本（symmetric／against_only
          兩種exit_mode，皆用現行live cell book + 連續NQ閘門，唯一變數是
          此開關），三個defect-immune holdout窗+w83：

          `against_only`（最接近使用者「NQ轉向就提早出場」原意）：五個
          窗口全部不顯著、幅度都在個位數pt/day（相對基準淨值百到千pt級
          幾乎無感），合併真獨立OOS mean=−0.71pt/day, p=0.44。推測現有
          entry端的硬閘門已經吃掉大部分「跟NQ同向」的價值，出場端再收緊
          空間有限。

          `symmetric`：julsep25出現唯一一個HAC全maxlags顯著的窗口
          （mean=−5.20pt/day），但**方向在其餘兩個holdout窗口不一致**
          （octdec25不顯著、janmar26轉正），合併OOS不顯著（p=0.35）。
          BUG-7拆解證實julsep25那筆虧損是**真實機制成本**（收緊trail/
          max_hold讓部分本來會走到有利出場的交易被提前腰斬：max_hold
          −293pt、trail −295pt，struct_break本身其實還小幅改善+215pt），
          不是強制平倉或帳務假象。
        recommended_action: 不建議在live PAPER_RECIPE開啟nq_conf_exit_enable。
      - id: H-VEL-ACCEL-STOP
        statement: >
          新增一個tick級速度/加速度停損（現行引擎完全沒有此軸線，僅有
          價位距離型的stop/trail/struct_break），疊加在現行exit_mode之上，
          能提升績效。
        status: rejected  # 2026-08-12 首測，2位獨立審查者確認——非模糊、是乾淨負向
        evidence: >
          在w83（統計力道最強、3044筆交易）上，新觸發器在掃過的三個門檻
          （含最保守的K=5.0，僅2.3%交易被提前觸發）**全部HAC穩健顯著為負**
          ——不是雜訊、是真實破壞價值。三個defect-immune holdout窗口
          （合併OOS n=182）效果統計上與零無法區分，且方向連同一組門檻掃描
          都不穩定——是典型的「無效應」訊號特徵，不是「小效應被樣本蓋住」。
          BUG-7發現低門檻時觸發率可達~56%的未平倉交易，暗示這個sigma-based
          設計本質上就是一個過度敏感、跟現有出場機制高度重疊的濾網，不是
          抓到什麼結構破壞抓不到的東西。
        recommended_action: 不建議繼續投入這個具體設計；若未來要重探
          速度型出場，第一步應先解決「觸發率過高」這個根本問題，不是調整
          既有sigma門檻。
      - id: H-TXNQ-DECOUPLE-DEFENSIVE-EXIT
        statement: >
          （**本輪唯一有正面訊號、值得繼續的候選** · 2026-08-12新登記，
          尚未過G1/G2完整流程，僅exploratory/post-hoc，需要補做正式
          pre-registration）
          持倉中若TX與NQ的偏離價差（沿用`nq_1m_spread_gate.py`的
          `tw_dev`/`us_dev`計算）出現對持倉不利方向的異常擴大，視為
          風險訊號提早平倉——跟entry端那條已經測到快死的均值回歸閘門
          （`tmf-tw-us-ma5h-deviation-spread`）是同一個底層訊號，但換了
          防禦性用法（偵測異常≠預測方向），優於現行基準。
        status: pending  # 兩種資料解析度結果分歧：proxy版本(hourly-ffill)
          # 顯著為正且4窗同向；真正live解析度版本(1分K)樣本太薄不可信
        evidence: >
          Overlay設計（不fork引擎）：baseline交易來自未修改的
          `causal_engine.simulate()`（live smart cell book, struct_disabled
          =False），逐bar走訪原始交易的entry→exit區間，價差觸發對持倉不利
          方向且超過門檻時，用當下價格提早平倉取代原出場——struct_break/
          trail/max_hold/opp_cover等其餘機制完全不動。

          **Variant B（hourly-ffill NQ，較粗糙的proxy版本）**：四個
          defect-immune獨立窗口（julsep25/octdec25/janmar26+w83，
          threshold=0.15）**方向全部為正**、其中3/4窗口（julsep25/janmar26/
          w83）各自HAC全maxlags顯著；合併n=243天 mean=+38.44pt/day,
          naive p=0.0001, HAC全maxlags<0.05——**穩健顯著為正**，且效果
          隨threshold從0.15→0.30單調遞減（符合「門檻越嚴、觸發越少越極端」
          的直覺，不是雜訊拼出來的巧合）。BUG-7逐筆拆解：淨收益主因是
          「搶救」原本會被struct_break（本研究線頭號失血源）洗掉的交易
          （413筆，−57.41→−10.10 pt/筆，貢獻62%淨收益），但同時也提早
          砍掉部分原本會走到有利出場的opp_cover交易（101筆，−110.69pt/筆）
          與max_hold交易（157筆，−22.66pt/筆）——是真實的risk/reward
          取捨，不是白撿的價值。BUG-2擾動測試通過（無look-ahead）。

          **Variant A（真正的1分K，也就是實際live在跑的解析度）**：
          可用真實1分NQ重疊的天數只有6天名義、實質約4天有效（另2天
          結構性delta=0，跟本研究線已知的lookback_days零稀釋陷阱同一種
          病），threshold=0.15勉強p=0.048（n=6，不能當真），threshold=0.30
          時**方向直接翻負**——跨threshold不穩定，是雜訊訊號，不是證據。
          **這代表本假說的核心（用真正1分K偵測脫鉤）目前完全無法獨立確認**，
          proxy版本的正面結果只能當「值得繼續」的訊號，不能當「已驗證」。
        next_experiment: >
          (1) `scripts/research/nq_es_1m_daily_accumulate.py`目前沒有排程
          job，只能靠手動跑累積真實1分K重疊史——若要讓variant A的樣本量
          增加到可信程度，需要排程常態化執行（純研究資料累積，不涉及
          src/order/或下單邏輯，但新增launchd job仍需使用者明確同意）；
          (2) 在research.yaml正式G1 pre-registration本假說的觸發定義與
          門檻網格（本輪是探索性/post-hoc，按A13標準需要補做）；
          (3) tick級成交價驗證（比照struct_break在handoff §5e做過的逐tick
          重放），確認bar收盤價的counterfactual提前出場價格站得住腳；
          (4) 若要繼續，判準應鎖定variant A（真實解析度）獨立達到跟variant
          B同等級的穩健顯著，不能用variant B的結果替代。
        recommended_action: 不建議現在改動任何live程式碼或設定。維持pending，
          待真實1分K樣本量足夠後才有資格重新評估。
