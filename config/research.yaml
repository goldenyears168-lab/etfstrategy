        statement: 法人淨流與華新科同日盤中價格發現呈中高度正相關
        status: supported  # FT vs intraday Spearman=0.523；close-to-close β超額=0.481
      - id: H-PI2
        statement: 法人淨流可不分環境直接預測華新科 T+1／T+5 方向
