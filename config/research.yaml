          技術上通過（0 same-bar、0 adjacent-1-bar）。**3/3 獨立審查者判定
          claim_survives=false，且找到具體、可重現的數字**：
          (1) 決定性發現——進出場成交價不是誠實的 next_open：程式碼會在
          「實際下一根開盤價」與「訊號當根觸及的邊緣/中線/停損價」兩者間，
          單方向取對交易方更有利的那個（clamp）。此 clamp 貢獻 128,786.5pt，
          占宣稱淨利 146,312.7pt 的 **88%**。審查者拿掉 clamp、改用誠實
          next_open 重新模擬後：淨利崩到 11,022.0pt（跌 92.5%）、
          avg pts/筆從 14.7 掉到 1.11、勝率掉到 **44.14%（低於銅板）**，
          停損出場單獨看 avg −17.5pt（n=5,082，勝率 23.5%）。
          (2) 另一位審查者發現 leg_end 強制平倉（13.8% 交易）是用「這條腿自己
          的未來終點價格」在 mark——跟作者已自陳的「中心線本身用了未來已確認
          的 pivot」是同一種 look-ahead，但作者設計的敏感度過濾（排除腿起點
