    methodology: >
      L1H7 協議（SSOT：scripts/research/build_expert_pool_trade_knowledge.py）：
      進場＝訊號日次一交易日開盤；出場＝進場起算第7個交易日收盤；成本30bps；
      r_adj = r_股 − 1.15×r_IX0001（IX0001 同樣用 L1H7 對齊日期算，非曆日相減）。
      全分點宇宙主表：對 2024-07-01 起、排除 mega(ab58_xMega_copytrade/
      mega_blacklist_v1.json)+ETF("00"開頭) 的每個 (trade_date, stock_id)，
      用 SQL window function（非 Python groupby，220M 列全表 pandas groupby
      會逾時）取 Top1 買方（金額≥500萬），同分點同股5日內去重。165 個 n≥10
      的分點做單樣本 t-test，並用 Benjamini-Hochberg FDR（5%）做多重比較
      校正（同時測 165 個分點，不校正會有大量假陽性）。分點層級判斷至少要
      交叉驗證 t-test + Wilcoxon signed-rank + bootstrap CI 三種方法，任一
      不支持就不算穩健正向（教訓來自 779Z：t-test p=0.051 但 Wilcoxon
      p=0.146、median bootstrap CI 含0，判 inconclusive 而非 worth_tracking）。
    notes: >
      資料背景：2026-07-27 使用者完成分點資料兩年期回補，覆蓋率從 2024-07~
      2026-04 期間的 ~266~268 家分點大幅提升到 ~831 家（2026-05起~930~1010
      家），資料量從 8600萬列增至 2.2億列。**這份新資料只在 mini 上，Book
      本地複本是舊的**，此後任何分點層級研究都必須 SSH mac-mini-lan 執行，
      不能用 Book 本地 DEFAULT_DB_PATH。已於 2026-07-27 在
      stock_broker_branch_daily 加兩個索引：
      (securities_trader_id, trade_date) 與 (stock_id, trade_date)
      （原本只有 PK 索引、trade_date 開頭，單分點或單股全市場查詢等同全表
      掃描，實測曾讓深挖腳本卡 90 分鐘以上；加索引後降到秒級）。

      全分點宇宙掃描結果：110,298 筆原始 Top1 買方事件（697分點×475股票）→
      去重後 59,065 筆 → 165 個分點 n≥10 可測 → BH-FDR(5%) 顯著 11 個，
      **全部負向、無一正向**（980T mean正但median≈0，屬已知造市帳戶）。

      候選結論：
      - **9217（凱基松山，現行 live）**：唯一持續驗證為正的既有候選，n=25，
        median+5.90%/勝率64.0%，p=0.126未達BH-FDR但方向乾淨（median>mean）。
      - **9239（凱基-市政）**：p=0.070 統計面一度是165個分點裡最接近顯著者，
