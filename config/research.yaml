  tmf-crossmarket-signal-explore:
    title: TMF 通道 · 跨市場訊號探索（divergence-as-signal · regime-sync-as-signal）
    status: rejected
    phase: oos_holdout
    layer: research
    report_dir: reports/research/channel_lab
    run_scripts:
      - reports/research/channel_lab/divergence_signal_design_lab.py
      - reports/research/channel_lab/divergence_verify_fold1_lab.py
      - reports/research/channel_lab/divergence_verify_fold2_lab.py
      - reports/research/channel_lab/divergence_verify_fold3_lab.py
      - reports/research/channel_lab/regime_sync_signal_design_lab.py
      - reports/research/channel_lab/regime_sync_verify_fold1_lab.py
      - reports/research/channel_lab/regime_sync_verify_fold2_lab.py
      - reports/research/channel_lab/regime_sync_verify_fold3_lab.py
    hypotheses:
      - id: H-XMKT-DIVERGENCE
        statement: >
          NQ 與 Nikkei225 兩指數方向分歧（causal 24h trailing return，disagree/
          high_mag 判定），可以當成 TX 特有資訊的訊號，用來過濾／強化既有 8 分類
          通道機制的交易品質。
        status: rejected
        evidence: >
          2026-08-05：design（IS+peek，166 obs）疊加在 jack_channel_v6_pv V11
          baseline 交易上完全無分離（high_mag/disagree 均略差於 all，非優於）。
          三折 held-out 覆核（frozen 門檻 0.00929，未在任何一折重新計算）：
          fold1／fold2／fold3 皆無可用分離，唯一稍有意思的「分歧→續勢」子指標
          在 fold2 幾乎消失（相關差距 0.27→0.02）、fold3 move-size 方向直接反轉。
          結論與既有 us-tw-overnight-research.md 的零時差發現一致：兩個本來就
          高度連動的指數，分歧本身不會產生新的台股特有資訊。
      - id: H-XMKT-REGIME-SYNC
        statement: >
          用 TX 夜盤報酬與 NQ 同窗報酬的滾動15日因果相關係數，區分「同步」vs
          「不同步」市場狀態，可用來調整通道行為（寬度／是否交易），而非直接
          預測方向。
        status: rejected
        evidence: >
          2026-08-05：frozen 門檻（corr≥0.30=sync）在 IS+peek／fold1／fold2
          三個獨立窗口全部退化——0/68、0/40、0/47 天低於門檻，fold3 僅
          3/50天，樣本太薄。**核心前提不成立**：過去約一年資料裡，TX 與 NQ
          的連動性從未真正脫鉤過（滾動相關中位數0.77-0.84，最低觀測0.24僅見於
          fold3單一稀薄尾端）。退而求其次的中位數切分（非預先凍結門檻）在
          design 顯示 sync>desync（勝率54%v51%、均利29.1v24.1），但 fold2／
          fold3 直接反轉；且每個窗口的 sync 桶勝天率都落在92-93%，重複踩中
          今天稍早發現的同根成交灌水紅旗（house rule #8），效應本身可能是
          bar-based 同根成交假象而非真實 regime 效果。
    do_not:
      - 拿 design 階段（IS+peek）單一窗口的「看起來有意思」數字當結論——本主題
        兩個假說都示範了同一件事：不經過至少3個獨立held-out窗口覆核，design
        階段的任何子指標都可能是雜訊
      - 用中位數切分取代預先凍結的門檻，然後把切分出來的差異當發現——regime-sync
        假說的中位數切分不是預先承諾的門檻，是看過資料分佈才選的，本身就不該
        被當驗證，只能當描述性參考（兩個 design agent 都有意識到這點並如實標註）
      - 忽略同一份 backtest 引擎（simulate() 預設同根成交邏輯）帶來的系統性
        灌水風險——本主題兩次獨立測試都在同一個桶內看到 90%+ 勝天率，跟今天
        稍早 C[t] bug 的紅旗同款
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: failed  # 兩個假說皆在3折獨立held-out驗證中失敗（非
          # pending——這次是真正走完完整流程後的明確負面結果，不是資料不足）
        G3_regime_stratification: na
        G4_rejection_registry: passed
        G5_frozen_spec: na
        G6_adoption_report: na
    notes: >
      2026-08-05：Workflow round 1（8 agents，design×2 + verify×6，跨 IS+peek
      +fold1+fold2+fold3 共4個獨立窗口）。動機：在確認機械化通道機制（8分類、
      confirm/diverge細分、causal anchor修正、coil-and-break動能版）皆無法在
      真實tick資料上找到穩定edge後，探索跨市場資料（日經/NQ/VIXTWN）能否提供
      獨立於價量本身的訊號。已知的「追隔夜方向」假說（us-tw-overnight-research.md）
      早已被排除（zero-lag、Sharpe-0.04~-0.52）；本輪測的是fork-in-the-road上
      兩個真正沒被測過的角度（分歧當訊號、同步狀態當條件特徵），結果皆為明確
      拒絕，且是經過design+3折held-out的完整流程，不是單輪臆測。
      TSMC ADR 資料本地不存在，divergence 假說退而用 NQ vs Nikkei。
      跨市場資料causal對齊規格見 crossmarket_data_causal_spec.md（同日產出，
      含美股RTH落在TX夜盤時段內、需用連續期貨而非現貨收盤價、日光節約時間
      每年造成兩次時差跳動等關鍵風險，皆已在本輪正確處理，未重蹈C[t] bug）。

  tmf-post-channel-signal-sources:
    title: TMF 跳出通道框架 — 全新訊號來源探索
    status: active  # 2026-08-07 開線；tmf-slow-pattern-cell(ZigZag+通道)與tx-donchian-multiwindow-channel(Donchian/LRC)兩個通道框架皆已窮盡rejected後，改找完全不同的訊號來源
    phase: hypothesis
    layer: research
    report_dir: reports/research/tmf_newsignal
    run_scripts:
      - reports/research/tmf_newsignal/foreign_oi_z60_next_day_direction.py
      - reports/research/tmf_newsignal/day_close_to_night_session_effect.py
      - scripts/research/tmf_newsignal/study_night_vixtwn_dayahead.py
      - reports/research/tmf_newsignal/build_orderflow_panel.py
      - reports/research/tmf_newsignal/orderflow_ic_backtest.py
    hypotheses:
      - id: H-NS-FOREIGN-OI-GATE
        statement: >
          前一交易日收盤後可得的外資期貨未平倉部位60日z-score
          （fut_foreign_oi_z60，champion因子），能不能當方向性條件，
          預測隔日台指(TX/TMF)日盤(08:45-13:45)open-to-close走勢方向。
        status: rejected  # 2/2審查通過；5摺IC僅3/5同號、HAC全不顯著、shuffle placebo證實與隨機無異
        evidence: >
          先查證這是全新測試、非重複造輪子：fut_foreign_oi_z60 既有主線
          出處是 reports/research/chip-macro/RESEARCH_LOG.md（面板
          2018-06~2026-07，1,986天），既有應用是**多日持有型 L/F 擇時
          overlay**（標的 TAIEX 現貨、h=10/20 最強、OOS Sharpe+1.12但
          DSR 0.68 未過 0.95 門檻），h=1 單日 IC_OOS=+0.070 有記錄但從未
          針對 TX/TMF 期貨、484 天近 2 年 cache、完整誠實回測+HAC 顯著性
          跑過。確認 fut_foreign_oi_z60 是 EOD 收盤後才公布（一天一筆，
          盤中/夜盤看不到），符合「前一日收盤後已知」的條件設定。

          484 天（2023-07-03~2025-06-30）：causal PIT merge_asof
          (direction=backward, allow_exact_matches=False) 取得 D 日開盤前
          已知的 z60，沿用既有 champion 的 >0/<0 sign 規則（**未在本樣本
          上做任何參數搜尋**，避免過擬合），next_open literal 進場、
          day-session literal close 出場，COST=2.0pt/round-trip。

          **5摺 causal Spearman IC**：3/5 同號（未過 4/5 門檻），full-
          sample rho=+0.0062（p=0.89，近乎零）。**回測**：n_signals=
          n_fills=n_closed=484（記帳恆等式成立），名目 mean net pts/trade
          =+5.37（sum+2,601pt，勝率48.6%）但 std=166.7 遠大於均值。
          **顯著性**：naive t p=0.478，Newey-West HAC（maxlags 1/5/10）
          p=0.479/0.414/0.375，全不顯著。**shuffle placebo**（1000次隨機
          打亂配對）：observed mean net_pts 的經驗 p=0.476、observed IC
          的經驗 p=0.902——效果與隨機噴出的分布幾乎重疊。同日
          contemporaneous（非因果，模擬誤用未來資訊）leakage 自檢
          rho=0.096(p=0.034) 仍很弱，證實不是 PIT bug 造成假陰性，是這個
          特徵在單日 horizon 上本來就沒有資訊量。

          2/2 審查通過（claim_survives=true）：獨立重跑腳本數字逐位元
          相同，手動抽查 PIT（2023-06-30 z60=-1.6845 手算吻合）、
          target cache 首末 bar 核對無誤，HAC 用獨立 Bartlett-kernel 公式
          交叉驗證一致，shuffle placebo 用 5 個不同種子重跑 p 值穩定在
          0.469~0.481／0.887~0.899，非挑種子取巧。
        do_not:
          - 把「champion 因子本身無效」讀成這輪的結論——champion 的 edge
            集中在多日持有、regime 條件化用法（即使那個用法的 DSR 也未過
            0.95 門檻），本輪只否證了「同一個特徵套用到單日台指期方向」
            這個不同的具體應用；兩者是獨立的統計宣稱
          - 引用「mean net pts/trade=+5.37、sum+2,601pt」這個名目正數當
            證據——這正是被 HAC 不顯著＋shuffle placebo 判定為與雜訊無異
