          尤其 2024-08 佔 385 筆）而先天不足 5 摺，未達嚴格門檻。唯一
          邊緣通過的 mins_since_open（4/5）被自己主動追查揭穿：剔除
          session_end 出場交易後同號摺數掉回 3/5，且這批僅佔 6.45% 筆數
          的 session_end 交易扛住了全部正報酬（+12,096pt vs 其餘 1886
          筆合計 −16,919pt）——sizing 收割測試也證實這個訊號不可收割
          （OOS 總損益從 −2,684pt 惡化到 −3,816pt，僅 1/5 摺改善），
          正確判定不建議採用。confirmed_by_other 類比全樣本 Welch
          t-test p=0.687、point-biserial r=−0.006 p=0.783，且被審查者
          指出這個特徵對所有 flip 類交易是「依建構方式必然為 1」，不是
