      **必須誠實記錄的兩個限制**（見 H14）：(1) 只有 1 個已知正例，用 n=1
      校準門檻不算驗證，正確描述是「對已知正例不誤殺的最鬆門檻」；(2) 此判準
      只分「機構避險/自營流量 vs 一般經紀流量」，**不分有沒有 edge**——9661
      (0.0501) 與 9227 (0.0487) 兩個已用 permutation 檢定證實的乾淨 null 跟
      9217 (0.0445) 三者擠在同一位置。**結論：它是 exclusion layer，不是
      selection layer**；hhi_res 高可以排除，hhi_res 低不能拿來選分點。

