  yuanta-songjiang-copytrade:
    title: 元大-松江分點 Copytrade · 門檻×Top-N × L×H×槽位 + swap 對照
    status: active
    phase: research
    run_scripts:
      - scripts/research/backfill_yuanta_songjiang_tape.py
      - scripts/research/run_yuanta_songjiang_copytrade_sweep.py
      - scripts/research/render_yuanta_songjiang_copytrade_html.py
    report_dir: reports/research/yuanta-songjiang-copytrade
    hypotheses:
      - id: H-SJ-RETURN
        statement: >
          固定槽 Copytrade 跟單元大-松江（門檻+Top-N）在 L∈{1,2,3} 網格上
          存在 period_return% 優於單槽基準的可執行參數組
        status: passed  # L3H18 1槽 ret%≈350 · L1H18 1槽≈337 · 20260717 sweep
      - id: H-SJ-SWAP
        statement: >
          對 period_return 冠軍參數，槽滿置換（新籃 mean_net > 最弱槽）優於 skip-when-full
        status: rejected  # Δret≈−196pp · n_swaps=54 · prefer skip-when-full
      - id: H-SJ-AMOUNT-RRG-MATCH-XD
        statement: >
          松江用金額門檻（可低於 80M）+ rs_ratio>100 + L2H12 + 1槽，
          可達到新店冠軍同級的 overlap 單槽複利（≥80% of ~2080%）
        status: rejected  # IS-best 50M+rs OOS/ov 為負；peek 最佳 ov 僅≈14% @150M
      - id: H-SJ-AMOUNT-FRESH-HAND
        statement: >
          全面使用金額口徑：松江當日淨買金額≥5M，且近20日同分點同股
          累計淨買金額≤25M，Top1 L3H18 可通過同門檻 OOS gate
        status: passed  # IS compound145%；OOS302%；overlap576%；全期992%
    context: >
      Signal: 元大-松江 (FinMind id 9801) net≥threshold then Top-N equal-weight.
      Phase A: reuse copytrade_backtest fixed slots (skip when full).
      Phase B: swap overlay on champion only.
      PIT: L1+ executable (branch tape after close).
    artifact: reports/research/yuanta-songjiang-copytrade/20260717_yuanta_songjiang_copytrade_sweep.md
    amount_rrg_compound_probe: reports/research/dual-branch-copytrade/20260718_yuanta_songjiang_amount_rrg_compound_probe.json
    skilled_hand_follow: reports/research/yuanta-songjiang-copytrade/20260718_songjiang_amount_skilled_hand_follow.md
    notes: >
      Requires Sponsor FinMind TaiwanStockTradingDailyReport by securities_trader_id.
      Backfill into stock_broker_branch_daily before sweep.
      Main champion max period_return is low-capture (1 slot · long H); alpha champion
      L1H12 × 9 slots is more capital-efficient for multi-slot deployment.
      20260718 金額版高手指紋取代先前張數版：signal threshold／Top1／prior20
      一律 NTD。IS 選 5M + prior20 signed net amount≤25M + L3H18 + 1槽；
