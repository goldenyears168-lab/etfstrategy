  tmf-hang-band-realtime-range:
    title: TMF 通道口 · 即時振幅統一日夜（取代 night×0.5）
    status: rejected
    phase: closed
    layer: research
    report_dir: reports/research/channel_lab
    run_scripts:
      - reports/research/channel_lab/tmf_hang_band_range_lab.py
      - reports/research/channel_lab/tmf_hang_band_blindspot_lab.py
      - reports/research/channel_lab/tmf_hang_band_session_ratio_lab.py
      - reports/research/channel_lab/tmf_hang_hi_sweep_lab.py
      - reports/research/channel_lab/tmf_hang_band_cross_day_lab.py
    hypotheses:
      - id: H-BAND-UNIFY
        statement: >
          以 PIT 滾動價格振幅（range_look × k）即時決定 hang_lo/hi，日夜同一公式、
          取消 night_hang_scale，Jun–Jul IS 淨利不劣於 Final v1.1.1（Δnet ≥ −3k），
          且夜盤 net 不崩。
        status: rejected
        evidence: >
          首輪絕對 envelope 最佳 E IS Δ−10.4k。盲點輪：session/tr_median 在 cap=60 下
          夜 hi p50 仍=60（BS2 釘死），IS 仍 −11k～−13k。
      - id: H-BAND-OOS
        statement: >
          同一 range 配方在 Apr–May OOS peek 相對基準 Δnet ≥ −5k（或日勝率不掉超過 5pp）。
        status: rejected
        evidence: >
          首輪／盲點輪（cap60）OOS Δ約 −6～−8k。T3(cap45) OOS≈持平但是 cap 混淆（見 H-BAND-CAP）。
      - id: H-BAND-FIXED1
        statement: >
          僅把 night_hang_scale 改 1.0（日夜固定 30–60）即可等同 range 方案效果。
        status: rejected
        evidence: B/W1 IS Δ−14.6k；固定全日 30–60 不可行。
      - id: H-BAND-BLINDSPOT
        statement: >
          首輪失敗主因是錯誤工具：rolling max−min 被尖點／長窗釘在 cap，且總 net 掩蓋夜盤崩。
        status: passed
        evidence: >
          BS1 夜盤 pre-session bleed 僅 7%；BS2 envelope≥釘 cap proxy **72.6%**。
          session envelope／tr_median 夜 hi p50 仍 60（對照基準夜 30）。見
          tmf_hang_band_blindspot_lab.json diagnosis。
      - id: H-BAND-CAP
        statement: >
          看似過關的 session+k0.25+cap45（T3）主要來自全域降低 hang_hi，而非即時振幅公式。
        status: passed
        evidence: >
          對照 C1 hang_hi=45+night×0.5：IS +102k／OOS +37.3k 優於 T3 OOS；
          T3≈C3，即時 session envelope 幾乎無額外貢獻。見 tmf_hang_band_bs6_cap_confound.json。
      - id: H-BAND-SESSION-RATIO
        statement: >
          hi(t) = ref_hi × (local_TR(t) / session_baseline_TR(session_type))，
          local_TR 為 session-scoped 中位 bar TR，baseline 為同型別（day 或 night）
          歷史 session 的 PIT trailing-N 中位（N=5/10），day/night 共用同一 ref_hi
          （60 或 50 皆試），cap 刻意放寬到 75 以排除 cap 混淆，測試日夜是否能靠
          「相對自身基準的活動比值」自然收斂，取代 night_hang_scale。
        status: rejected
        evidence: >
          Band 診斷：night hi p50 落在 50–63（≈ref_hi），從未落入 15–30 目標帶，
          與 day hi p50（51–64）幾乎相同——同型別 baseline 正規化把 day/night
          振幅差異數學上抵銷掉了（typical night bar 的 local/baseline≈1，跟
          typical day bar 一樣），結構性失敗、非參數問題。Backtest：IS 基準 A
          +93,749，最佳變體 R4(n10,ref50) +89,468（Δ−4.3k），最差 R2(n10,ref60)
          +79,540（Δ−14.2k）；OOS peek 全數 Δ−11k～−13.3k；IS night net 全變體
          塌陷（+50,988 → +37k～+40k）。cap=75 雖放寬仍被 day/night 對稱命中
          30–40%（非 H-BAND-CAP 那種夜盤獨有混淆，但值得留意）。見
          tmf_hang_band_session_ratio_lab.json /
          tmf_hang_band_session_ratio_lab.py。
      - id: H-BAND-CROSS-DAY
        statement: >
          針對同型別 baseline 抵銷日夜差的結構盲點，改用日盤 TR 作唯一分母：
          hi(t)=ref_hi×(local_TR/day_baseline_TR)，日夜同一公式、無 night_hang_scale；
          先過 band gate（夜 hi p50∈15–35），再要求 IS/夜盤/OOS 淨利門檻
          （且 ref_hi=60 以避免 hang_hi 下修混淆）。
        status: rejected
        evidence: >
          實證 night_TR/day_TR p50=0.528（≈既有 night×0.5）。Band：X1–X6 夜 hi p50
          皆落入 20–31（gate 過）——成功製造「看起來像 ×0.5 的口寬」。但 ref_hi=60
          變體夜盤 net 全崩（IS night Δ−8.1k～−9.3k）；唯一 draft-pass 的 X5(ref40)
          日 hi p50=42，屬 hang_hi 下修混淆（與 H-BAND-CAP／HANGHI-SWEEP 同類），
          不算本假設成立。結論：cross-day 解釋了為何固定 0.5 合理，但動態比值
          路徑≠固定 ×0.5 的成交／進出場分佈，夜盤 PnL 仍輸。見
          tmf_hang_band_cross_day_lab.json。
      - id: H-BAND-SCALE-ORIGIN
        statement: >
          固定 night_hang_scale=0.5 近似「夜盤中位 bar-TR／日盤中位 bar-TR」的長期比值，
          而非任意魔術常數。
        status: passed
        evidence: >
          2026-04–07 cache：day TR p50=36、night TR p50=19，比值 0.528。
          Cross-day 夜 ratio p50 亦穩定 ≈0.5。見 tmf_hang_band_cross_day_lab.json
          empirical_tr。
    do_not:
      - 未過閘改 live Final v1.1.1 / order.yaml / 盤中 poll
      - 用時鐘再乘第二層 night scale（雙重縮帶）
      - 把成交量 rvol 再塞進掛距公式（rvol 已管 regime）
      - 把 cap／ref_hi 下調的淨利贏當成「即時振幅統一日夜」已驗證
      - 再 sweep 更多 envelope k（在 cap=60 下夜盤已被釘死，工具錯）
      - 用同型別（day-vs-day／night-vs-night）trailing baseline 做 ratio
      - 用 ref_hi≪60 的 cross-day 結果宣稱取代 night×0.5（與 hang_hi 下修混淆）
      - 只過 band gate（夜 hi≈30）就當策略可採納——路徑動態仍可傷夜盤 PnL
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: pending
        G3_regime_stratification: pending
        G4_rejection_registry: passed
        G5_frozen_spec: pending
        G6_adoption_report: pending
    notes: >
      2026-08-05 開題＋多輪盲點研究（實盤未動）。產物含
      tmf_hang_band_cross_day_lab.json。
      已拒絕：絕對 envelope、night_scale=1、同型別 ratio、把 T3/cap 當 range 勝利、
      cross-day 動態比值取代 ×0.5（band 對、夜盤 net 不對；ref40 混淆）。
      已通過診斷：BS2 釘 cap；H-BAND-SCALE-ORIGIN（0.5≈夜/日 TR）。
      本主題「單一即時公式取代 night×0.5 且夜盤不傷」仍未達成；固定 ×0.5
      仍是夜盤口寬的務實 SSOT。獨立日盤調參 hang_hi 下修已另開
      **tmf-hang-hi-day-tighten**（勿再混進本主題）。

  tx-channel-amp-persistence:
    title: TX 通道 · 振幅延續性診斷 + 用即時振幅縮放通道/buffer 寬度
    status: rejected
    phase: closed
    layer: research
    report_dir: reports/research/channel_lab
    run_scripts:
      - reports/research/tmf_newsignal/amplitude_persistence_ic.py
      - scripts/research/tx_channel_amp_persistence_drivers.py
      - scripts/research/tx_channel_amp_persistence_drivers2.py
      - reports/research/channel_lab/struct_atr_buffer_amp_scaled_lab.py
    hypotheses:
      - id: H-AMP-PERSIST-RAW
        statement: >
          1分K振幅（ATR／RV）在5/30/120分鐘尺度上存在lag-1序列相關性（今天振幅
          高，下個窗口大機率還是高），日夜盤皆然。
        status: passed
        evidence: >
          750天（2023-07-03～2026-08-06）582日tick重建資料：lag-1 Spearman IC
          全組合0.49～0.94（ATR普遍比RV更持續，5min尺度最強），5-fold causal IC
          同號一致（5/5 fold），HAC rank regression全部p<0.05（多數p≈0，t值
          50～700）。去季節化（扣掉日內U型輪廓）後IC仍0.39～0.93，確認不是純粹
          時段效應。見
          reports/research/tmf_newsignal/amplitude_persistence_ic_result.json。
      - id: H-AMP-PERSIST-DECAY-DRIVERS
        statement: >
          若振幅持續性在~90-180分鐘後衰減／反轉，可用時段、方向、趨勢強度等
          變數解釋衰減原因，作為動態調整通道寬度的依據。
        status: confirmed
        evidence: >
          143天day-session tick資料重跑drivers.py＋drivers2.py（day-clustered
          顯著性）。原始IC在90~180min維持高檔(0.62~0.72)，不是真的衰減；
          扣掉pooled時段U型曲線後的去季節化IC才是真衰減：0.38(h12)→
          0.0027,p=0.96(h180)，等於h180已跟0沒有統計差異——時段效應解釋了
          絕大部分「衰減」表象。趨勢強度(|slope|)貢獻約1/5、方向(uptrend
          IC比downtrend高0.12~0.17但h90後不顯著)、同日相對極端值z_extreme
          (surprise IC −0.16→−0.34隨h90增強但不能取代amp本身，殘差IC仍
          0.61~0.63)皆為次要輔助因子，路徑效率(ER)/R2/成交量水準無乾淨
          增量解釋力（volume與amp幾乎定義上共線）。純診斷性結論，不重開
          H-AMP-WIDTH-SCALE（維持rejected）。見
          reports/research/channel_lab/amp_persistence_decay_drivers_result.json。
      - id: H-AMP-WIDTH-SCALE
        statement: >
          用即時（causal）振幅分數縮放 struct_break 的 ATR buffer／通道寬度，
          OOS 應優於固定倍數。
        status: rejected
        evidence: >
          2個獨立OOS折：fold2(octdec25,62天) amp−fixed mean=+16.0pt/日
          (t=1.17,不顯著)，amp−struct_disabled mean=−35.5pt/日(t=−1.72)；
          fold3(julsep25,65天) amp−fixed mean=+0.2pt/日(t=0.04,不顯著)，
          amp−struct_disabled mean=−25.1pt/日(t=−1.48)。即時振幅縮放跟固定
          倍數統計上無差異，兩者都輸給「乾脆不用這個機制」。與已關閉的
