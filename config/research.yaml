      - id: H-SC-WIDTH-PERCENTILE
        statement: >
          通道半寬從「全歷史 median」改成「近期滾動視窗的高分位數（p70/80/90）」，
          能讓「碰到邊緣後真的回中線」的比例往使用者期待的 80% 靠近。
        status: rejected
        evidence: >
          slow_cell_width_percentile_rolling.json：17 格網格（percentile
          ∈{50,60,70,80,90} × rolling window ∈{10,20,40,全歷史}），**審查
          claim_survives=true**（因果性逐格查過：rolling window 只取
          half_hist 尾端切片，append 時機與已驗證過的上一輪相同，P50/ALL
          與上一輪 median 版本逐位元重現，percentile() 對 numpy 2000 組
          隨機案例全部吻合）。**核心負面發現**：17 格的 target_pct（回中線
          比例）全部卡在 7.81%–12.05% 窄帶內，且方向與直覺相反——percentile
          從 50 拉到 90，target_pct 不升反降（11.89%→7.81%，NALL 系列）。
          機制解釋：target 距離＝1.0×half（回中線），停損反手距離＝
          flip_trigger×half＝0.3×half——兩者按同一個 half 等比例縮放，
          「目標:停損」比例恆為 1:0.3，不管 half 取哪個分位數都不變，這才是
          決定 target/reversal 比例的真正槓桿，不是 half 的絕對大小。
          net_pts 部分格子由負轉正（P60/N40=+5,345pt）是進場頻率降低
          （避開部分淨虧的邊緣觸碰）造成，跟「回中線更常發生」是兩件事，
          17 格 in-sample 網格搜尋亦有多重比較偏誤、無 walk-forward。

          **2026-08-08 補測：5-fold walk-forward 獨立加固**
          （slow_cell_width_percentile_5fold_walkforward.py，484天修正後
          cache，兩個獨立 track 各自跑出同一支腳本、數字互相印證）：5個
          不重疊 fold，用其餘4個 fold 做 IS 重選（best-by-net 與
          best-by-target 兩種選法皆試），OOS 過半（≥3/5）kill criterion
          （同 tx-donchian-flat-default-bracket 的 A5 pattern）**未過**：
          OOS-positive fold 數 2/5（by net：Fold1 +85pt、Fold2 +336pt，
          Fold3-5 深負 −2,110/−2,290/−1,142pt）、1/5（by target_pct）。
          **P60/N40 本身在 5 個 fold 的 IS 重選中 0/5 被選為最優**（無論
          net 或 target_pct 準則）——直接證實原本 83 天單批 in-sample
          挑出 P60/N40 純屬多重比較假象。**BUG-7（拆 exit_reason）**：
          兩個表面轉正的 fold 拿掉 session-end 強制平倉後全部轉負
          （Fold1 +85pt→−187pt；Fold2 +336pt→−162pt）——跟
          H-SC-SAR-CONVERTER MODE B／H-SC-COARSE-CATALOG-WALKFORWARD
          同一種樣態。累計 net_pts（兩種選法）皆為負（約−5,121pt／
          −4,611pt）。BUG-1 accounting_balanced 全數 True；OOS scoring
          程式碼確認 `d <= fold_last_day` 無未來 fold 洩漏。
        do_not:
          - 引用「P60/N40 net +5,345pt」當作找到可行設定——這是 17 格
            in-sample 搜出來的、且未解決 target_pct 過低的根本問題，只是
            湊巧避開部分虧損交易；2026-08-08 5-fold walk-forward 更進一步
            證實 P60/N40 在任何一個 fold 的 IS 重選中都不曾被選中（0/5）
          - 再用「調 half 的百分位數/視窗」當下一步槓桿——真正該測的是
            target/stop 的相對距離比例（例如把目標設在比中心線更近的位置，
