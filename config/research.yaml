  # ── ft3_rel_20 趨勢 vs 水準 · Live TA 欄位驗證（2026-07-25）──
  ft3-rel-20-trend-vs-level:
    title: ft3_rel_20 趨勢 × 價格 · 斜率是否比水準多資訊
    status: active
    phase: research
    layer: research
    priority: P1
    report_dir: reports/research/chip-overlays/ft3_rel_trend
    run_scripts:
      - scripts/research/run_ft3_rel_trend_study.py
    split_spec: universe167_is2019_2025_oos2026
    hypotheses:
      - id: H-T1
        statement: >
          Live TA 的 T-1 欄（ft3_rel_20 兩日變動）代表有意義的籌碼趨勢
        status: rejected  # 與 (FT_T − FT_{T−3})/Σ|FT|20 的 R²=0.981，純機械；delta 自相關僅 0.081
      - id: H-T2
        statement: >
          ft3_rel_20 的斜率（5／20／60 日）比水準值提供更多前瞻資訊
        status: rejected  # IS 橫斷面 IC 三個窗全為顯著負值（slope20 x20 t=−3.68）；雙重排序 IS 價差≈0
      - id: H-T3
        statement: >
          籌碼趨勢↑ × 價格趨勢↓（SMFI accumulation-into-weakness）為潛在買點
        status: rejected  # IS lift 僅 +0.043pp；60 日窗持續越久越差（OOS ≥20d −0.89pp）
      - id: H-T4
        statement: >
          ft3_rel_20 水準值在熱絡盤具橫斷面排序力（五分位價差 ≥ +0.3pp／10 日）
        status: supported  # +0.49pp・NW t=3.65・bootstrap CI[+0.23,+0.77]・11/12 年為正；冷盤 IC≈0
      - id: H-T5
        statement: >
          2492 的 ft3_rel_20 水準值前瞻顯著，且低分位為否決訊號而非高分位為買進訊號
        status: supported  # block bootstrap x1/x5/x10/x20 CI 全不含 0；Q1 −0.65pp/勝率45%，Q2–Q5 無差別
    context: >
      直接驗證 Live TA 已上線的 ft3_rel_20 與 T-1 欄。核心結論：**趨勢沒有比水準多資訊，甚至更差**。
      3 日滾動和造成 lag1 自相關 0.808 的重疊假象（lag3 才降到 0.358 = 真實流量持續性）；
      兩日變動的高同日相關（0.390）來自「含今日 FT」，跨日即歸零。斜率為負的方向與
      Froot–Ramadorai／Hasbrouck 價格衝擊後回吐一致。外部 SMFI「持續數週背離」主張在台股個股不成立。
      方法要點：橫斷面 rank IC 才是排序濾網的正確檢定；重疊 10 日標籤需 NW／block bootstrap 校正
      （naive t 6.41 → NW 3.65）。資料衛生：stock_daily_bars 有 410 筆 close=0 佔位列須濾除
      （v2 未濾但其結論建立在中位數上，不受影響，惟 v2 的 mean 欄位不可用）。
      Live TA 建議：保留水準欄、T-1 欄改標示為「今日 FT vs 三天前」、不要加斜率欄。

