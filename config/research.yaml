        status: rejected  # Spearman 0.045→0.031 · full Sharpe 2.42→0.95
      - id: H-S3-1
        statement: S3+RV 釋放 track 隔日 P(≥5%) 顯著高於 S2 Setup core
        status: supported  # ~10% vs ~1% · 與 pre-release 母體不同
      - id: H-S3-2
        statement: oracle（隔日台指≥0）≈隔夜 β · close_exec ~+1.26%/筆
        status: supported
      - id: H-S3-3
        statement: D+1 gap 開盤進場 open→close 不能複製 oracle
