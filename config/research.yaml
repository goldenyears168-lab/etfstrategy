            通過，不是2個
          - 把`do_not_second_reverify`裡「原始panel不可信，需要重建」這個
            待辦讀成尚未完成——這輪已把修法寫回`build_orderflow_panel.py`
            本體(非另開檔案)、證明兩次獨立重跑821天全部bit-for-bit相同、
            並完整重跑過IC篩選+回測+HAC+擾動測試，這個待辦到此關閉；repo
            裡`orderflow_panel.csv`本身也已經是修好版本，不再是原始
            quicksort版本
          - 誤讀「H-NS-TICK-ORDERFLOW-OPEN-WINDOW現在有乾淨結論」為「repo
            其他還用`sort_values`排時間序列的腳本也都沒事」——這輪只驗證
            並修了這一支`build_orderflow_panel.py`，其他腳本若也用「只到
            秒的時間戳+預設quicksort」排序同類tick資料，同一個bug pattern
            理論上可能重現，未逐一稽核
      - id: H-NS-LRC-CONTINUATION
        statement: >
          用回歸線通道(LRC，滾動窗口配適迴歸線，中線±k倍殘差)在
          34/55/89/233分鐘(約30分鐘~4小時)窗口上，賭「突破後延續」
          （順著突破方向進場）而非賭反轉——跳出tx-donchian兩條線全部
          測的都是「fade」（賭反轉）這個共同盲點，是真正沒測過的新方向。
        status: rejected  # 5摺walk-forward全部四個window OOS皆負、kill criterion 5全數觸發；window=55額外HAC顯著虧錢
        evidence: >
          750天資料(2023-07-03~2026-08-06，`bars.sqlite`的
          `tx_1m_tick_built_582d`)，5摺walk-forward(IS150天+120天/摺，
          跟`tx_flat_bracket_phase5_walkforward.py`同一套切法)，ATR倍數
          bracket(k_stop∈{5,8,12,16,20,25}×ratio∈{0.75,1,1.5,2}，24組
          網格，因750天內TX從~16,500漲到~44,000近3倍，固定點數已知
          不穩健)。

          **四個window的OOS總損益全部為負**：34→−3,105.2pt、
          55→−18,331.4pt、89→−15,163.7pt、233→−2,635.0pt，且**每個
          window都只有1/5摺正報酬**(全部是最新的Fold5，2026-01-29~
          2026-08-06)，kill criterion 5(fold正負號翻轉)全數觸發。逐
          fold的失敗模式(Fold1-4輸、只有Fold5贏)跟`tx-donchian-flat-
          default-bracket`線H-TXFB-OPTION-A/B的fade版本幾乎一模一樣
          ——不是選錯方向，是這個訊號來源(LRC/Donchian突破+這個window
          尺度)在2024~2025這段期間本身就沒有可交易的edge，賭哪個方向
          都一樣。

          **HAC顯著性**(正負向同一套「全部maxlags p<0.05」標準)：
          window=55**顯著虧錢**(HAC p=0.013/0.020/0.031全過)；
          window=89差一點(naive p=0.036但HAC maxlags=10時0.057未過，
          判定不顯著)；window=34/233不顯著。方法論警訊：window=34/55
