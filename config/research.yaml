        include_passed_seeds: true
        include_june2026_lead3: true
      seeds:
        H1c:
          require_elag_plag: true
          require_excess_band: true
          require_gap1: true
          end_q: lagging
          prev_end_q: lagging
          grid:
            bench_min: [1.5, 2.0, 2.5]
            sig_lo: [-5, -4, -3]
            sig_hi: [-1]
            rv_lo: [95, 96, 97, 98]
            rv_hi: [99, 100]
        H3:
          end_q: improving
          require_gap1: true
          grid:
            bench_min: [0, 0.5, 1.0]
            bench_max: [1.5, 2.0]
            streak_lo: [7, 8]
            sig_lo: [-1, -0.5]
            sig_hi: [0.5, 1.0]
            rv_lo: [96, 98]
            rv_hi: [100]
        SW03-R02:
          description: "baseline R02 · b2+elag+dip+rv98+gap1"
          bench_min: 2.0
          end_q: lagging
          sig_lo: -2
          sig_hi: 0
          rv_lo: 98
          rv_hi: 99
          require_gap1: true
      cooccurrence:
        enabled: true
        success_min_ret_3d: 3.0
        exclude_extreme_pct: 25.0
        min_recurrence: 2
        min_lift: 1.3
        min_months: 1
        min_recurrence_triple: 2
        loss_lift_mult: 1.8
        min_tag_n_exclusion: 30
        max_pattern_seeds: 12
        force_exclude_tags: [bench_neg, chase, st1_3]
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: passed
        G3_regime_stratification: passed
        G4_rejection_registry: passed
        G5_frozen_spec: passed
