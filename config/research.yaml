        statement: >
          跨分點同日共識（K≥3或5）OOS 中位不劣於單分點全事件臂
        status: rejected  # H1=0 → consensus overlay skipped
      - id: H4-SHORTWINDOW-P1-UNRELATED
        statement: >
          短窗 best-pair P1 排名與全事件 OOS 排名 Spearman ρ<0.3
        status: passed  # ρ=0.097 n=247
    context: >
      Goal: selectable branch-follow copytrade with pre-registered rules.
      Unit score = median r_adj over ALL qualifying events of branch B.
      Explicitly rejects short-window best (B,S) P1 as selection metric.
      Orthogonal to stock-first expert-pool skill; research only.
    artifact: reports/research/branch-footprint-screen/分點跟單全事件研究計畫.md
    notes: >
      2026-07-20 run: prefer2y 247 branches · D1' 115520 → episode 73190 ·
