    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: weak_pass  # 延伸樣本非cherry-pick重跑，n=13-14仍偏小、去極值後不穩健；8358冠軍格另補Bonferroni k=30保守MC校正，median(p=0.0002)仍<α/30=0.00167存活但mean(p=0.115)本就不顯著，完整30格BH-FDR因原始網格無逐格p值而未能重建，維持weak_pass而非upgrade
        G3_regime_stratification: na
        G4_rejection_registry: passed  # H2 reject並記錄理由；H1/H3 passed但均有保留條件
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        pure research（不修改POOLS核心名單，也不停用expert_pool_staged_gate
        ——目前無實際下單風險）。建議：8046池措辭降級（原「P6冠軍」宣稱
        未能在延伸樣本+permutation檢定下複現）、8358池保留觀測降低優先度、
        2344池維持現狀。9216/9268是否適合留在POOLS核心名單，留待更多樣本
        累積後再決定，本輪證據不足以支持立即剔除也不足以完全排除疑慮。
