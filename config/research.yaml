    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-SELECTABLE-BRANCHES
        statement: >
          以凍結 D1'+L1H7+β1.25，存在≥5家分點 IS 全事件中位超額≥+2%且n≥30，
          且 OOS 中位≥+1%且n≥15（跟分點全出手，非 best(B,S)）
        status: rejected  # n_pass=0；唯一 IS 過門 960T OOS−3.2%
      - id: H2-BEAT-UNIVERSE
        statement: >
          H1 通過分點之 OOS 中位超額優於全宇宙／同密度對照至少 +1pp
        status: rejected  # H1=0 precondition；skipped
