      對象，非本研究首次識別）(2) 交易習慣分析（星期/月份分布、單筆
      金額分布、偏好價位區間）(3) 建倉推估（cumsum淨買超、retention
      ratio、估計目前持倉市值——已知6個盲點：未計成本均價/未計期間
      內減碼後又加碼的路徑依賴/分點資料無法排除代操或其他客戶同名下單/
      無法排除同分點其他大戶流量混入/資料起始點早於分點涵蓋擴大前可能
      低估/無法對照分點是否為多重帳戶交叉持有同一標的的加總) (4) 對
      已知重倉股（2337/6147/8358/2408等）做 L1H7 timing 與相對高低點
      擇時分析、金額門檻掃描 (5) **關鍵修正**：門檻掃描初版結果誤判為
      顯著，經 campaign 去重覆（同分點同股≤10交易日內連續事件合併僅取
      首日）後重新檢驗，正確結果是不顯著——與本topic既有教訓（訊號
      自相關導致偽獨立事件灌水統計顯著性）完全一致，本研究亦犯過同一
      錯誤並自行發現修正 (6) 修復 stock_daily_bars 已知缺口
      （coverage_gap_audit_full.csv 所列8檔含8358/1815/6147/3006/6141/
      6269/8213）避免 INNER JOIN 靜默丟失真實交易紀錄 (7) 最終決定性
      驗證：月度 net-position-change signal 對 sector_return +
      market_return 回歸，cluster-robust（年月分群）或 Newey-West SE，
      時間切分 IS(60%)/OOS(40%)、OOS 只跑一次不回頭調參。
    notes: >
      識別身分查證（Web search）：廖學邦（487哥/凱基松山哥）與陳族元
      （富邦新店）均為台股社群公開討論的知名分點大戶，本研究僅做統計面
      的訊號價值驗證，不涉及任何非公開資訊。

      核心負向發現（H3，方法論層級，比個別假說更重要）：全樣本期查證
      發現 9217 與 9661 各自在其涵蓋窗口內都對 2000+ 檔個股有交易紀錄，
      近乎覆蓋全上市櫃市場。這與「單一具名大戶只重押少數已知標的」的
      研究前提直接矛盾——分點代碼本質是整個券商分點的全客戶流量加總
      （含該分點其他散戶/法人/可能的造市或代操流量），不是單一個人的
      乾淨身分代理。這個限制同時削弱 H1 與 H2：即使 9217/9661 在特定
      重倉股上偵測到正向或負向訊號，都無法排除「訊號其實來自同分點其他
      客戶流量、剛好與該大戶已知重倉股重疊」的替代解釋。

      統計方法演進與教訓：個股層級門檻掃描（2337/6147）起初呈現正向
      結果，本研究者一度誤報為「顯著」，經自行重跑 campaign 去重覆後
      發現效果完全消失——與 whale-branch-l1h7-discovery 第三輪 9216/
      9B2a/5852 的「報酬標準差隨天期擴大的統計假象」是同一類方法論
      陷阱的不同表現形式（本例是「未去重覆的偽獨立事件」而非「天期
      放大的極端值敏感度」），已於過程中向使用者揭露此疏忽並改正。

      最終月度 panel regression（控制產業/大盤共同因子、walk-forward
      OOS）：9217 與 9661 的月度淨買超訊號係數均不顯著，無穩健可交易
      edge。這是用比 whale-branch-l1h7-discovery 既有 event-level t-test
      （n=25，G2_oos_holdout=insufficient_n）更嚴謹的方法論（更長獨立
      樣本期、產業對照組、cluster-robust SE）補上該 topic 遺留的驗證
      缺口，補上後答案是負向而非「樣本不足待觀察」。

      實務含義：9217 目前仍是 mini 上 songshan-copytrade launchd job
      （config/order.yaml，branch_id=9217，auto_submit=true）的 live
      訊號來源。本研究的月度panel regression結論與該策略「維持live」
      的既有假設衝突，是否調整/停用屬於使用者的實盤資金配置決策，本
      研究不自動變更任何 live 設定。

      使用者亦要求（1）修好 FinMind 價格缺口（尤其重倉股）（2）用更長
      獨立樣本期+更嚴謹產業對照組驗證「跟大戶」的價值——兩項均已在本輪
      完成：缺口修復見 backfill_stock_daily_bars_gaps.py（7檔全部驗證
      成功），嚴謹驗證即上述月度 panel regression，最終誠實結論是
      negative/no-edge，非因樣本不足而懸而未決。

      songshan-copytrade live 狀態核實（2026-07-28）：SSH mac-mini 確認
      order.env 目前 ORDER_SONGSHAN_COPYTRADE_ENABLED=0、DRY_RUN=1、
      AUTO_SUBMIT=0，launchctl 未載入該 job——songshan-copytrade 目前
      並非 live（與 2026-07-27 停用整批 auto-submit job 的紀錄一致），
      上方「待使用者決定是否降級/停用」的疑慮暫無資金曝險急迫性。

      【第六輪：使用者質疑 null result、要求找盲點 → H4 三角度延伸驗證
      （2026-07-28）】使用者主張「9217/9661明顯是靠投資賺大錢的大戶，不
      可能沒有穩健edge」，要求重新檢查方法論盲點。研究者提出三個 H1/H2
      月度panel regression完全沒測過的角度並explicitly誠實承諾「測了還是
      不顯著也照實回報」：(a) 長天期 forward return（原規格只測1個月，
      改測1/3/6/12個月，涵蓋「長波段建倉」假說）(b) conviction quintile
      （依IS期signal_z切五等分，Q5=最大重壓月，避免小額雜訊月稀釋真訊號）
      (c) Q5 vs 其餘尾部事件bootstrap CI檢定（直接測「他最大的那幾把重壓」
      本身，對應「財富來自少數幾筆生涯級重壓」的假說）。新增
      study_whale_conviction_tail_extended_horizon.py --trader-id，用同一
      套IS(60%)/OOS(40%)walk-forward切分（IS 2024-07~2025-09、OOS
      2025-10~2026-07）。

      結果（兩分點一致）：全樣本pooled迴歸OOS的signal_z係數，1/3/6個月
      天期全部不顯著（9217: p=0.46/0.09/0.36；9661: p=0.04但係數
      +0.00075經濟意義可忽略、H3m p=0.73、核心持股子樣本H6m p=0.0004但
      係數為負且n僅24/群數僅4不可信）。Q5-vs-rest尾部bootstrap CI在
      1/3/6個月OOS共8列全部「不顯著(CI含0)」，無一列CI完全落在正值。
      12個月天期OOS因OOS窗口僅10個月無法建構不重疊樣本，兩分點皆
      n=0（**方法論上的硬缺口，屬未測，不能算作「測到負向」**）；12個月
      IS（非OOS）反而出現統計顯著的**負向**結果（9217 diff=-0.246
      95%CI=[-0.431,-0.045]；9661 diff=-0.327 95%CI=[-0.507,-0.146]，
      皆為Q5落後Q1-4），方向與「重壓月本身最賺」假說相反，但僅IS不能
      當作結論。**H4三個角度均未找到之前方法論遺漏的正向edge，判定
      rejected**。

      給使用者的誠實回應：三個角度已窮盡分點層級能做的統計切法（時間
      維度、加權方式、尾部聚焦），仍是null result；這不代表「他們沒賺
      錢」，而是還剩兩個此研究架構本質上無法排除的解釋——(a)財富可能
      主要不是來自這個分點申報買賣本身（其他帳戶/分點分散下單/非公開
      管道/實業背景）(b)分點資料是多客戶流量加總，聚合稀釋問題無法靠
      任何分點層級的統計手法解決，需要個人身分層級的乾淨交易資料才能
      真正驗證。12個月長天期OOS因資料窗口不足是唯一仍待補的角度，需要
      更長的OOS資料窗口（目前僅10個月）才能補測，非本輪方法論能解決。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: passed  # 月度panel regression + 延伸驗證均walk-forward IS/OOS，OOS只跑一次；12個月天期OOS因窗口不足(僅10個月)為na非passed
        G3_regime_stratification: na  # 月度樣本數不足以再切regime
        G4_rejection_registry: passed  # H1/H2/H3/H4 均reject並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        H1(9217)：contested，非rejected（2026-07-28修正）：原「無edge」
        判斷建立在有瑕疵的訊號定義上——`monthly_net_signal()`是整月無
        條件加總淨買賣股數，跟songshan-copytrade實際live訊號
        （scan_5d_net95：滾動5交易日buy_5d≥5000萬且net_ratio≥0.95）不是
        同一件事，會被同月其他客戶流量稀釋。用真正live訊號重測（n=36）：
        t-test顯著但去極值後不穩健；改用permutation/placebo檢定（控制
        同股票隨機時機的null分布）後單尾p值 mean≈0.005-0.008、
        median≈0.00000-0.00005（3 seed×20000次置換皆穩定）——比t-test更
        決定性支持9217具備真實時機選擇能力，證據方向持續轉強。

        H2(9661)：**維持rejected，但這次是用對方法測出來的**（2026-07-28
        Track A.3）：比照9217同協議的live-faithful訊號重測（n=36），
        全樣本median-1.90%（負）、勝率47.2%（低於50%）、t/Wilcoxon/
        permutation檢定全部不顯著（p_mean=0.274、p_median=0.755）。這是
        一個乾淨的null result，跟9217用同一方法測出的強烈正向形成對比，
        佐證整套方法論本身沒有「測誰都測出正向」的系統性偏誤——9217的
        正向結果因此更可信。

        H3（分點=全客戶流量聚合，非單一大戶乾淨代理）不受上述修正影響，
        結構性限制依然成立。H4尚未用live-faithful訊號重跑，同樣待補。
        songshan-copytrade（9217）已核實目前非live（2026-07-28 SSH確認
        DRY_RUN=1/AUTO_SUBMIT=0），無資金曝險急迫性，建議維持現狀待
        更多樣本外交易累積，不建議貿然停用也不建議因訊號轉強就立即加碼。
        12個月天期OOS驗證因資料窗口不足仍是open item。

  expert-pool-pools-consensus-reverify:
