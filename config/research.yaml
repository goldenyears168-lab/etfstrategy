      分離外資／投信，以淨買 NTD÷前20日 ADV 正規化，rolling AR(5) 取不可預期流，
      rolling 價格衝擊分離已反映與未反映部分；固定年度 walk-forward，禁止以同日相關冒充預測。
      華新科籌碼的高參考價值主要在「同日價格發現」與 hot-market 相對強弱／低流否決，
      不是每日獨立買點。公開日資料缺 marketable/aggressive order、成交方向、母單與盤中時序，
      因此不能完整複製學術微結構研究。分點融合仍 research only，重疊 episode 有效樣本過薄。

