  whale-buy-concentration:
    title: 分點買超集中度 · 單一大戶主導吃貨 vs 對手盤分散（散戶承接推論）
    status: active
    phase: hypothesis
    split_spec: default_is_oos
    run_scripts:
      - scripts/research/scan_whale_buy_concentration.py
      - scripts/research/study_whale_buy_concentration_forward_return.py
    report_dir: reports/research/branch-footprint-screen
    hypotheses:
      - id: H1-WHALE-BUY-FORWARD
        statement: >
          當某股單日（或短窗）買超金額中，Top1 或 Top1+2 分點占比 ≥80%
          且絕對金額 ≥2億（排除 mega 權值股與 ETF），事件後 forward
          excess return（vs IX0001）顯著為正
        status: rejected  # IS(n=63) H1/H9/H20 勝率<50%、Sharpe 0.03~0.13 效果量太薄；OOS(n=28)遠低於 min_oos_n=80 不具統計意義，但 H20 出現 -12.5%(n=9) 需留意非下結論
    methodology: >
      單位 (trade_date, stock_id)：對 stock_broker_branch_daily 當日所有出手
      分點算買超金額（buy股數×close），排序後取 Top1/Top1+2 占比。門檻：
      Top1+2 金額≥2億 · Top1+2 占比≥80% · Top3 占比<10%（避免 3-4 位大戶平分
      誤判）· 出手分點數≥15（確認對手盤分散非資料稀疏）。排除 mega 黑名單
      （ab58_xMega_copytrade/mega_blacklist_v1.json）與 ETF（"00"開頭代碼，
      實物申購常態性單一參與券商大額申報會誤觸發）。同一 (stock_id,
      top1_trader_id) 短窗內（≤10 交易日）連續事件合併為一個「行情」，僅取
      首日為進場點，避免同一波吃貨被拆成多筆偽獨立事件、灌水統計顯著性。
    notes: >
      資料涵蓋率限制：stock_broker_branch_daily 在 2024-07 之前僅追蹤極少數
      分點（多數日期 n_branches=1），2024-07 起穩定在 266 家分點，2026-05
      起擴大到近千家。研究期間固定為 2024-07-01 起，之前資料不具集中度計算
      意義。校準（2024-07-01～2026-07-22）：ETF/mega排除後 115 個原始事件、
      合併同分點連續行情後 92 筆。IS(n=63)：H1/H9/H20 勝率 39.7%/42.9%/44.4%
      （皆<50%），H5 勝率 49.2%；平均 excess 0.1~1.2%、Sharpe-like 僅
      0.03~0.13，效果量薄弱。OOS(n=28，長 horizon 因近期事件缺未來資料只剩
      9~11 筆)遠低於 min_oos_n=80，不具統計意義，但 H20 出現 -12.5%
      （勝率22.2%、n=9）方向性負值值得後續留意。結論：目前定義下的買方集中度
      訊號本身看不出明確預測力，暫不建議投入更多回測資源，見報告
      whale_buy_concentration_study.md「建議」段落（累積更多資料 / 改測賣方
      集中度 / 疊加濾網三個方向）。
    graduation:
