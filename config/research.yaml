      - id: H-SC-EDGE-REVERT
        statement: >
          價格觸碰慢尺度通道外緣時，用逆勢（fade）進場、賺回歸中線的震盪，扣成本
          後仍有正期望值（使用者原始商業假說：「成交幾乎都在通道裡面進出、賺
