            等於新的參數搜尋，若要做需先設計獨立 IS/OOS 切分並凍結門檻
      - id: H-NS-DAYCLOSE-NIGHT-MOMENTUM
        statement: >
          日盤收盤前 N 分鐘（13:15–13:45）的收盤動能，能不能預測「跨
          session 單邊持有」的夜盤整段（night_open→night_close）方向——
          機制上明確跟已死路徑（開盤±X雙邊掛單、開盤前15分固定窗+通道
          出場）不同：決策時點在日盤收盤而非開盤、機制是跨session單邊
          持有到夜盤結束而非同session內雙邊/通道出場、不依賴ZigZag/通道。
        status: rejected  # 2/2審查通過（含次要瑕疵但不影響結論）；IC 3/5同號未過門檻、OOS全轉負但HAC不顯著、滯後擾動測試顯示效應可能非交接特有
        evidence: >
          去重複確認：讀過 tmf-slow-pattern-cell 全部10個假說（純ZigZag+
          通道逐bar機制，跟本假說「跨session單邊持有」不同）、memory
          tmf-open-straddle-no-edge.md（開盤±X雙邊掛單，時間點與機制皆
          不同）、us-tw-overnight-no-night-alpha.md（死的是「追隨美股
          隔夜方向」，本假說刻意不引用任何美股/VIX資料，純用TX/TMF自身
          日盤收盤動能，避免撞上同一條死路的陰影）、tx-donchian線
          H-TXD-SESSION-CONTINUITY-BUG（那是通道計算的方法論修正，不是
          「交接時點本身的預測力」這個交易假說）——確認無重疊。

          484天cache（此快取夜盤僅到23:59，未含00:00-05:00延伸段，已誠實
          揭露），過濾薄資料後454天有效。feat_last30=day_close(13:44/45)
          −price@13:15（僅用t≤13:45已知資料），進場night session第一根
          bar的literal open，出場最後一根bar的literal close（天生就是
          session-end force-close，非自選停利停損）。方向凍結只用IS段
          （227天）Spearman IC正負號決定，OOS（227天）原封不動套用。

          **5摺causal Spearman IC（3個lookback：15/30/60分鐘）全數僅
          3/5摺同號，未過4/5門檻**——特徵預測力在事前門檻就不合格。
          **回測**（仍誠實跑完揭露）：三個lookback在OOS段一致轉負
          （last30 OOS mean=−16.17pt/day），但**HAC顯著性檢定
