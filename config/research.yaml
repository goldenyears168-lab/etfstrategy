        G2_oos_holdout: pending
        G3_regime_stratification: pending
        G4_rejection_registry: passed
        G5_frozen_spec: pending
        G6_adoption_report: pending
    notes: >
      2026-08-08 產物，事後補登記。誠實框架：這是「讓已知虧錢的struct_break
      機制少虧一點」的濾網候選，不是新edge；struct_break本身已被
      tmf-structbreak-campaign圍剿~120個變體全滅（見同名memory）。若要繼續，
