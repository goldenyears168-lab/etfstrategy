      hhi=0.0143/規模568.87億) 結構上毫無共同點；結論修正為「至少三種機構
      型態，共同點只有排除有益這個操作性結論」。已在 JSON 加 branch_type
      分類（concentrated_prop_hedge 4 家 / mixed_foreign_desk 1 家 /
      broad_omnibus_brokerage 12 家）。連帶降級的既有敘述：9216 note 的
      「117檔股票高度分散」（實際 hhi=0.0719 > 9217 的 0.0578，比 9217 集中）、
      9268/9800 的「廣度極端版本、錢攤很開」（實際 hhi_res 第 97 百分位）、
      9B2a/5852 的「觸及近乎全市場」作為排除理由——四者均撤回為描述性事實，
      排除結論本身改掛各自的報酬統計證據與 hhi_res。

      **名單成員本輪不變更**（仍 17 家），但證據強度分層：980C(-0.0145，第 51
      百分位)、5852(+0.0096，第 76 百分位)、9B2a(+0.0440，near-miss 差 0.0005
      且樣本僅 122 日) 三家新判準不支持，其留名單完全靠各自獨立的報酬統計
      瑕疵；建議 980C 下一輪重測後考慮降級為 watch。JSON 已 bump 至 v1.1 並加
      criterion_v2 區塊。**不建議**用 hhi_res 新增/刪除名單成員：66 家名單外
      命中者未經逐一深挖，直接擴充等於用 n=1 校準的門檻做批量判決。

      【第十輪：窗口延長至 2026-08-14 + 母體變動稽核（2026-08-17）】背景：使用者
      問「分點資料是否還在每日累積」，查證後確認 tape 每日更新未斷（9217 每日
      550~660 檔），遂把第六~八輪的 n=36 母體延長重跑。**結論往負面移動，且惡化
      來源不是新資料，是舊母體本來就被吃掉。**

      舊 36 筆全部逐筆 bit-identical 重現（協議未動）。n=36→48 的來源拆解：
      **+10 筆來自 2026-08-07 一次 `stock_daily_bars` 歷史回補**（3013/2489/2486/
      2312/6472/2374/2498/2371 等 2024 年 bars，`synced_at` 全部是
      2026-08-07T18:53:14），這些價格在第六~七輪執行當下**還不存在**，被 INNER JOIN
      靜默丟掉；+2 筆是舊窗口內原本右設限、現在 H7 走完（6271/2492）；
      **來自 2026-07-25 之後新 tape 的 = 0 筆**。

      後果：第六輪年度分解「完全沒有 2024 事件」是資料假象。本輪 2024 冒出 7 筆，
      且是最差的一批（mean +1.132% / median **−5.835%** / 勝率 **28.6%**），正是它
      把全樣本統計拉下來：
      - 全樣本 n=48：mean +3.424%（第六輪 +5.663%）、median +2.172%（+6.275%）、
        勝率 56.2%（66.7%）、**t_p 0.150（0.043）、Wilcoxon p 0.251（0.067）——
        兩個檢定雙雙失去顯著性**；去 top5 極值後 mean **−0.041%**（第六輪 +2.763%）
      - campaign 去重（gap 1/3/5/7/10/15/20 全掃）：n 只掉到 41~47、點估計反而略升，
        t/Wilcoxon 在**全部 7 個 gap 值下一致不顯著**。第五輪的 campaign 灌水坑本輪
        沒有重演，結論對去重定義穩健
      - permutation（20000×3 seed）：全樣本 p_mean 0.0155~0.0176（第七輪 ≈0.0059，
        **惡化約 3 倍**）、p_median 0.0017~0.0022（第七輪觸 1/20000 下限）。
        仍顯著，但緩衝明顯變薄
      - BH-FDR（N=4 家族延長窗口全部重跑）：9217 仍是唯一 mean+median 雙通過者
        （定性不變），但 q 全面惡化——mean q 0.0121→0.031~0.035（已貼近 0.05）、
        median q 0.0002→0.0066~0.0088（惡化 33~44 倍）；且 mean 排序上 9801
        （n=33, mean +4.186%）現在排第一。對照組：9661 n=45 median −1.926%、
        9227 n=170 median −3.382%（Wilcoxon p=0.0007 **顯著為負**）
      - **前瞻 OOS n=0**：2026-07-22 之後 17 個交易日 rising-edge 事件 0 筆
        （`triggered` 狀態列 4 筆全是 2492 從 07-22 延續的同一波）。同期分點沒停手
        （5,275 個 stock-day、579 檔活動），124 個 stock-day 過了 buy_5d≥0.5億 但
        net_ratio 沒到 0.95。**乾涸是 net_ratio 條件擋掉，不是分點沒交易或資料斷更**

      **本輪最該記入 research integrity 的一條**：母體會隨 `stock_daily_bars` 回補
      而事後長大（n=36→48，協議零改動）。這代表**過去每一輪的 p 值都是在一個會事後
      變動的母體上算的**，未來任何一次回補都可能再次改寫結論。相關的結構性缺口：
      `stock_daily_bars`(finmind, 4碼非00) 全時期只有 **861 檔**，而 9217 tape 觸及
      **2,235 檔**，其中 **1,376 檔（61.6%）在價格表裡一列都沒有**；月度缺失率
      2024-07 為 60.8%、2026-08 為 46.3%（早期更糟，直接偏斜年度分解）。用 PIT 合法的
      last-known-close fallback 重算只救回 0.7%（統計量完全不動）——**這證明 fallback
      修不了這個缺口，也因此不能拿「統計量沒變」宣稱已排除影響**。
      詳見 whale_9217_round10_summary.json、whale_branch_family_round10_bhfdr.json、
      whale_9217_round10_price_fallback_summary.json。

      【同日發現的 ops 缺陷（非研究結論，但會污染研究）】`stock_daily_bars` 每日有價
      檔數在 2026-07-13 前穩定 540~541，**2026-07-14 起變成 419~611 劇烈震盪**
      （08-10~13 只剩 419~422），至少 45 檔（含 7610/5328/3441/8042/4939/8043/6834
      /8110/8105/5285/6166）的 bar 停在 2026-07-13、但分點 tape 仍持續活躍。
      實例：**7610 在 2026-07-30 是一筆真實觸發（buy_5d 1.456 億、淨比 1.000，
      全市場 8 家分點對敲驗證過），live watch 完全沒看到**。
      `run_songshan_follow_watch.py` 的 `refresh_missing_ohlc()` 有 `missing[:80]`
      硬上限，對每日 200~350 檔缺價補不完、缺口持續累積。這是**活的**資料品質退化，
      不是靜態歷史限制。
    graduation:
      gates:
        G1_preregistered_hypothesis: passed
        G2_oos_holdout: rejected  # 【第十一輪 2026-08-17/18 決定性降級】把 9217 tape 的價格覆蓋率從 40.5% 補到 **99.9%**（2,233/2,236 檔，scripts/ops/backfill_active_tape_bars.py --branch-id 9217）後，同協議重算母體 n=53→88（**已收斂**：覆蓋 78% 與 99.9% 皆為 n=88，新補標的都跨不過 0.5 億門檻）：mean −0.571% / median −3.706% / 勝率 43.2%；改用專案跨軌成本標準 58.5bps 則為 mean −0.856% / median −3.991%。**訊號為負，不是弱。** 決定性的證據是單調衰減序列（協議零改動，只有「看得見多少」在變）：覆蓋~40% n=36 +5.66%/+6.28%/66.7% → n=48 +3.42%/+2.17%/56.2% → 覆蓋40.5% n=53 +2.26%/+0.59%/54.7% → 覆蓋~43% n=71 −0.27%/−1.55%/46.5% → **覆蓋78%→99.9% n=88 −0.571%/−3.706%/43.2%（收斂）**。且**去極值後更負**（去 top3 mean −2.065%、去 top5 −2.949%）——與先前各輪「去極值讓正 mean 翻負」相反，代表現在是少數贏家在撐住一個負的核心。年度分布也在覆蓋修好後才平衡（2024:26 / 2025:24 / 2026:38；先前 53 筆有 31 筆擠在 2026，那是早年覆蓋更差 2024-07 缺 60.8% 造成的假象）。文獻定位：backfill bias（Fung & Hsieh 2000 JFQA 35(3):291-307）＋ selection-on-early-sample——9217 是在 n≈36、覆蓋 40% 的世界裡從 774 家選出的，後補的 52 筆等於免費的準樣本外，答案是負的。**因此第六~十輪所有 permutation p / BH-FDR q（含 p_median=0.00005、q=0.0002）全部是算在系統性缺掉輸家的母體上，不再有效。** 詳見 docs/songshan-copytrade-research-round11.md。第十輪原文（供對照）：延長窗口 n=48 後 t_p 0.150 / Wilcoxon 0.251 雙雙不顯著、去 top5 極值 mean 翻負、BH-FDR q 惡化 3~40 倍，但因 permutation 與 BH-FDR 雙統計量仍通過而維持 weak_pass延長窗口 n=48 後 t_p 0.150 / Wilcoxon 0.251 雙雙不顯著、去 top5 極值 mean 翻負(−0.041%)、BH-FDR q 惡化 3~40 倍(mean 0.0121→0.035 已貼近 0.05)；permutation 仍顯著但 p_mean 惡化 3 倍(0.006→0.016)。之所以不降級為 insufficient_n/rejected：permutation 與 BH-FDR 雙統計量仍通過、campaign 去重對 7 個 gap 值一致穩健、對照組 9661/9227 是乾淨或顯著為負的 null（方法無「測誰都正向」偏誤）。**但兩個新的硬限制必須連帶記住**：(a) 前瞻 OOS n=0，本輪未取得任何真正樣本外新證據；(b) 母體會隨 stock_daily_bars 回補事後長大(n=36→48 協議零改動)，過去每輪 p 值都算在會變動的母體上。第七輪原文：permutation 檢定證據強度明顯更高但因 n=36 偏小維持 weak_pass
        G3_regime_stratification: na
        G4_rejection_registry: passed  # 779Z/920F/9239/9216/9B2a/5852/9268/9800/consensus_pairs/9699x7769/6696/6831 均明確拒絕並記錄理由 ｜第九輪追加：H14（集中度不能當 selection layer）、H15（「同一種簽名」宣稱）兩項明確 reject 並記錄理由
        G5_frozen_spec: na
        G6_adoption_report: na
      action: >
        pure research（四輪分點宇宙篩選後仍未找到可採納新候選；9699×7769
        經深挖後判定reject，暫無pending線索）。**第七輪更新（2026-07-28）：
        用permutation/placebo檢定（src/research/branch_signal_validation.py）
        重新評估9217的n=36live訊號結果，單尾經驗p值mean≈0.005-0.008、
        median≈0.00000-0.00005（3個seed×20000次置換皆穩定），比第六輪
        t-test/Wilcoxon更決定性地支持9217具備真實時機選擇能力。songshan
        -copytrade建議維持現行dry-run/保守配置，證據方向持續轉強但n仍
        偏小，累積更多樣本外交易後可考慮升級配置。**第六輪原文（供對照）：
        第五輪判「9217無edge」的月度panel regression訊號定義有瑕疵（測的
        是無條件整月加總，不是live實際交易的滾動5日集中度訊號），已被
        推翻；用真正live訊號(scan_5d_net95)重測顯示方向正向但仍脆弱
        （n=36、t顯著但Wilcoxon邊緣、去極值後顯著性消失、IS/OOS切分被
        9217自身交易量4倍成長混淆）。songshan-copytrade建議維持現行
        dry-run/保守配置，不加碼也不降級，待更多樣本外交易累積。**

        **第十一輪更新（2026-08-17/18·現行結論·決定性）：把 9217 tape 的價格覆蓋率
        從 40.5% 補到 **99.9%** 後，同協議重算 n=53→88（已收斂），mean −0.571% / median −3.706% /
        勝率 43.2%（跨軌成本 58.5bps 則 −0.856% / −3.991%）。**訊號為負，不是弱。**
        G2 已降級為 rejected（理由見 gates 註解）。九路平行驗證中八路 null/reject：
        門檻（真 walk-forward 輸給什麼都不做）、Regime 八軸（q 全 0.962）、
        Minervini/Weinstein（一半是涵蓋度假象）、18 種出場（0/18 過 BH-FDR、去 5 筆極值全滅）、
        加碼、按強度加權、多席共識（嚴格共識僅 3/52）、建倉判別（去機械重疊後 p=0.994，
        且 6449 四筆中 3 筆被判「建倉型·值得跟」）。唯一存活線索＝同官方產業 20 日去重
        （劑量反應 +8.68%/−0.05%/−4.10%，p=0.017；同股票去重是 null），但 q_global≈0.116、
        篩掉 49% 訊號、未在 n=88 重驗。**執行面是雙重打擊**：贏家買不到（被處置/漲停擋掉的
        11 筆是 mean +7.71%、勝率 81.8%），輸家買得到——這條袖 4 次送單全失敗、從未成交，
        是必然不是意外。**songshan-copytrade 維持三重鎖住，理由從「證據不足」升級為
        「證據為負」。** 140 條延伸研究（E 學術 40 / C 跟單方法論 30 / I 內部移植 30 /
        P 台股實務 40）、104 篇逐篇查證文獻、10 個可用方法與 14 項資料缺口，全部記於
        docs/songshan-copytrade-research-round11.md。**方法本身沒失效，失效的是套用對象**
        ——那 10 個方法應當作下一輪候選篩選的工具，而非拯救已證明為負訊號的補丁；
        動之前必須先跑 Romano-Wolf stepdown（從 774 家挑冠軍正是這次翻車的根源）。
        **本輪最該記住的切分＝「跟單 ≠ 用分點資料」**：借用某分點的「判斷力」——四輪
        地毯式搜尋正向候選數 0（774 家 BH-FDR 顯著 11 個全部負向、外資 10 席第三次
        獨立否決、9661 乾淨 null、9227 n=170 median −3.38% p=0.0007 顯著為負、
        9217 median −3.71%），外部先驗同向（Barber-Lee-Liu-Odean 2014 JFM 18:1-24：
        台灣全市場 <1% 交易者能穩定賺扣費後正報酬）。但讀取分點資料裡的「流量結構」
        ——同一批 24 席（含 9217 本人）撐起 dayflip-futures-short，2026-08-07 起 live，
        因為它賭的是「他明天會倒貨」這個**機械性行為事實**（跟標的好壞無關），
        不是「他看好所以會漲」這個**能力賭注**。10 個方法裡第一級的三個之所以證據最強，
        正是因為它們量的都是流量結構。**下一步不是找第 775 家分點，是把分點資料當流量
        顯微鏡用。** 完整論證見 docs/songshan-copytrade-research-round11.md §0。**

        第十輪更新（2026-08-17）：延長窗口至 2026-08-14（n=48）後
        證據強度下降——t-test/Wilcoxon 雙雙不顯著、去 top5 極值 mean 翻負、
        BH-FDR q 惡化 3~40 倍；且惡化全部來自 2026-08-07 一次 stock_daily_bars
        歷史回補後才看得見的 2024 舊樣本（勝率 28.6%），不是新 tape。
        前瞻 OOS n=0（2026-07-22 後 17 個交易日零觸發，瓶頸是 net_ratio≥0.95）。
        songshan-copytrade 維持 disabled/dry-run，**本輪不構成恢復送單的依據，
        也不構成永久停用的依據**。恢復送單能力必須是使用者明確直接的指示。
        下一步優先序：(1) 修 stock_daily_bars ingest（2026-07-14 起每日有價檔數
        從穩定 540 掉到 419~611 震盪、45 檔停在 07-13），這是研究母體會事後變動的
        根因；(2) 在 n=48 母體上重做第八輪的 volume tercile / 時序 quartile 7-fold
        （原 fold 建在 n=36 上已失效）；(3) buy_floor（非 net_min）的正式
        walk-forward——in-sample 網格顯示 floor 才是報酬單調性最強的維度，
        但該網格本身不能當證據。**

