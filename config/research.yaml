        8358 PoolSpec playbook與_pool_from_watch_spec fallback裡的「P6冠軍」
        字樣改為「P6網格候選」並附加未經MC校正警語（純wording、未動選池/
        門檻邏輯）。完整30格BH-FDR仍是缺口：原始網格
        （fubon_xindian_funnel/p6_grid_8046_8358.json）只存點估計、無逐格
        p值，需重跑訊號＋permutation才能真正做BH-FDR，非本輪範圍。

