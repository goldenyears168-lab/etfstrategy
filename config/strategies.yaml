# Strategy registry — daily close: facts + regime; adopted specs SSOT: config/strategy.yaml
# enabled: 同一 strategy_id 須與 config/strategy.yaml 一致（registry / launchd gate）

version: strategies-v9
primary_strategy: etf-daily

strategies:
  etf-daily:
    title: ETF 持股變化（Facts）
    layer: facts
    kind: diagnostic
    enabled: true
    description: >
      追蹤列表內各 ETF 成分股持股變化（L1 shares 差分）。只報事實、不評分、不選股。
    sources:
      - "{date}_etf_daily.md"
      - "etf-daily/daily_brief.md"
    aliases:
      daily_brief.md: "etf-daily/daily_brief.md"

  regime-daily:
    title: Regime four-axis diagnostic
    layer: regime
    kind: diagnostic
    enabled: true
    description: >
      四軸市場環境 Regime four-axis diagnostic（Breadth zone · Trend posture · RRG · Stage-2 participation）。
      非 live gate · 不產 alpha。
    sources:
      - "regime/daily_brief.md"
      - "regime/daily_brief.html"
      - "regime/snapshots/{date}/daily_brief.md"
    aliases:
      daily_brief.md: "regime/daily_brief.md"

  00981a-l1h9:
    title: 00981A copytrade L1H9
    layer: strategy
    kind: competition
    enabled: true
    description: >
      00981A 新进/加码 · T+1 開 · 9 槽 hold9 · 手動 screen / 回測。
    sources:
      - "{date}_copytrade_l1h9_daily.md"
      - "copytrade_l1h9_daily.md"
      - "backtest_summary.json"

  rrg-mono-hold7:
    title: RRG mono · seg_last · 3-slot hold7
    layer: strategy
    kind: competition
    enabled: false
    description: >
      Legacy screen · superseded by rrg-mono-swap-accel (C18acc) ·
      spec retained · manual rerun only · daily_sync rrg_mono_daily skipped.
    sources:
      - "{date}_rrg_mono_daily.md"
      - "rrg_mono_daily.md"

  rrg-mono-swap-accel:
    title: RRG mono swap-accel · C18acc
    layer: strategy
    kind: competition
    enabled: false  # 2026-08-04 排程暫停（C18acc 退場拆除中）· 須與 strategy.yaml 一致
    parent_strategy: rrg-mono-hold7
    description: >
      daily_sync 16:30 收盤診斷（Scheme A）+ 盤中 avg_accel/5m poll live screen ·
      fresh mono 全池（2026-07-12 採納 · 取代 POOL1 fresh∪accel）·
      同日近收盤進場 ≥13:00（2026-07-14 採納 · ops ≥30m-to-close）·
      confirm_bars=1 live（C18ACC_CONFIRM_BARS）·
      四日加速对称换仓（簡化漏斗：不裁 top10 · 買方合併單規則）·
      S2 rotation exit（2d weakening + loss≥5% · close 強制平倉 · 2026-07 採納）·
      spread_lost bypass（W5−W20 spread_rs≤0 → 正加速 held 可 rotation 賣出 · 2026-07-05 採納）·
      avoid spread_mixed entry+swap gate（W5/W20 · first poll≥13:00 · 錨點隨 no_trade_before）·
      entry avg_accel_decel rank（R2 · 2026-07-12 採納）·
      underwater_rebound pyramid add 採納（H-C18-PYRAMID-1 · order c18acc_pyramid_add）。
    funnel_summary: >
      池：fresh mono · ≥13:00 同日 kbar 暫定鎖池（≈EOD）；
      进：avg_accel_decel（四日）· confirm_bars=1 · skip spread_mixed（13:00 錨點 W5/W20）；
      换：卖 avg_accel<0 最弱 · spread≤0 時正加速亦可賣 · 买 seg_last+0.05 后 avg_accel 最大 · skip mixed · min5 max10 · 1 swap/日 · ≥13:00；
      出：S2 quad_force_exit（weakening 2d + unrealized loss≥5%）；
      加碼：underwater_rebound 等權第二筆（sync_exit）。
    score_keys_note: >
      双指标漏斗（2026-07-12 entry-rank 採納）：定池/shortlist=seg_last；进场=avg_accel_decel；
      换仓卖/买排序=avg_accel_decel；换仓门槛=seg_last+0.05。
      20260712 R2 OOS +0.66pp vs C0×seg_last；20260709 unified-key audit：全程 seg_last 换仓 −1.6pp。
    sources:
      - "{date}_rrg_mono_swap_accel_daily.md"
      - "rrg_mono_swap_accel_daily.md"
      - "{date}_rrg_c18acc_screen.md"
      - "rrg_c18acc_screen.md"

  vcp-pivot-gate:
    title: VCP Pivot Gate
    layer: strategy
    kind: competition
    enabled: true
    env_flag: RUN_VCP_FUNNEL_SPECS
    model_version: vcp-pivot-gate-h20
    description: Separate launchd vcp-funnel-specs · 13:00 · hold20。
    sources:
      - "{date}_vcp_pivot_gate_daily_brief.md"
      - "vcp_pivot_gate_daily_brief.md"

  vcp-coil-close:
    title: VCP Coil Close
    layer: strategy
    kind: competition
    enabled: true
    env_flag: RUN_VCP_FUNNEL_SPECS
    model_version: vcp-coil-close-h20
    description: VCP funnel 變體 · 訊號日 close · 共用 vcp-funnel-specs launchd。
    sources:
      - "{date}_vcp_coil_close_daily_brief.md"
      - "vcp_coil_close_daily_brief.md"

  minervini-sepa-basket:
    title: Minervini SEPA basket
    layer: strategy
    kind: competition
    enabled: false
    env_flag: RUN_MINERVINI_SEPA_SCREEN
    description: >
      月末 Trend Template 7/7 等權 basket · dry-run intent · 寄信。
      已於 2026-07-29 確認退役（config/job_registry.yaml），launchd job 已卸載、
      scripts/launchd/minervini-sepa-basket.command 已不存在。2026-08-01 修正
      enabled 狀態以符合現實（先前誤留 true，與 job_registry.yaml 矛盾）。
    sources:
      - "{date}_minervini_sepa_basket_daily.md"
      - "minervini_sepa_basket_daily.md"

  rrg-mono-swap-accel-extension:
    title: C18acc Extension overlay
    layer: strategy
    kind: competition
    enabled: false  # 2026-08-04 排程暫停（隨 C18acc 主軌退場）
    parent_strategy: rrg-mono-swap-accel
    env_flag: RUN_C18ACC_EXTENSION_SCREEN
    description: >
      combo_spike extension research overlay · legacy 1m screen；
      live advisory 改由 sell-signal-radar（宇宙 extension 純訊號 · 5m · 寄信）。
    sources:
      - "{date}_c18acc_extension_daily.md"
      - "c18acc_extension_daily.md"

  buy-signal-radar:
    title: Buy signal radar · C0 advisory
    layer: strategy
    kind: operational
    enabled: true
    parent_strategy: rrg-mono-swap-accel
    env_flag: RUN_BUY_SIGNAL_RADAR
    description: >
      多池買入觀測 · fresh-mono + mono-tier2 寄信（來源池標示 · 同檔合併）·
      ABC 回踩池 enabled:false（Order 已退役 · 不跑／不寄）·
      C0 scale 5m · 5m poll 09:00–13:20 · 寄信 RUN_BUY_SIGNAL_EMAIL · 全程不送單。
    sources:
      - "{date}_buy_signal_radar.md"
      - "buy_signal_radar.md"

  sell-signal-radar:
    title: Sell signal radar · universe extension
    layer: strategy
    kind: operational
    enabled: true
    parent_strategy: rrg-mono-swap-accel-extension
    env_flag: RUN_SELL_SIGNAL_RADAR
    description: >
      宇宙 extension combo_spike 純訊號 · 5m poll 09:06–13:20 · 不讀持倉 ·
      寄信 RUN_SELL_SIGNAL_EMAIL · advisory only。
    sources:
      - "{date}_sell_signal_radar.md"
      - "sell_signal_radar.md"

  detach-gate:
    title: Detach Gate · 台美脫鉤閘門
    layer: strategy
    kind: operational
    enabled: true
    env_flag: RUN_DETACH_GATE
    description: >
      TW↔NQ rolling 30m DETACH（5m poll）· trough-first 半倉風控 ·
      範圍＝券商全帳戶持倉 · RED → 買一價各檔 floor(qty/2) · 寄信達標／下單 ·
      launchd 09:40–12:30 · Order flags ORDER_DETACH_GATE_* 。
    sources:
      - "reports/order/snapshots/us_tw_5m_sell_gate_latest.json"
      - "reports/research/rrg/20260715_us_tw_5m_sell_gate_ready.md"

  leading-dip:
    title: Leading Dip · coverage · gap∩excess(昨收)
    layer: strategy
    kind: research_adopted
    enabled: true
    env_flag: RUN_LEADING_DIP_POLL
    description: >
      Leading ∧ gap3≤−0.80 ∩ excess(昨收)≤−4 · coverage 含開盤 · hold T+3 ·
      日槽≤2／總在外≤6 · Order live · 預算 2 萬/筆 · 採納 2026-07-16。
    sources:
      - reports/research/rrg/20260715_leading_wma20_excess6_wma3_confirm.md
      - reports/order/snapshots/leading_dip_latest.json

  leading-dip-mid:
    title: Leading Dip mid · ≥10:00 · excess(今開)
    layer: strategy
    kind: research_adopted
    enabled: true
    parent_strategy: leading-dip
    env_flag: RUN_LEADING_DIP_POLL
    description: >
      主軌互補衛星 · gap∩excess(今開) · minute≥10:00 · 排除當日 main 觸發 ·
      日槽≤1／總在外≤3 · 預算 2 萬/筆 · 採納 2026-07-16。
    sources:
      - reports/research/rrg/20260715_leading_dip_time_sleeve_expand.md
      - reports/research/rrg/20260715_leading_dip_gap_excess_open_anchor.md

  tmf-micro-channel:
    title: TMF 微型臺指 · Channel Final v1.5.0 PV16 cell-tune v2 + 逐分鐘即時 NQ 閘門
    layer: strategy
    kind: research_adopted
    enabled: true
    env_flag: ORDER_TMF_CHANNEL_ENABLED
    description: >
      微型臺指近月 channel · Order futopt · Final v1.5.0：16-cell cell-tune v2
      （O-anchor · quiet=dry · cell BIAS · night normal/expand_dn/div_hh_weak_vol
      block_LS）——cell-tune v3（day normal/div_hh_weak_vol 全封鎖）2026-08-08
      經對抗式審計判定原始證據源自NQ閘門look-ahead bug，未採納/已revert，
      不在本版；v1.5.0 帶的是NQ/ES隔夜閘門改逐分鐘即時重算 + 3項下單層
      韌性修復（詳見 config/strategy.yaml applied_refinements）·
      engine=src/tmf_channel · KeepAlive worker。
      白皮書 docs/tmf-micro-channel-final-v1-1-prd.md。
    sources:
      - docs/tmf-micro-channel-final-v1-1-prd.md
      - reports/research/channel_lab/r_cost_aware_cell_tune_wf.json
      - src/tmf_channel/causal_engine.py
      - src/order/tmf_channel_pv16_book.py
