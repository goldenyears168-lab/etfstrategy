  rrg-mono-swap-accel:
    title: RRG mono swap-accel · C18acc · 四日加速对称换仓
    kind: competition
    schedule: daily_sync
    schedule_time: "16:30 Asia/Taipei Mon-Fri"
    enabled: false  # 2026-08-04 排程暫停（C18acc 退場拆除中）· 須與 strategies.yaml 一致
    parent_strategy: rrg-mono-hold7
    n_slots: 3
    hold_days: 10
    module: rrg_mono_swap_accel_daily_brief
    screen_module: rrg_mono_swap_accel_screen
    backtest_module: rrg_mono_score_swap_c
    run_script: scripts/run_rrg_mono_swap_accel_daily_brief.py
    screen_script: scripts/run_rrg_mono_swap_accel_screen.py
    description: >
      RRG mono fresh 全池 · avg_accel 盤中進 · confirm_bars=1 · 同日近收盤 ≥13:00 開窗 · 5m poll 換倉 ·
      四日加速卖弱买强 · margin=0.05 · underwater_rebound pyramid 採納 ·
      16:30 Scheme A 收盤診斷 + 盤中 live screen（C18acc）。
    funnel:
      pool:
        - "ETF 成分 watchlist"
        - "mono tier2: up_right + leading + disp∈[1,2) + mono_up"
        - "fresh: 同日近收盤（≥13:00 kbar 暫定 ≈EOD）新进 · 全池 passthrough（採納 2026-07-12 · 取代 POOL1）"
        - "seg_last 排序 · 全池（不裁 top10 · passthrough）"
      entry:
        leg: C0
        timing: poll_5m
        score_mode: avg_accel
        confirm_bars: 1  # live SSOT · C18ACC_CONFIRM_BARS=1（ops alpha；≠ research baseline 2）
        avoid_spread_mixed: true
        spread_gate:
          anchor: first_poll_ge_no_trade_before
          no_trade_before: "13:00"
          wma: W5/W20
          scope: entry_and_swap
        entry_window: "13:00–13:30 Asia/Taipei"
        adoption: reports/research/rrg/20260714_c18acc_entry_e1300_adoption.md
      swap:
        timing_mode: poll_5m
        min_hold_days: 5
        max_hold_days: 10
        max_swaps_per_day: 1
        sort_key: avg_accel_decel
        buy_rule: "seg_last > held + 0.05 后取四日加速最大"
        accel_sell_negative_only: true
        accel_sell_bypass_on_spread_lost: true
        spread_bypass_rule: "W5−W20 spread_rs ≤ 0（昨收 PIT）→ 正加速 held 亦可 rotation 賣出"
        score_margin: 0.05
        accel_lookback: 4
        quad_force_exit_mode: weakening
        quad_force_exit_min_days: 2
        quad_force_exit_loss_pct: -0.05
        quad_force_exit_requires_min_hold: true
        rotation_exit_variant: S2
        rotation_exit_research: c18acc-rotation-exit
      removed_no_op:
        - top10_crop
        - shortlist_refilter
      score_keys:
        pool_rank: seg_last
        entry_sort: avg_accel_decel
        swap_sell: avg_accel_decel
        swap_buy: avg_accel_decel
        swap_margin: seg_last
        swap_margin_delta: 0.05
        note: >
          双指标漏斗（勿全程单一 key）。20260712 entry-rank：進場改 avg_accel_decel（R2 · OOS +0.66pp）；
          20260709 unified-key audit（poll_5m·POOL1·607td）：champion 5.64% mean_excess；
          pool+swap 全 avg_accel ≡ champion；全程 seg_last 换仓 4.05%（−1.6pp）。
    backtest:
      spec_type: slot_strategy_backtest
      source_module: rrg_mono_score_swap_c
      variant_id: C18acc
      metrics:
        - n_periods
        - win_rate_vs_bench_pct
        - mean_excess_pct
        - mean_return_pct
        - swaps_total
        - force_exits
      date_start: "2024-01-01"
      date_end: "2026-07-03"
      n_slots: 3
      hold_days: 10
      min_hold_days: 5
      entry_price_mode: intraday_c0
      score_margin: 0.05
      sort_key: avg_accel_decel
      buy_sort_key: avg_accel_decel
      accel_lookback: 4
      quad_force_exit_mode: weakening
      quad_force_exit_min_days: 2
      quad_force_exit_loss_pct: -0.05
      quad_force_exit_requires_min_hold: true
      candidate_pool: fresh
      accel_sell_bypass_on_spread_lost: true
      source_summary: reports/research/rrg/20260712_c18acc_fresh_pool_adoption.md
      notes: >
        fresh-only candidate pool · 簡化 POOL1 fresh∪accel（2026-07-12 adoption）·
        entry no_trade_before=13:00 same-day near-close（2026-07-14 採納 · ops ≥30m-to-close）·
        confirm_bars=1 live（與 order.yaml / C18ACC_CONFIRM_BARS 對齊）·
        S2 exit unchanged · spread_lost bypass · avoid spread_mixed @ 13:00 anchor.
    pyramid_add:
      enabled: true
      hypothesis: H-C18-PYRAMID-1
      condition: underwater_rebound
      rebound_min: 0.3
      sizing: equal_weight_second_unit
      exit_convention: sync_exit
      notes: >
        採納 2026-07-16 · Order c18acc_pyramid_add.enabled=true ·
        live via rrg-c18acc-poll（scan_c18acc_pyramid_adds · O3-7）·
        env C18ACC_PYRAMID_ADD_ENABLED=1 · sync_exit with leg1 S2/sim exit.
        Evidence: IS Δ +0.901pp · OOS +1.189pp（313 legs）· slot OOS +0.548pp.

