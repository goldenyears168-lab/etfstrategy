  rrg-mono-swap-accel:
    title: RRG mono swap-accel · C18acc · 四日加速对称换仓
    kind: competition
    schedule: daily_sync
    schedule_time: "16:30 Asia/Taipei Mon-Fri"
    enabled: true
    parent_strategy: rrg-mono-hold7
    n_slots: 3
    hold_days: 10
    module: rrg_mono_swap_accel_daily_brief
    screen_module: rrg_mono_swap_accel_screen
    backtest_module: rrg_mono_score_swap_c
    run_script: scripts/run_rrg_mono_swap_accel_daily_brief.py
    screen_script: scripts/run_rrg_mono_swap_accel_screen.py
    description: >
      RRG mono fresh∪accel 全池 · C0 盘中 scale 进 · 5m poll 换仓 · 四日加速卖弱买强 · margin=0.05 ·
      16:30 Scheme A 收盤診斷 + 盤中 live screen（C18acc · RUN_RRG_C18ACC_SCREEN）。
    funnel:
      pool:
        - "ETF 成分 watchlist"
        - "mono tier2: up_right + leading + disp∈[1,2) + mono_up"
        - "fresh: 昨日非 mono tier2、今日新进"
        - "fresh∪accel: fresh ∪ (mono_tier2 ∧ 4d avg accel>0) · POOL1 採納 2026-07-05"
        - "seg_last 排序 · 全池（不裁 top10 · passthrough）"
      entry:
        leg: C0
        timing: poll_5m
        score_mode: scale
        confirm_bars: "0|1"
      swap:
        timing_mode: poll_5m
        min_hold_days: 5
        max_hold_days: 10
        max_swaps_per_day: 1
        sort_key: avg_accel_decel
        buy_rule: "seg_last > held + 0.05 后取四日加速最大"
        accel_sell_negative_only: true
        accel_sell_bypass_on_spread_lost: true
        spread_bypass_rule: "W5−W20 spread_rs ≤ 0（昨收 PIT）→ 正加速 held 亦可 rotation 賣出"
        score_margin: 0.05
        accel_lookback: 4
        quad_force_exit_mode: weakening
        quad_force_exit_min_days: 2
        quad_force_exit_loss_pct: -0.05
        quad_force_exit_requires_min_hold: true
        rotation_exit_variant: S2
        rotation_exit_research: c18acc-rotation-exit
      removed_no_op:
        - top10_crop
        - shortlist_refilter
    backtest:
      spec_type: slot_strategy_backtest
      source_module: rrg_mono_score_swap_c
      variant_id: C18acc
      metrics:
        - n_periods
        - win_rate_vs_bench_pct
        - mean_excess_pct
        - mean_return_pct
        - swaps_total
        - force_exits
      date_start: "2024-01-01"
      date_end: "2026-07-03"
      n_slots: 3
      hold_days: 10
      min_hold_days: 5
      entry_price_mode: intraday_c0
      score_margin: 0.05
      sort_key: avg_accel_decel
      buy_sort_key: avg_accel_decel
      accel_lookback: 4
      quad_force_exit_mode: weakening
      quad_force_exit_min_days: 2
      quad_force_exit_loss_pct: -0.05
      quad_force_exit_requires_min_hold: true
      candidate_pool: fresh_union_accel
      accel_sell_bypass_on_spread_lost: true
      source_summary: reports/research/rrg/20260705_c18acc_w20_conditional_accel_sweep.json
      notes: >
        POOL1 amendment · fresh∪accel candidate pool · S2 exit unchanged ·
        spread_lost bypass (+0.11pp FULL excess · total ret 311% vs 303% · OOS neutral) ·
        採納 2026-07-05 · Phase4 W4P4-bypass

