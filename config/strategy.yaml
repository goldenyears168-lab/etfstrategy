  abc-v3-f1-pullback:
    title: ABC v3+f1 intraday pullback · event-level
    kind: research_adopted
    schedule: none
    enabled: false
    parent_strategy: rrg-mono-swap-accel
    module: triple_wma_pullback_sweep
    backtest_module: abc_v3_slot_sweep
    description: >
      Triple-WMA ABC v3+f1 event-level spec · skip09 poll · hold 3d → 13:30 ·
      matcher w3_rv_hl_abc_v3_f1 (A∩B∩C∩D∩E∩F) · F gate avoid W5 MV>W3 MV ·
      5-slot portfolio val NOT passed · slot sizing pending · observe-only on buy-signal-radar.
    matcher:
      id: w3_rv_hl_abc_v3_f1
      parent: w3_rv_hl_abc_v3
      gates:
        A: "W20−W3 RV ≤ 6.0"
        B: "W20 Leading · W5 Weakening"
        C: "W5 RV ≤ 101.0"
        D: "W20 RV ≤ 104.0"
        E: "trade_signal = lead_pullback_buy"
        F: "W5−W3 MV < 0.01 (avoid W5 MV > W3 MV)"
    execution:
      min_poll_idx: 1
      skip_poll: "09:00"
      entry_timing: intraday_poll
    exit:
      rule: hold_3d
      exit_minute: "13:30"
    portfolio:
      validated: false
      notes: >
        Event-level OOS passed (90d val 1.826% vs v3 1.291%) ·
        5-slot top-K val daily 0.506% vs 0.561% failed · do not size slots until re-validated.
    backtest:
      spec_type: event_level_intraday
      source_module: abc_v3_slot_sweep
      matcher: w3_rv_hl_abc_v3_f1
      metrics:
        - n
        - mean_ret_3d_net_pct
        - win_rate_pct
        - median_ret_3d_net_pct
      intraday_tail_days: 90
      hold_days: 3
      execution_gate: "min_poll_idx>=1"
      source_summary: reports/research/rrg/20260708_abc_v3_f1_pipeline_90d.json
      notes: >
        Event-level 採納 2026-07-08 · f1 n=170 ret=2.845% vs v3 n=220 ret=2.229% ·
        val event passed · 5-slot val failed · portfolio/slot sizing NOT validated.

