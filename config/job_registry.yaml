    category: order
    order_capable: true
    status: enabled
    enabled_since: "2026-08-12"
    schedule: "KeepAlive worker · interval≈1s in-window（2026-08-13 20s→5s→1s，使用者要求；⚠️12檔trades()請求量隨之提高，rate limit風險見下）· weekdays 08:44-13:41"
    description: >
      ⚠️ 2026-08-13 11:04起 ORDER_MOMENTUM_ROTATION_AUTO_SUBMIT改回0（dry-run）
      ——使用者live當天發現4筆交易全虧、追查後發現回測本身的fill-price假設有問題
      （用「訊號當下實際tick價」重跑backtest，勝率從86.9%掉到40.2%、日均從+22.8%
      掉到+1.67%，見reports/research/momentum_breakout_expert_pool_futures_summary.md
      開頭的2026-08-13重大更新章節）——回測宣稱的高勝率絕大部分是量測錯覺，不是
      執行問題，在這個問題被完整重新驗證之前**不要**恢復AUTO_SUBMIT=1，即使明天
      開盤worker照常會跑，也只會是dry-run。當天收工時ledger是halted=True、空手、
      無孤兒部位（AI watch agent判斷「額度錯誤已反覆5輪未解決」觸發，同時使用者
      已知情這個回測發現，主動選擇今天不再嘗試恢復）。

      個股期貨開盤動能12檔單槽位輪動+動態搶佔（momentum-rotation）· 開盤±0.5%突破+
      量能≥1.5x確認進場 · 1%移動停利 · 同檔一天可多次觸發（rearm 0.25%）· 搶佔倍數
      2.0x。2026-08-12 使用者明確決策：2026-08-13起真人真金實盤（LIVE，非dry-run），
      第一階段固定1口，保證金預算11萬。ORDER_MOMENTUM_ROTATION_AUTO_SUBMIT=1（已在
      mini .env 設定，2026-08-13開盤起送真單，11:04起改回0，見上）。安全閥：
      ORDER_MASTER_ENABLED總開關
      （=1）+ 連續進場失敗5次熔斷（max_consecutive_entry_failures）+ 單日虧損
      -3%熔斷（daily_loss_limit_pct）。引擎：src/order/momentum_rotation_order.py
      （reconcile_once狀態機）+ momentum_rotation_signal.py（12檔訊號邏輯）。
      2026-08-13盤前：資料來源從1分K（fetch_1m_bars）改逐筆成交（fetch_1m_bars→
      order/momentum_rotation_tick_marketdata.py::fetch_ticks_as_bars，使用者明確
      要求比照回測simulate_portfolio_day最細刻度）；process_new_bar本身通用不用改，
      等同性驗證見tests/test_momentum_rotation_tick_marketdata.py（真實逐筆資料重放
      比對兩條路徑，過程中抓到並修掉process_new_bar一個跟回測不一致多年的volume
      baseline seeding bug——原本開盤那根K的volume會被錯誤塞進baseline歷史，
      跟回測「空歷史預設1.0」不一致，只影響每檔每天第一個候選訊號的判定）。worker
      輪詢間隔20s→5s，降低trades()可能截斷回傳筆數的風險。⚠️ 兩個沒辦法在今天
      開盤前驗證的殘留風險（見momentum_rotation_tick_marketdata.py檔頭）：
      Fugle/富邦intraday.trades()真實回傳筆數上限未知、回傳欄位名稱是防禦性猜測
      （比照candles/tickers慣例），失敗模式設計成安靜漏訊號而非用錯資料下錯單。
      2026-08-13再修一項：reconcile_once進場/搶佔選擇規則從「本次poll候選裡分數
      最高」改成「嚴格按BreakoutSignal.trigger_time排序、先到先贏」（搶佔則是
      「先到且分數有過PREEMPT_MULT門檻」），對齊回測simulate_portfolio_day逐筆
      掃描的規則——兩者只有「同一次poll內≥2檔不同標的同時合格」才會有差異；拿
      全部75天真實逐筆資料重放過這個情境，0次發生，理論落差消除、經驗機率原本
      就極低。單元測試見tests/test_momentum_rotation_entry_selection.py。
      2026-08-13盤中10:04-10:30真實事故（比前兩個更嚴重）：使用者發現當天4筆
      交易ledger自報ret_pct全部是正報酬（+6.14%加總），但broker權威成交價
      （get_order_results_detail）顯示4筆全部虧損（真實加總-1.82%），3筆連
      正負號都相反——根因是fill/exit_price從來沒用過真實成交價，_enter_position
      存的fill是理論觸發價（long_trigger/short_trigger）、_close_position的
      exit_price是最後觀察tick價/理論停利價，不是broker真實撮合價。這個bug
      也連帶讓daily_loss_limit_pct（-3%熔斷）用錯誤數字計算、可能該觸發時不觸發
      ——比前兩個bug更嚴重，牽涉風控機制本身。修復：新增
      fubon_futopt_orders.fetch_real_fill_price()（查get_order_results_detail
      的details陣列裡status=50那筆的after_price，市價單約780ms才會撮合完成，
      故有限次數重試），_enter_position/_close_position改用真實成交價，
      PositionState/trades_today新增fill_source/exit_source欄位留痕跡
      （"real" vs "theoretical_fallback"，查不到才退回理論價、且會被看到，
      不悄悄冒充精確數字）。已用今天已知的8筆真實成交（4筆進場+4筆出場）逐一
      回歸驗證、8/8比對正確；單元測試見tests/test_fubon_futopt_orders_fill_price.py
      （mock版本，鎖住status=50/10判斷、重試、API例外三種情境）。當天既有的4筆
      trades_today記錄也已用真實成交價人工回溯修正（date-scoped，只影響
      2026-08-13這天的ledger）。另外，10:04-10:11期間AI watch agent也抓到一個
      獨立於前兩個bug的現象：連續多次進場遇到broker「交易額度超過資(財)力證明
      額度」拒絕，判斷「常在搶佔後立即re-entry時發生，疑似保證金釋放延遲，非
      策略邏輯問題」，觸發kill switch暫停——這件事本身沒有code fix（mini帳戶
      總保證金只有30萬NTD，TMF/dayflip-short/momentum-rotation三個live sleeve
      共用同一份、無跨sleeve協調，見memory「mini帳戶總保證金30萬」），是否恢復
      交易需要使用者決定，不是bug。10:36再修一項（使用者要求「研究下單為什麼
      賠錢」後發現的根因）：把當天4筆真實交易的成交價拿去反推理論觸發價，發現
      進場滑價0.5%~2.7%（市價單IOC完全沒有價格保護），若零滑價4筆全部會贏、不
      是全輸——訊號方向邏輯沒問題，純粹是市價單追價太嚴重。改為限價單：新增
      order/momentum_rotation_tick_marketdata.py::fetch_live_quote()（查
      intraday.quote()的Level-1 bid/ask——這個repo沒有真正的Level-2五檔深度資料，
      連tmf_channel_order.py自己下限價單也是用spot±offset而非真實買賣二價，
      2026-08-13使用者確認這個限制後明確選擇用「Level-1+緩衝」逼近）+
      _compute_marketable_limit_price()（buy=ask+spread、sell=bid-spread，
      spread至少0.1%當緩衝下限）+ `_place_market_order`重構為`_place_order`
      （查不到報價才fallback回市價單，標記price_source="market_fallback_no_quote"
      留痕跡）。⚠️改限價單新增的風險：市價單幾乎必成交、限價IOC沒撮合到會直接
      取消零成交——`_enter_position`/`_close_position`都新增「送單成功但查不到
      真實成交紀錄=視為未成交」的檢查（entry不建倉、close不清空部位/不寫
      trades_today，沿用出場「絕不放棄重試」的既有原則），避免ledger出現
      broker端不存在的幻影部位。單元測試見
      tests/test_momentum_rotation_limit_order.py（含「送單成功但沒成交絕對不能
      建立部位」這條最危險的情境）。監控：
      :8770 儀表板「動能輪動」分頁（reports/research/channel_lab/live_v6_sim_server.py，
      com.jackm4.goldenstocks.tmf-sim-server）+ momentum-rotation-watch（見下條，
      08:40-13:45盤中每15分鐘AI異常掃描）。launchctl bootstrap 單獨安裝（未跑整支
      install-launchd.sh——該腳本因既有us-overnight-futures-sync.command缺檔而無法
      完整執行，屬既有問題，非本次新增；scripts/install-launchd.sh 的
      LABELS/TEMPLATES 已補上本job條目供下次修好後的完整安裝使用）。研究脈絡見
      reports/research/momentum_breakout_expert_pool_futures_summary.md（開頭
      「2026-08-13重大更新」章節有修正後定案數字，本檔原先寫的「可信估計約
      3.58%/天」已知無出處、不可信，不要再引用）。
      2026-08-13再推進一項（使用者明確要求「把websocket連上」）：新增
      order/momentum_rotation_websocket_feed.py，資料來源改成「優先訂閱
      futopt websocket 'trades'頻道（12檔共用一個連線）、新鮮度（30秒內收過
      訊息）不足才退回既有REST fetch_ticks_as_bars」，比照TMF sleeve
      tmf_channel_ws_feed.py同一套已在production驗證過的手法（見該檔
      docstring）。'trades'頻道已用momentum_rotation_websocket_trades_shadow.py
      實測確認Speed模式（跟live worker既有session同一個）沒有被擋、訊息格式
      跟REST trades()解析邏輯相容（重用同一組_normalize_tick/_dedupe_same_second）。
      Kill switch：ORDER_MOMENTUM_ROTATION_WS_MARKETDATA_ENABLED（預設0=關，
      跟TMF那支預設開不同——這支只跑過幾分鐘的2檔shadow smoke test，尚未走過
      一整個交易日驗證，比照這個repo「新機制先關閉觀察」的慣例）。單元測試見
      tests/test_momentum_rotation_websocket_feed.py。目前sleeve本身仍是
      dry-run（見上方11:04起AUTO_SUBMIT=0），這項改動不影響是否送真單，只影響
      訊號資料來源的即時性。

  - label: momentum-rotation-watch
    category: monitoring
    order_capable: false  # 自己不呼叫下單API；但可透過kill switch檔案間接觸發
      # momentum-rotation-poll既有的halted強制平倉路徑，見下方說明
    status: enabled
    enabled_since: "2026-08-12"
    schedule: "StartInterval 120s（2026-08-12使用者要求從900s縮短；launcher自濾 weekdays 08:40-13:45，盤中約150次呼叫/天）"
    description: >
      momentum-rotation-poll 盤中即時監看：headless claude -p 讀today's
      logs/intraday/momentum_rotation_*.log + ledger/broadcast json。判準核心原則
      （2026-08-12使用者明確交代）：觸發暫停不是看「有沒有賠錢」，是看「跟預期/
      研究文件描述的行為模式吻不吻合」——遇到沒訓練過、沒料到、程式碼沒有對應處理
      路徑的狀況，即使沒虧錢也當🚨處理；只有監控工具本身的操作性小狀況（log格式/
      暫時性讀檔問題）才允許agent自主排除，src/order/**、config/order.yaml、.env、
      worker重啟一律禁止agent自己動，全部走🚨流程。異常時：1) 寫
      data/research/momentum_rotation_ALERT_<date>.log 2) 寫
      data/order/momentum_rotation_kill_switch.json（date+reason）——
      momentum_rotation_order.py的reconcile_once下一輪poll（≈20秒內）讀到後轉成
      跟halted一樣的強制平倉+擋新進場路徑，AI只負責判斷+寫旗標，實際平倉沿用既有
      _close_position確定性程式碼，不讓AI直接呼叫下單API；旗標以date欄位自然過期，
      不需要刪檔。3) 呼叫scripts/notify_job_result.py寄信（含per-day dedup flag，
      避免每次poll重複騷擾）——worker自己的email alert機制沒有把noop_halted/
      closed_halted納入寄信名單，這是唯一會為熔斷事件通知使用者的管道。
      2026-08-12 使用者明確授權「email+自動kill switch都做」，同日23:xx部署
      （momentum-rotation-poll worker已kickstart重啟載入新碼）。2026-08-12建立，
      取代原本規劃錯誤的「每日14:00跑一次」設計（使用者更正：「監控agent 8:40就要
      一直跑到收盤才對」）。判準SSOT：scripts/launchd/momentum-rotation-watch-prompt.txt。
      launchctl bootstrap+enable 已完成（使用者遠端明確授權）。

