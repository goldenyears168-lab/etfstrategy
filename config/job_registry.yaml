# mini launchd job registry — single source of truth for "what's installed and can it trade".
# Update this whenever a job is added/paused/retired/reinstalled. For narrative history
# (incidents, decisions, dates), check git log on this file and deploy/mac-mini/ — this
# file itself is the quick-scan snapshot, not the story.
#
# order_capable: true means the job's code CAN submit a real broker order (grep-verified
# against AUTO_SUBMIT/place_order call sites — see 2026-07-29 audit). It does NOT mean the
# job currently will; check status + the .env flags for that.
# status: enabled | disabled (launchctl disable — persists across reboot/reinstall)
#
# generated: 2026-07-29 · reconciled 2026-08-04 (rrg-c18acc-poll fully retired) · 2026-08-02 against live launchctl list
# (retired ops-live-ta-poll/live-ta-kbar-sync; winbond→nightly-expert-digest;
#  added capitulation-oos-accumulate). Verified directly against mini
# (~/Library/LaunchAgents/*.plist + launchctl print-disabled), not from memory or docs.
# 2026-08-08: added dayflip-short-poll (order_capable, enabled since 2026-08-07 — was live
# on mini but missing from this SSOT list; verified against launchctl print-disabled + plist).

