      瓶頸（4折留一窗口交叉驗證常有3折崩潰到個位數~十幾筆交易，risk-adj
      變成不可信的-inf），需要擴大標的池增加訊號密度。同一份TAIFEX每日zip、
      不用另外下載，只是解析時收下全部326檔個股期貨（商品代號pattern
