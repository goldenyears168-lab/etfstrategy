      深度，已查證」是錯的——只查了REST（intraday.quote()確實只有Level-1）,
      沒實測WebSocket。實測發現session.sdk.marketdata.websocket_client.futopt
      訂閱{"channel":"books","symbol":...}會推真正五檔（bids/asks各5檔
      price+size），比照tmf_channel_ws_feed.py既有的候/candles訂閱模式即可
      用。仍然沒有歷史（channel只推「現在」的變動，沒有回放），且盤中實際
      更新頻率／是否逐tick不漏尚未在活躍交易時段驗證過，見memory
      「五檔兩條真來源」。TAIFEX免費資料能解決
      「完整、官方、可長期累積」這兩個問題，但**不含買賣方向欄位**（成交
      數量標記為(B+S)合併量，不分邊）——不是真正的order flow imbalance
      資料，跟現有Fubon逐筆同一個資訊等級，只是不會被50筆截斷、可以無限期
      累積。免費視窗只留前30個交易日，一天不跑就永久漏當天，一天兩次(16:30/
      20:00)降低單次失敗造成永久缺口的機率，比照nq-es-1m-accumulate同一個
      手法。⚠️ TX（大盤台指期貨）因為有夜盤、交易日認定橫跨午夜，依日曆日
      累積時筆數會忽多忽少（資料沒漏，只是分布不均勻）——12檔個股期貨無夜盤
      不受影響。純研究資料累積，不建立Fubon session、不碰下單邏輯、不影響
      任何order layer job。腳本：scripts/research/taifex_tick_daily_accumulate.py。
