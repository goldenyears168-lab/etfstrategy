    schedule: "weekdays 21:00 Asia/Taipei"
    order_capable: false
    description: "Read-only data-freshness health check on ops.* (holdings/snapshots/digests/live_ta), emails a report. No local/git access — Supabase MCP + Gmail MCP only."

