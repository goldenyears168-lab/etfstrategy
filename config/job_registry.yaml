    description: "現股漲停候選的五檔委託簿收集 · 唯讀 · 2026-09-02 建立。**走 TWSE MIS 公開 API，不佔富邦 ws 連線額度** —— mini 已有 5 條富邦 ws（tmf-channel-poll／momentum-rotation-poll／futopt-books-collect／futopt-books-collect-stocks／futopt-fill-listener），2026-09-01 09:51 第 6 條撞 Maximum number of connections reached、指數組日盤掉 52%，故本收集器刻意走另一條路。動機：漲停鎖不鎖得住取決於漲停價上「買方排隊量的補進速度」，逐筆成交只看得到隊列被吃掉多少、看不到補進多少；成交側那一半已實測判別力不足（consume AUC 0.34，IS/OOS 一致）。三層輪詢：掃描層每 300s 把 1971 檔宇宙輪一遍、漲幅 >=+6% 進候選名單（只加不減，上限 180）；候選層每 5s 取五檔；同儕層每 15s 取五檔（候選的統計同儕，上限 250，候選永遠優先佔位）。兩層的丟棄數都會 log、不靜默截斷。POLL_SEC=5 是保守值（MIS 是快照服務、公認約 5 秒更新），收集器自己統計重複快照率、每 10 分鐘印一次，第一天收完可用證據調。相同揭示時間+累積量+五檔的快照會去重不寫。請求間隔 0.35s 禮貌節流。輸出 ${GOLDENSTOCKS_DATA_DIR}/cache/limitup_books/limitup_books_YYYY-MM-DD.jsonl（含 lu_bid_qty＝漲停價買方排隊量、tier=cand/peer）。同儕表 _peer_map.json 由 build_peer_map.py 建（近 60 日日報酬相關最高 5 檔、要求相關 >0.3，2275 檔、最高相關中位 0.66），launcher 每 7 天自動重建。⚠️ 建同儕表時 close<=0 會讓 log 產生 -inf、NaN 污染整個相關矩陣（2026-09-03 踩過，已加 assert）。市場別對照表 _market_map.json 首次執行自動探測（2329 檔中 1971 檔在 MIS 上，其餘多為興櫃、本無漲跌停）。刻意不在 install-launchd.sh 的 LABELS 陣列，安裝方式見 scripts/launchd/limitup-books-collect.command 檔頭"

